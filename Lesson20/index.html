title=\"눌러서 듣기\">trazem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trouxeram\" title=\"눌러서 듣기\">trouxeram</span></td></tr></tbody></table></div><p>현재접속법은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"traga\" title=\"눌러서 듣기\">traga</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tragamos\" title=\"눌러서 듣기\">tragamos</span> …, 미래접속법은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trouxer\" title=\"눌러서 듣기\">trouxer</span> … 입니다.</p><h3>103. 제3활용 동사의 모음 변화</h3><h3>a. 가장 흔한 유형 (e → i, o → u)</h3><p>어간 모음이 e 또는 o인 대부분의 -ir 동사에서 <b>eu형과 접속법</b>의 어간 모음이 닫힌 i, u로 바뀌고, 나머지 형태(você, eles 등)는 원래 모음이 열린 소리(é, ó)로 남습니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>vestir (입히다) 현재</th><th>접속법</th><th>engolir (삼키다) 현재</th><th>접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"visto\" title=\"눌러서 듣기\">visto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vista\" title=\"눌러서 듣기\">vista</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engulo\" title=\"눌러서 듣기\">engulo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engula\" title=\"눌러서 듣기\">engula</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"veste\" title=\"눌러서 듣기\">veste</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vista\" title=\"눌러서 듣기\">vista</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engole\" title=\"눌러서 듣기\">engole</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engula\" title=\"눌러서 듣기\">engula</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vestimos\" title=\"눌러서 듣기\">vestimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vistamos\" title=\"눌러서 듣기\">vistamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engolimos\" title=\"눌러서 듣기\">engolimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engulamos\" title=\"눌러서 듣기\">engulamos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vestem\" title=\"눌러서 듣기\">vestem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vistam\" title=\"눌러서 듣기\">vistam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engolem\" title=\"눌러서 듣기\">engolem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"engulam\" title=\"눌러서 듣기\">engulam</span></td></tr></tbody></table></div><p>어간 모음 e 뒤에 <b>m·n</b>이 오는 동사는 eu형에서 바뀌고, 3인칭형에서는 닫힌 소리로 남습니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>sentir (느끼다) 현재</th><th>접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sinto\" title=\"눌러서 듣기\">sinto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sinta\" title=\"눌러서 듣기\">sinta</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sente\" title=\"눌러서 듣기\">sente</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sinta\" title=\"눌러서 듣기\">sinta</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sentimos\" title=\"눌러서 듣기\">sentimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sintamos\" title=\"눌러서 듣기\">sintamos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sentem\" title=\"눌러서 듣기\">sentem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sintam\" title=\"눌러서 듣기\">sintam</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>vestir처럼 e가 어간 모음인 -ir 동사는 대부분 이 유형이라고 보면 됩니다(예외는 있음). o가 어간 모음인 동사(engolir 등)는 수가 적지만 구어에서 자주 쓰입니다. 어간 모음이 강세 i 앞에 오면 e가 i처럼, o가 u처럼 소리가 납니다.</div><h3>b. 둘째 유형 (u → o)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>subir (올라가다)</th><th>sumir (사라지다)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"subo\" title=\"눌러서 듣기\">subo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sumo\" title=\"눌러서 듣기\">sumo</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sobe\" title=\"눌러서 듣기\">sobe</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"some\" title=\"눌러서 듣기\">some</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"subimos\" title=\"눌러서 듣기\">subimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sumimos\" title=\"눌러서 듣기\">sumimos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sobem\" title=\"눌러서 듣기\">sobem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"somem\" title=\"눌러서 듣기\">somem</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>u 뒤에 m·n이 오는 동사는 모음이 닫힌 채로 유지됩니다(some [ô]). 이 유형은 열 개 남짓이지만 중요한 동사가 있어요. 접속법은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"suba\" title=\"눌러서 듣기\">suba</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"suma\" title=\"눌러서 듣기\">suma</span> 입니다.</div><h3>104. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o correio\" title=\"눌러서 듣기\">o correio</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o vestido\" title=\"눌러서 듣기\">o vestido</span> <span class=\"slash\">/</
