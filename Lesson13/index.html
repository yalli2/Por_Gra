ndex=\"0\" data-say=\"dissemos\" title=\"눌러서 듣기\">dissemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dissermos\" title=\"눌러서 듣기\">dissermos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dizem\" title=\"눌러서 듣기\">dizem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"disseram\" title=\"눌러서 듣기\">disseram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"disserem\" title=\"눌러서 듣기\">disserem</span></td></tr></tbody></table></div><h3>69. dizer의 쓰임</h3><ul class=\"rules\"><li><b>dizer</b> = (직접·간접) 인용을 '말하다', 또 '~하라고 말하다(명령)'.</li><li><b>contar</b> = 이야기를 '들려주다', 또는 거짓말을 하다.</li><li><b>falar</b> = 말하다(목적어가 있든 없든), 이야기하다. 리우에서는 dizer 자리에 falar를 자주 씁니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele disse que vai.\" title=\"눌러서 듣기\">Ele disse que vai.</span><span class=\"k\">그는 간다고 말했다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele me disse isso.\" title=\"눌러서 듣기\">Ele me disse isso.</span><span class=\"k\">그는 나에게 그렇게 말했다.</span></li></ul><h3>70. 전치사 뒤의 동사 형태</h3><p>아주 드문 예외 하나를 빼면, <b>모든 전치사 뒤의 동사는 원형(infinitivo)</b> 입니다. 영어의 -ing 형태에 해당하는 말도 원형으로 써요.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"antes de entrar\" title=\"눌러서 듣기\">antes de entrar</span><span class=\"k\">들어가기 전에</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"para dizer\" title=\"눌러서 듣기\">para dizer</span><span class=\"k\">말하기 위해</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"depois de comer\" title=\"눌러서 듣기\">depois de comer</span><span class=\"k\">먹은 후에</span></li></ul><h3>71. 3인칭 직접목적어 (him, her, them, it)</h3><p>구어체 브라질 포르투갈어(BF)에서는 강세가 없는 '그를, 그녀를, 그것을, 그들을'을 <b>거의 말하지 않고 생략</b>합니다. 대조나 강조가 필요할 때는 <b>주어 형태 ele, ela, eles, elas</b>를 목적어 자리에 씁니다. 중성(어떤 일·사실)은 <b>isso</b>.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>약한 형태(문어)</th><th>강한 형태(구어)</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o\" title=\"눌러서 듣기\">o</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ele\" title=\"눌러서 듣기\">ele</span></td><td>그를, 그것을 (남성)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ela\" title=\"눌러서 듣기\">ela</span></td><td>그녀를, 그것을 (여성)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os\" title=\"눌러서 듣기\">os</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eles\" title=\"눌러서 듣기\">eles</span></td><td>그들을</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as\" title=\"눌러서 듣기\">as</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"elas\" title=\"눌러서 듣기\">elas</span></td><td>그녀들을</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o\" title=\"눌러서 듣기\">o</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"isso\" title=\"눌러서 듣기\">isso</span></td><td>그것을 (일·사실)</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>문법학자들은 이 구어 용법을 틀렸다고 보지만, 중세부터 있었고 브라질 말에서 정착했습니다. 약한 형태 o, a는 모음과 부딪혀 소리가 사라지기 쉬워서 생략되는 경우가 많아요. 말에서는 문장 구조를 바꿔 모호함을 피합니다.</div><p>문어나 정중한 표현에서는 <b>원형 뒤에 붙는 형태</b>가 쓰입니다. 원형의 -r이 떨어지고, 그 앞 모음에 악센트가 붙으며(-ar, -er 동사), 대명사는 <b>l-</b>로 시작합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Muito prazer em conhecê-lo.\" title=\"눌러서 듣기\">Muito prazer em conhecê-lo.</span><span class=\"k\">만나서 반갑습니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Antes de fazê-lo.\" title=\"눌러서 듣기\">Antes de fazê-lo.</span><span class=\"k\">그것을 하기 전에.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você quer levá-las?\" title=\"눌러서 듣기\">Você quer levá-las?</span><span class=\"k\">그것들을 가져가시겠어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vou abri-los.\" title=\"눌러서 듣기\">Vou abri-los.</span><span class=\"k\">그것들을 열 거예요.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>이 중에서 실제로 자주 듣게 되는 것은 첫 번째 인사말 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Muito prazer em conhecê-lo(a).\" title=\"눌러서 듣기\">Muito prazer em conhecê-lo(a).</span> 입니다.</div><h3>72. 규칙 비교급과 최상급</h3><p>형용사·부사 앞에 <b>mais</b>를 붙이면 비교급입니다. <b>정관사(또는 소유형용사) + mais</b>는 최상급입니다. 부사의 최상급에서 관사는 뒤에 수식어가 따를 때만 씁니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원급</th><th>비교급</th><th>최상급</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bonito\" title=\"눌러서 듣기\">bonito</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mais bonito\" title=\"눌러서 듣기\">mais bonito</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mais bonito\" title=\"눌러서 듣기\">o mais bonito</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"frio\" title=\"눌러서 듣기\">frio</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mais frio\" title=\"눌러서 듣기\">mais frio</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mais frio\" title=\"눌러서 듣기\">o mais frio</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"perto\" title=\"눌러서 듣기\">perto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mais perto\" title=\"눌러서 듣기\">mais perto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mais perto possível\" title=\"눌러서 듣기\">o mais perto possível</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"devagar\" title=\"눌러서 듣기\">devagar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mais devagar\" title=\"눌러서 듣기\">mais devagar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mais devagar que se possa imaginar\" title=\"눌러서 듣기\">o mais devagar que se possa imaginar</span></td></tr></tbody></table></div><h3>73. 불규칙 비교급·최상급</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원급</th><th>비교급</th><th>최상급</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bom\" title=\"눌러서 듣기\">bom</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"melhor\" title=\"눌러서 듣기\">melhor</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o melhor\" title=\"눌러서 듣기\">o melhor</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mau\" title=\"눌러서 듣기\">mau</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ruim\" title=\"눌러서 듣기\">ruim</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pior\" title=\"눌러서 듣기\">pior</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o pior\" title=\"눌러서 듣기\">o pior</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"grande\" title=\"눌러서 듣기\">grande</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"maior\" title=\"눌러서 듣기\">maior</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o maior\" title=\"눌러서 듣기\">o maior</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pequeno\" title=\"눌러서 듣기\">pequeno</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"menor\" title=\"눌러서 듣기\">menor</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o menor\" title=\"눌러서 듣기\">o menor</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"muito\" title=\"눌러서 듣기\"
