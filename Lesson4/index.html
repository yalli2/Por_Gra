index=\"0\" data-say=\"irmão → irmãos\" title=\"눌러서 듣기\">irmão → irmãos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mão → mãos\" title=\"눌러서 듣기\">mão → mãos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"órfão → órfãos\" title=\"눌러서 듣기\">órfão → órfãos</span></td><td>형제 / 손 / 고아</td></tr></tbody></table></div><h3>b. -s로 끝나고 강세가 마지막 모음이 아닌 말: <b>단수 = 복수</b></h3><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"o ônibus → os ônibus\" title=\"눌러서 듣기\">o ônibus → os ônibus</span><span class=\"k\">버스</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"o lápis → os lápis\" title=\"눌러서 듣기\">o lápis → os lápis</span><span class=\"k\">연필</span></li></ul><h3>c. -l로 끝나는 말 (-il 제외): l을 떼고 <b>-is</b></h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>단수</th><th>복수</th><th>비고</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"animal\" title=\"눌러서 듣기\">animal</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"animais\" title=\"눌러서 듣기\">animais</span></td><td>—</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"azul\" title=\"눌러서 듣기\">azul</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"azuis\" title=\"눌러서 듣기\">azuis</span></td><td>—</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"motel\" title=\"눌러서 듣기\">motel</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"motéis\" title=\"눌러서 듣기\">motéis</span></td><td>열린 e → éi는 악센트를 써요</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"espanhol\" title=\"눌러서 듣기\">espanhol</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"espanhóis\" title=\"눌러서 듣기\">espanhóis</span></td><td>열린 o → ói는 악센트를 써요</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fiel\" title=\"눌러서 듣기\">fiel</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fiéis\" title=\"눌러서 듣기\">fiéis</span></td><td>—</td></tr></tbody></table></div><h3>d. -il로 끝나는 말</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>조건</th><th>예</th></tr></thead><tbody><tr><td>마지막 음절에 강세 → -is</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"barril → barris\" title=\"눌러서 듣기\">barril → barris</span></td></tr><tr><td>강세가 다른 음절 → -eis</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil → fáceis\" title=\"눌러서 듣기\">fácil → fáceis</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"útil → úteis\" title=\"눌러서 듣기\">útil → úteis</span></td></tr></tbody></table></div><h3>21. 형용사의 여성형, 부사 -mente</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>유형</th><th>남성</th><th>여성</th></tr></thead><tbody><tr><td>-o → -a</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aberto\" title=\"눌러서 듣기\">aberto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aberta\" title=\"눌러서 듣기\">aberta</span></td></tr><tr><td>남녀 같은 형태(-e, -m, -l 등)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"doente\" title=\"눌러서 듣기\">doente</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comum\" title=\"눌러서 듣기\">comum</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"azul\" title=\"눌러서 듣기\">azul</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil\" title=\"눌러서 듣기\">fácil</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"doente\" title=\"눌러서 듣기\">doente</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comum\" title=\"눌러서 듣기\">comum</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"azul\" title=\"눌러서 듣기\">azul</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil\" title=\"눌러서 듣기\">fácil</span></td></tr><tr><td>국적(자음 끝) + -a</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"português\" title=\"눌러서 듣기\">português</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"espanhol\" title=\"눌러서 듣기\">espanhol</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"portuguesa\" title=\"눌러서 듣기\">portuguesa</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"espanhola\" title=\"눌러서 듣기\">espanhola</span></td></tr><tr><td>불규칙</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bom\" title=\"눌러서 듣기\">bom</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mau\" title=\"눌러서 듣기\">mau</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"alemão\" title=\"눌러서 듣기\">alemão</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"boa\" title=\"눌러서 듣기\">boa</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"má\" title=\"눌러서 듣기\">má</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"alemã\" title=\"눌러서 듣기\">alemã</span></td></tr></tbody></table></div><p>여성형에 <b>-mente</b>를 붙이면 영어의 -ly 같은 <b>부사</b>가 됩니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>형용사(여성형)</th><th>부사</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aberta\" title=\"눌러서 듣기\">aberta</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abertamente\" title=\"눌러서 듣기\">abertamente</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fria\" title=\"눌러서 듣기\">fria</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"friamente\" title=\"눌러서 듣기\">friamente</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil\" title=\"눌러서 듣기\">fácil</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"facilmente\" title=\"눌러서 듣기\">facilmente</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comum\" title=\"눌러서 듣기\">comum</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comumente\" title=\"눌러서 듣기\">comumente</span></td></tr></tbody></table></div><h3>22. ser (이다) 현재형</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>ser</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sou\" title=\"눌러서 듣기\">sou</span></td><td>나는 ~이다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"é\" title=\"눌러서 듣기\">é</span></td><td>그는 ~이다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"somos\" title=\"눌러서 듣기\">somos</span></td><td>우리는 ~이다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"são\" title=\"눌러서 듣기\">são</span></td><td>그들은 ~이다</td></tr></tbody></table></div><h3>23. ser와 estar의 쓰임 (Uses of ser and estar)</h3><ul class=\"rules\"><li><b>estar만</b> 진행형을 만듭니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está falando.\" title=\"눌러서 듣기\">Ele está falando.</span></li><li><b>ser</b>는 수동태를 만듭니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A porta é aberta (pelo menino).\" title=\"눌러서 듣기\">A porta é aberta (pelo menino).</span></li><li><b>ser</b> = 평소의 모습, 영속적 성질·상태. <b>estar</b> = 일시적이거나 방금 변한 상태.</li><li>서술어가 명사·대명사면 거의 항상 ser: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"É um animal.\" title=\"눌러서 듣기\">É um animal.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Somos nós.\" title=\"눌러서 듣기\">Somos nós.</span></li><li>서술어가 형용사면 위 원칙으로 선택합니다.</li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>ser (본질·영속)</th><th>estar (일시·변화)</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele é doentio. (병약한 사람)\" title=\"눌러서 듣기\">Ele é doentio. (병약한 사람)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está doente. (지금 아프다)\" title=\"눌러서 듣기\">Ele está doente. (지금 아프다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O gelo é frio. (얼음은 차다)\" title=\"눌러서 듣기\">O gelo é frio. (얼음은 차다)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A água está fria. (물이 차다)\" title=\"눌러서 듣기\">A água está fria. (물이 차다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu sou rico. (부자다)\" title=\"눌러서 듣기\">Eu sou rico. (부자다)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Estou rico. (복권에 당첨돼 부자가 됐다)\" title=\"눌러서 듣기\">Estou rico. (복권에 당첨돼 부자가 됐다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"João é casado. (기혼자)\" title=\"눌러서 듣기\">João é casado. (기혼자)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Os noivos já estão casados. (방금 결혼했다)\" title=\"눌러서 듣기\">Os noivos já estão casados. (방금 결혼했다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ela é bonita. (예쁜 사람)\" title=\"눌러서 듣기\">Ela é bonita. (예쁜 사람)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ela está bonita. (오늘 예뻐 보인다)\" title=\"눌러서 듣기\">Ela está bonita. (오늘 예뻐 보인다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A porta é aberta pelo menino. (수동)\" title=\"눌러서 듣기\">A porta é aberta pelo menino. (수동)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A porta está aberta. (열려 있다)\" title=\"눌러서 듣기\">A porta está aberta. (열려 있다)</span></td></tr></tbody></table></div><p><b>위치</b>를 말할 때도 기준은 같습니다. 고정되어 변하지 않는 위치는 ser 또는 ficar, 바뀔 수 있는 위치는 estar입니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A cadeira está perto da porta.\" title=\"눌러서 듣기\">A cadeira está perto da porta.</span><span class=\"k\">의자는 문 근처에 있다. (옮길 수 있음)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A cidade é perto daqui. // A cidade fica perto daqui.\" title=\"눌러서 듣기\">A cidade é perto daqui. // A cidade fica perto daqui.</span><span class=\"k\">도시는 여기서 가깝다. (고정)</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>스페인어와 쓰임이 일부 다릅니다. 포르투갈어는 '위치가 고정이냐 아니냐'로 ser/estar/ficar를 가릅니다.</div><h3>24. ser 뒤의 부정관사 생략</h3><p>ser 뒤에 <b>수식어가 없는 명사·형용사</b>가 오면 부정관사를 쓰지 않습니다. 수식어가 붙으면 보통 쓰지만, 한 덩어리 개념이면 생략하기도 해요.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele é inglês.\" title=\"눌러서 듣기\">Ele é inglês.</span><span class=\"k\">그는 영국인이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ela é uma professora portuguesa.\" title=\"눌러서 듣기\">Ela é uma professora portuguesa.</span><span class=\"k\">그녀는 포르투갈 출신 선생님이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele é bom estudante.\" title=\"눌러서 듣기\">Ele é bom estudante.</span><span class=\"k\">그는 좋은 학생이다.</span></li></ul><h3>25. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a lição\" title=\"눌러서 듣기\">a lição</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o pão\" title=\"눌러서 듣기\">o pão</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o cão\" title=\"눌러서 듣기\">o cão</span></td><td>수업 / 빵 / 개</td></tr><
