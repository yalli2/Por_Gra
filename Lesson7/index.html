과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 7, "slug": "Lesson7", "label": "Lesson VII", "pt": "O verbo ter e os possessivos", "ko": "ter 동사, 소유형용사 meu·nosso·seu, 요일", "en": "ter · idioms with ter · possessives (1st & 2nd person) · days of the week", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>ter(가지다)</b> 는 '있다·~해야 한다·~가 있다(존재)' 등 쓰임이 아주 많은 동사입니다. 또 '나의, 우리의, 당신의'를 뜻하는 소유형용사를 배웁니다.</p><h3>37. 불규칙 동사 ter (가지다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>ter</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenho\" title=\"눌러서 듣기\">tenho</span></td><td>나는 가지고 있다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tem\" title=\"눌러서 듣기\">tem</span></td><td>그는 가지고 있다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"temos\" title=\"눌러서 듣기\">temos</span></td><td>우리는 가지고 있다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"têm\" title=\"눌러서 듣기\">têm</span></td><td>그들은 가지고 있다</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>복수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"têm\" title=\"눌러서 듣기\">têm</span>은 소리가 단수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tem\" title=\"눌러서 듣기\">tem</span>과 같고, 악센트(^)로 글에서만 구별합니다. 두 형태 모두 명령형으로도 쓰입니다.</div><h3>38. ter의 쓰임 (Uses of ter)</h3><ul class=\"rules\"><li><b>ter que (de) + 원형</b> = ~해야 한다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu tenho que trabalhar.\" title=\"눌러서 듣기\">Eu tenho que trabalhar.</span></li><li><b>ter + 명사 + para + 원형</b> = ~할 ~이 있다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele tem uma lição para estudar.\" title=\"눌러서 듣기\">Ele tem uma lição para estudar.</span></li><li><b>Tem</b> (항상 단수, 주어 없음) = ~이 있다. 뒤에 오는 명사는 목적어라서 복수여도 동사는 변하지 않습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tem meninos aqui?\" title=\"눌러서 듣기\">Tem meninos aqui?</span> — <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não tem, não.\" title=\"눌러서 듣기\">Não tem, não.</span></li><li><b>몸·마음의 상태</b>: ter + 명사. 구어에서는 <b>estar com + 명사</b>도 많이 씁니다.</li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>상태</th><th>ter + 명사</th><th>estar com + 명사</th></tr></thead><tbody><tr><td>춥다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho frio.\" title=\"눌러서 듣기\">Tenho frio.</span></td><td>Estou com frio.</td></tr><tr><td>덥다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Temos calor.\" title=\"눌러서 듣기\">Temos calor.</span></td><td>Estamos com calor.</td></tr><tr><td>무섭다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele tem muito medo.\" title=\"눌러서 듣기\">Ele tem muito medo.</span></td><td>—</td></tr><tr><td>졸리다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho sono.\" title=\"눌러서 듣기\">Tenho sono.</span></td><td>Estou com sono.</td></tr><tr><td>배고프다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho fome.\" title=\"눌러서 듣기\">Tenho fome.</span></td><td>Estou com fome.</td></tr><tr><td>목마르다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho sede.\" title=\"눌러서 듣기\">Tenho sede.</span></td><td>Estou com sede.</td></tr><tr><td>서두르다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho pressa.\" title=\"눌러서 듣기\">Tenho pressa.</span></td><td>Estou com pressa.</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>이 밖에 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter sorte\" title=\"눌러서 듣기\">ter sorte</span>(운이 좋다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter azar\" title=\"눌러서 듣기\">ter azar</span>(운이 나쁘다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter razão\" title=\"눌러서 듣기\">ter razão</span>(옳다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter raiva (de)\" title=\"눌러서 듣기\">ter raiva (de)</span>(화나다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter vergonha (de)\" title=\"눌러서 듣기\">ter vergonha (de)</span>(부끄럽다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter vontade (de)\" title=\"눌러서 듣기\">ter vontade (de)</span>(~하고 싶다)도 같은 방식이에요.</div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Que é que ele tem?\" title=\"눌러서 듣기\">Que é que ele tem?</span><span class=\"k\">그는 어디가 안 좋아요? (무슨 일이에요?)</span></li></ul><h3>39. 소유형용사·소유대명사: 1인칭</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>단수</th><th>복수</th></tr></thead><tbody><tr><td>나의 (남성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"meu\" title=\"눌러서 듣기\">meu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"meus\" title=\"눌러서 듣기\">meus</span></td></tr><tr><td>나의 (여성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"minha\" title=\"눌러서 듣기\">minha</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"minhas\" title=\"눌러서 듣기\">minhas</span></td></tr><tr><td>우리의 (남성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nosso\" title=\"눌러서 듣기\">nosso</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nossos\" title=\"눌러서 듣기\">nossos</span></td></tr><tr><td>우리의 (여성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nossa\" title=\"눌러서 듣기\">nossa</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nossas\" title=\"눌러서 듣기\">nossas</span></td></tr></tbody></table></div><p>소유형용사는 <b>뒤에 오는 명사의 성·수에 일치</b>합니다(소유자의 성이 아니에요). 앞에 정관사를 붙여도 되고 안 붙여도 뜻은 같습니다. 단, <b>다음 두 경우에는 정관사를 쓰지 않습니다</b>.</p><ul class=\"rules\"><li>부르는 말(호격): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Meus amigos, como vão?\" title=\"눌러서 듣기\">Meus amigos, como vão?</span></li><li>친족 명사(아버지, 어머니, 사촌 등): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Meu pai vai trabalhar.\" title=\"눌러서 듣기\">Meu pai vai trabalhar.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Meu primo é americano.\" title=\"눌러서 듣기\">Meu primo é americano.</span></li></ul><p>명사 없이 <b>소유대명사</b>로 쓸 때는 반드시 관사와 함께 씁니다(ser 뒤는 제외): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o meu\" title=\"눌러서 듣기\">o meu</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a nossa\" title=\"눌러서 듣기\">a nossa</span>.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A casa de João e a minha.\" title=\"눌러서 듣기\">A casa de João e a minha.</span><span class=\"k\">조앙의 집과 내 집.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A casa branca é minha.\" title=\"눌러서 듣기\">A casa branca é minha.</span><span class=\"k\">그 흰 집은 내 것이다. (소유 강조)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A casa branca é a minha.\" title=\"눌러서 듣기\">A casa branca é a minha.</span><span class=\"k\">그 흰 집이 내 집이다. (어느 집인지 강조)</span></li></ul><h3>40. 소유형용사: 2인칭 (você, o senhor 등)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>단수</th><th>복수</th></tr></thead><tbody><tr><td>당신의 (남성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seu\" title=\"눌러서 듣기\">seu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seus\" title=\"눌러서 듣기\">seus</span></td></tr><tr><td>당신의 (여성 명사)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sua\" title=\"눌러서 듣기\">sua</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"suas\" title=\"눌러서 듣기\">suas</span></td></tr></tbody></table></div><p>seu/sua는 você, vocês, o senhor, a senhora 등 <b>모든 '당신(들)'</b> 을 가리킬 수 있습니다. 관사는 1인칭과 같은 방식으로 쓰거나 생략합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"(o) seu livro\" title=\"눌러서 듣기\">(o) seu livro</span><span class=\"k\">당신의 책</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"(a) sua casa\" title=\"눌러서 듣기\">(a) sua casa</span><span class=\"k\">당신의 집</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A casa de João e a sua.\" title=\"눌러서 듣기\">A casa de João e a sua.</span><span class=\"k\">조앙의 집과 당신의 집.</span></li></ul><h3>41. 요일과 시간 표현</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>요일</th><th>포르투갈어</th></tr></thead><tbody><tr><td>월요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"segunda-feira\" title=\"눌러서 듣기\">segunda-feira</span></td></tr><tr><td>화요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"terça-feira\" title=\"눌러서 듣기\">terça-feira</span></td></tr><tr><td>수요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quarta-feira\" title=\"눌러서 듣기\">quarta-feira</span></td></tr><tr><td>목요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quinta-feira\" title=\"눌러서 듣기\">quinta-feira</span></td></tr><tr><td>금요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sexta-feira\" title=\"눌러서 듣기\">sexta-feira</span></td></tr><tr><td>토요일</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sábado\" title=\"눌러서 듣기\">sábado</span></td></tr><tr><td>일요일</td><td><span class=\"p
