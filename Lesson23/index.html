과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 23, "slug": "Lesson23", "label": "Lesson XXIII", "pt": "Subjuntivos irregulares, particípios e voz passiva", "ko": "불규칙 현재접속법, 감정의 접속법, 과거분사, 수동태", "en": "irregular present subjunctives · subjunctive of emotion · past participles · passive voice", "part": "Part 4 · 접속법과 복합 구문 (Lesson XXII–XXVIII)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>접속법 만드는 규칙(eu형 − o + 어미)에서 <b>벗어나는 7개 동사</b>를 외우고, <b>감정을 나타내는 말 뒤의 접속법</b>, <b>과거분사</b>와 <b>수동태</b>를 배웁니다.</p><h3>113. 불규칙 현재접속법 (7개 동사)</h3><p>eu형이 -o로 끝나지 않거나 규칙에서 벗어나는 동사들입니다. <b>하나씩 외워야</b> 합니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>ser</th><th>estar</th><th>ir</th><th>dar</th><th>saber</th><th>querer</th></tr></thead><tbody><tr><td>que eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seja\" title=\"눌러서 듣기\">seja</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esteja\" title=\"눌러서 듣기\">esteja</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vá\" title=\"눌러서 듣기\">vá</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dê\" title=\"눌러서 듣기\">dê</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saiba\" title=\"눌러서 듣기\">saiba</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queira\" title=\"눌러서 듣기\">queira</span></td></tr><tr><td>que você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seja\" title=\"눌러서 듣기\">seja</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esteja\" title=\"눌러서 듣기\">esteja</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vá\" title=\"눌러서 듣기\">vá</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dê\" title=\"눌러서 듣기\">dê</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saiba\" title=\"눌러서 듣기\">saiba</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queira\" title=\"눌러서 듣기\">queira</span></td></tr><tr><td>que nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sejamos\" title=\"눌러서 듣기\">sejamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estejamos\" title=\"눌러서 듣기\">estejamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vamos\" title=\"눌러서 듣기\">vamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"demos\" title=\"눌러서 듣기\">demos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saibamos\" title=\"눌러서 듣기\">saibamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queiramos\" title=\"눌러서 듣기\">queiramos</span></td></tr><tr><td>que vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sejam\" title=\"눌러서 듣기\">sejam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estejam\" title=\"눌러서 듣기\">estejam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vão\" title=\"눌러서 듣기\">vão</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deem\" title=\"눌러서 듣기\">deem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saibam\" title=\"눌러서 듣기\">saibam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queiram\" title=\"눌러서 듣기\">queiram</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>일곱 번째 동사는 <b>haver</b>로 현재접속법이 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"haja\" title=\"눌러서 듣기\">haja</span>입니다(다음에 배움). <b>ir</b>의 nós형은 직설법과 같은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vamos\" title=\"눌러서 듣기\">vamos</span>, 3인칭 복수는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vão\" title=\"눌러서 듣기\">vão</span>입니다. <b>dar</b>의 복수형은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deem\" title=\"눌러서 듣기\">deem</span>(옛 철자 dêem)이에요.</div><h3>114. 감정의 접속법 (Subjunctive of emotion)</h3><p>감정을 나타내는 동사·표현 뒤 종속절은, <b>두 동사의 주어가 다를 때 접속법</b>입니다. 주어가 같으면 <b>원형</b>을 쓰지만 접속법도 가능합니다. 미래접속법은 감정 표현 뒤에 쓰지 않고 <b>현재접속법</b>을 씁니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu sinto que ele não possa ir.\" title=\"눌러서 듣기\">Eu sinto que ele não possa ir.</span><span class=\"k\">그가 갈 수 없어서 유감이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu sinto não poder ir. // Eu sinto que eu não possa ir.\" title=\"눌러서 듣기\">Eu sinto não poder ir. // Eu sinto que eu não possa ir.</span><span class=\"k\">내가 갈 수 없어서 유감이다.</span></li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>표현</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sentir (que)\" title=\"눌러서 듣기\">sentir (que)</span></td><td>유감이다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esperar (que)\" title=\"눌러서 듣기\">esperar (que)</span></td><td>바라다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tomara (que)\" title=\"눌러서 듣기\">tomara (que)</span></td><td>~했으면 좋겠다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"temer (que)\" title=\"눌러서 듣기\">temer (que)</span></td><td>두려워하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"surpreender(-me) (que)\" title=\"눌러서 듣기\">surpreender(-me) (que)</span></td><td>(내가) 놀랍다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter pena (que)\" title=\"눌러서 듣기\">ter pena (que)</span></td><td>안타깝다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter medo (que)\" title=\"눌러서 듣기\">ter medo (que)</span></td><td>무섭다, 걱정되다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"É pena (que)\" title=\"눌러서 듣기\">É pena (que)</span></td><td>유감이다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estar contente (que)\" title=\"눌러서 듣기\">estar contente (que)</span></td><td>기쁘다</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Tomara que chova.\" title=\"눌러서 듣기\">Tomara que chova.</span><span class=\"k\">비가 오면 좋겠다.</span></li></ul><h3>115. 과거분사 (The past participle)</h3><p>규칙 과거분사는 <b>-ar 동사: -ado, -er·-ir 동사: -ido</b>를 붙입니다. 완료시제(다음 과 이후)의 일부로 쓰이지 않으면 <b>수식하는 명사와 성·수가 일치</b>합니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형</th><th>과거분사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falar\" title=\"눌러서 듣기\">falar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falado\" title=\"눌러서 듣기\">falado</span></td><td>말해진</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comer\" title=\"눌러서 듣기\">comer</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comido\" title=\"눌러서 듣기\">comido</span></td><td>먹힌</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ouvir\" title=\"눌러서 듣기\">ouvir</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ouvido\" title=\"눌러서 듣기\">ouvido</span></td><td>들린</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Essa língua é falada lá.\" title=\"눌러서 듣기\">Essa língua é falada lá.</span><span class=\"k\">그 언어는 거기서 쓰인다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É uma conversa ouvida na rua.\" title=\"눌러서 듣기\">É uma conversa ouvida na rua.</span><span class=\"k\">길에서 들은 이야기다.</span></li></ul><h3>116. 불규칙 과거분사</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형</th><th>과거분사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vindo\" title=\"눌러서 듣기\">vindo</span></td><td>온</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ganhar\" title=\"눌러서 듣기\">ganhar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ganho\" title=\"눌러서 듣기\">ganho</span></td><td>이긴, 번</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ver\" title=\"눌러서 듣기\">ver</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"visto\" title=\"눌러서 듣기\">visto</span></td><td>본</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entregar\" title=\"눌러서 듣기\">entregar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entregue\" title=\"눌러서 듣기\">entregue</span></td><td>전달된</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dizer\" title=\"눌러서 듣기\">dizer</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dito\" title=\"눌러서 듣기\">dito</span></td><td>말한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôr\" title=\"눌러서 듣기\">pôr</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"posto\" title=\"눌러서 듣기\">posto</span></td><td>놓인</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazer\" title=\"눌러서 듣기\">fazer</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"feito\" title=\"눌러서 듣기\">feito</span></td><td>한, 만든</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrir\" title=\"눌러서 듣기\">abrir</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aberto\" title=\"눌러서 듣기\">aberto</span></td><td>열린</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"escrever\" title=\"눌러서 듣기\">escrever</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"escrito\" title=\"눌러서 듣기\">escrito</span></td><td>쓴</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cobrir\" title=\"눌러서 듣기\">cobrir</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"coberto\" title=\"눌러서 듣기\">coberto</span></td><td>덮인</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><b>ganhar, entregar</b> 등에는 규칙형(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ganhado\" title=\"눌러서 듣기\">ganhado</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entregado\" title=\"눌러서 듣기\">entregado</span>)도 있지만 구어에서는 불규칙형 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ganho\" title=\"눌러서 듣기\">ganho</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entregue\" title=\"눌러서 듣기\">entregue</span>를 씁니다. 또 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"posto\" title=\"눌러서 듣기\">posto</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aberto\" title=\"눌러서 듣기\">aberto</span>의 강세 모음은 복수·여성형에서 열린 소리가 됩니다.</div><h3>117. 수동태 (The passive voice)</h3><p><b>ser + 과거분사</b>로 만들고, 과거분사는 <b>주어와 성·수가 일치</b>합니다. 포르투갈어는 다른 로망스어와 달리 영어만큼 수동태를 자주 씁니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"João foi chamado.\" title=\"눌러서 듣기\">João foi chamado.</span><span class=\"k\">조앙은 불려졌다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A carta foi recebida.\" title=\"눌러서 듣기\">A carta foi recebida.</span><span class=\"k\">편지는 받아졌다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"As bananas foram entregues.\" title=\"눌러서 듣기\">As bananas foram entregues.</span><span class=\"k\">바나나는 배달되었다.</span></li></ul><p>분사가 영속적인 상태를 나타낼 때는 수동태가 아니어도 ser를 쓸 수 있습니다. 또 영어의 'get + 과거분사'는 <b>ficar + 과거분사</b>로 말합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Fiquei perdido.\" title=\"눌러서 듣기\">Fiquei perdido.</span><span class=\"k\">나는 길을 잃었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Meu amigo ficou cansado.\" title=\"눌러서 듣기\">Meu amigo ficou cansado.</span><span class=\"k\">내 친구는 지쳤다.</span></li></ul><h3>118. 이 과의 어휘 (지리)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a língua\" title=\"눌러서 듣기\">a língua</span></td><td>언어, 혀</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a selva\" title=\"눌러서 듣기\">a selva</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mato\" title=\"눌러서 듣기\">o mato</span></td><td>정글 / 덤불숲</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a serra\" title=\"눌러서 듣기\">a serra</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o morro\" title=\"눌러서 듣기\">o morro</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a montanha\" title=\"눌러서 듣기\">a montanha</span></td><td>산맥 / 언덕 / 산</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o distrito\" title=\"눌러서 듣기\">o distrito</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a capital\" title=\"눌러서 듣기\">a capital</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o centro\" title=
