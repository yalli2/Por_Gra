em</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"creem\" title=\"눌러서 듣기\">creem</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>나머지 시제는 규칙입니다. (교재의 옛 철자 lêem, crêem은 현재 leem, creem으로 씁니다.)</div><h3>99. 현재접속법의 형태 (Present subjunctive)</h3><p><b>현재 직설법 1인칭 단수(eu형)에서 끝의 -o를 떼고</b>, 활용에 맞는 어미를 붙입니다. -ar 동사는 모음 <b>e</b>, -er·-ir 동사는 모음 <b>a</b>를 씁니다. (querer는 예외: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queira\" title=\"눌러서 듣기\">queira</span>)</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar (e형)</th><th>comer (a형)</th><th>abrir (a형)</th></tr></thead><tbody><tr><td>que eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fale\" title=\"눌러서 듣기\">fale</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"coma\" title=\"눌러서 듣기\">coma</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abra\" title=\"눌러서 듣기\">abra</span></td></tr><tr><td>que você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fale\" title=\"눌러서 듣기\">fale</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"coma\" title=\"눌러서 듣기\">coma</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abra\" title=\"눌러서 듣기\">abra</span></td></tr><tr><td>que nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falemos\" title=\"눌러서 듣기\">falemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comamos\" title=\"눌러서 듣기\">comamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abramos\" title=\"눌러서 듣기\">abramos</span></td></tr><tr><td>que vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falem\" title=\"눌러서 듣기\">falem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comam\" title=\"눌러서 듣기\">comam</span></td><td><span class=\"pt\" rol " role=\"button\" tabindex=\"0\" data-say=\"valho\" title=\"눌러서 듣기\">valho</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"valha\" title=\"눌러서 듣기\">valha</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ver\" title=\"눌러서 듣기\">ver</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vejo\" title=\"눌러서 듣기\">vejo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"veja\" title=\"눌러서 듣기\">veja</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"venho\" title=\"눌러서 듣기\">venho</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"venha\" title=\"눌러서 듣기\">venha</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"levar\" title=\"눌러서 듣기\">levar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"levo\" title=\"눌러서 듣기\">levo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"leve\" title=\"눌러서 듣기\">leve</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dever\" title=\"눌러서 듣기\">dever</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"devo\" title=\"눌러서 듣기\">devo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deva\" title=\"눌러서 듣기\">deva</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>나머지 인칭도 같은 어간에 어미만 붙입니다(예: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"façamos\" title=\"눌러서 듣기\">façamos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenham\" title=\"눌러서 듣기\">tenham</span>). 열린 모음이 강세가 없는 음절에서는 닫힙니다.</div><h3>100. 의지의 접속법 (The subjunctive of will)</h3><p>한 사람이 다른 사람에게 <b>자기 의지를 강요하거나 시도</b>하는 뜻의 동사·표현 뒤 종속절은 <b>접속법</b>입니다. 종속절 앞에는 항상 <b>que</b>가 옵니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>동사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"querer, desejar\" title=\"눌러서 듣기\">querer, desejar</span></td><td>원하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mandar\" title=\"눌러서 듣기\">mandar</span></td><td>명령하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dizer\" title=\"눌러서 듣기\">dizer</span></td><td>~하라고 말하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pedir\" title=\"눌러서 듣기\">pedir</span></td><td>부탁하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proibir\" title=\"눌러서 듣기\">proibir</span></td><td>금지하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aconselhar\" title=\"눌러서 듣기\">aconselhar</span></td><td>조언하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deixar, permitir\" title=\"눌러서 듣기\">deixar, permitir</span></td><td>허락하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"preferir\" title=\"눌러서 듣기\">preferir</span></td><td>~를 더 좋아하다</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O senhor quer que eu ajude?\" title=\"눌러서 듣기\">O senhor quer que eu ajude?</span><span class=\"k\">(당신은) 제가 도와 드리길 원하십니까?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele manda que fiquemos aqui.\" title=\"눌러서 듣기\">Ele manda que fiquemos aqui.</span><span class=\"k\">그는 우리가 여기 있으라고 명령한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Peço que me levem à cidade.\" title=\"눌러서 듣기\">Peço que me levem à cidade.</span><span class=\"k\">저를 시내에 데려다 주시길 부탁드립니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Proíbo que você fale com ela.\" title=\"눌러서 듣기\">Proíbo que você fale com ela.</span><span class=\"k\">네가 그녀와 이야기하는 것을 금지한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não deixo que ele beba cerveja.\" title=\"눌러서 듣기\">Não deixo que ele beba cerveja.</span><span class=\"k\">나는 그가 맥주 마시는 것을 허락하지 않는다.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b><b>두 동사의 주어가 같으면</b> 한 사람의 의지가 다른 사람에게 미치는 것이 아니므로 <b>원형</b>을 씁니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu quero ficar.\" title=\"눌러서 듣기\">Eu quero ficar.</span> (같은 주어) / <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu quero que você fique.\" title=\"눌러서 듣기\">Eu quero que você fique.</span> (다른 주어)</div><h3>101. 철자 변화 (Notes on spelling)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형 어미</th><th>규칙</th><th>예</th></tr></thead><tbody><tr><td>-car</td><td>c → qu (e 앞)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ficar: fique, fiquemos\" title=\"눌러서 듣기\">ficar: fique, fiquemos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"단순과거 fiquei (ficou는 그대로)\" title=\"눌러서 듣기\">단순과거 fiquei (ficou는 그대로)</span></td></tr><tr><td>-gar</td><td>g → gu (e 앞)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"chegar: chegue, cheguemos\" title=\"눌러서 듣기\">chegar: chegue, cheguemos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"단순과거 cheguei (chegou)\" title=\"눌러서 듣기\">단순과거 cheguei (chegou)</span></td></tr><tr><td>-cer</td><td>c → ç (a, o 앞)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conhecer: conheço, conheça, conheçamos\" title=\"눌러서 듣기\">conhecer: conheço, conheça, conheçamos</span></td></tr><tr><td>-çar</td><td>ç → c (e 앞)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"começar: comece, comecemos\" title=\"눌러서 듣기\">começar: comece, comecemos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"단순과거 comecei (começou)\" title=\"눌러서 듣기\">단순과거 comecei (começou)</span></td></tr></tbody></table></div><p>이 규칙은 <b>발음을 유지하기 위한 철자 조정</b>이라 어간의 소리는 바뀌지 않습니다.</p><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proibir\" title=\"눌러서 듣기\">proibir</span>는 강세 i에 악센트가 붙습니다. 현재 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proíbo\" title=\"눌러서 듣기\">proíbo</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proíbe\" title=\"눌러서 듣기\">proíbe</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proibimos\" title=\"눌러서 듣기\">proibimos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proíbem\" title=\"눌러서 듣기\">proíbem</span> / 접속법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proíba\" title=\"눌러서 듣기\">proíba</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proibamos\" title=\"눌러서 듣기\">proibamos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"proíbam\" title=\"눌러서 듣기\">proíbam</span>.</div><h3>102. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o garçom\" title=\"눌러서 듣기\">o garçom</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a garçonete\" title=\"눌러서 듣기\">a garçonete</span></td><td>웨이터 / 웨이트리스</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o embrulho\" title=\"눌러서 듣기\">o embrulho</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a verdade\" title=\"눌러서 듣기\">a verdade</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a maçã\" title=\"눌러서 듣기\">a maçã</span></td><td>꾸러미 / 진실 / 사과</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"desejar\" title=\"눌러서 듣기\">desejar</span> <span class=
