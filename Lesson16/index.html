과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 16, "slug": "Lesson16", "label": "Lesson XVI", "pt": "As preposições a, até, de e em", "ko": "전치사 a · até · de · em, 부사에서 전치사로", "en": "Prepositions a, até, de, em · adverbs to prepositions", "part": "Part 3 · 시제 넓히기 (Lesson XV–XXI)", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>가장 자주 쓰이는 전치사 <b>a, até, de, em</b>의 대표적인 쓰임을 정리합니다. 전치사는 한국어의 조사와 1:1로 대응하지 않으므로 <b>예문째 외우는 것</b>이 가장 좋아요.</p><h3>86. 전치사 a</h3><ul class=\"rules\"><li><b>~로 (방향)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos à cidade.\" title=\"눌러서 듣기\">Vamos à cidade.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou à casa de João.\" title=\"눌러서 듣기\">Eu vou à casa de João.</span> (단, 그 사람의 평소 있는 곳으로 갈 때는 para)</li><li><b>~시에 (시간)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele chegou às duas horas.\" title=\"눌러서 듣기\">Ele chegou às duas horas.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ela voltou à noite.\" title=\"눌러서 듣기\">Ela voltou à noite.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos à igreja aos domingos.\" title=\"눌러서 듣기\">Vamos à igreja aos domingos.</span></li><li><b>~에게 (간접목적어)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele deu um presente a ela.\" title=\"눌러서 듣기\">Ele deu um presente a ela.</span></li><li><b>일부 동사 + a + 원형</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele aprendeu a ler.\" title=\"눌러서 듣기\">Ele aprendeu a ler.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Comecei a trabalhar.\" title=\"눌러서 듣기\">Comecei a trabalhar.</span> (동사마다 외움)</li></ul><h3>87. 전치사 até</h3><ul class=\"rules\"><li><b>~까지 (공간)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou até a esquina.\" title=\"눌러서 듣기\">Eu vou até a esquina.</span></li><li><b>~까지 (시간)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Até amanhã.\" title=\"눌러서 듣기\">Até amanhã.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Fiquei até a meia-noite.\" title=\"눌러서 듣기\">Fiquei até a meia-noite.</span></li><li><b>~까지 (기한)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tenho que acabar até quarta-feira.\" title=\"눌러서 듣기\">Tenho que acabar até quarta-feira.</span></li><li><b>~조차, 심지어</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Até meu irmão mais novo vai comigo.\" title=\"눌러서 듣기\">Até meu irmão mais novo vai comigo.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele falou até alto.\" title=\"눌러서 듣기\">Ele falou até alto.</span></li></ul><h3>88. 전치사 de</h3><ul class=\"rules\"><li><b>~의 (소유)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Este é o carro dele.\" title=\"눌러서 듣기\">Este é o carro dele.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A mulher daquele homem é alta.\" title=\"눌러서 듣기\">A mulher daquele homem é alta.</span></li><li><b>~에서, ~출신 (출처)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"De onde você é?\" title=\"눌러서 듣기\">De onde você é?</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Esta música veio do Brasil.\" title=\"눌러서 듣기\">Esta música veio do Brasil.</span></li><li><b>~로 (교통수단, 말은 제외)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele viaja de trem.\" title=\"눌러서 듣기\">Ele viaja de trem.</span> / <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"de carro, de ônibus, de avião, de navio\" title=\"눌러서 듣기\">de carro, de ônibus, de avião, de navio</span> (말은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a cavalo\" title=\"눌러서 듣기\">a cavalo</span>)</li><li><b>명사가 다른 명사를 수식</b>: 수식하는 명사에 관사를 쓰지 않음. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Um dia de verão.\" title=\"눌러서 듣기\">Um dia de verão.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Uma vida de cachorro.\" title=\"눌러서 듣기\">Uma vida de cachorro.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Uma perna de pau.\" title=\"눌러서 듣기\">Uma perna de pau.</span></li><li><b>~에 대해</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O que você acha dele?\" title=\"눌러서 듣기\">O que você acha dele?</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Estão falando de mim.\" title=\"눌러서 듣기\">Estão falando de mim.</span></li><li><b>일부 동사 + de + 원형</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não me lembrei de chamar.\" title=\"눌러서 듣기\">Não me lembrei de chamar.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Esqueci-me de ir.\" title=\"눌러서 듣기\">Esqueci-me de ir.</span></li></ul><h3>89. 전치사 em</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>의미</th><th>예</th></tr></thead><tbody><tr><td>~안에 (내부 위치)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está na cidade.\" title=\"눌러서 듣기\">Ele está na cidade.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eles moram no Brasil.\" title=\"눌러서 듣기\">Eles moram no Brasil.</span></td></tr><tr><td>~에 (안이든 근처든)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está na escola.\" title=\"눌러서 듣기\">Ele está na escola.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ela está em casa.\" title=\"눌러서 듣기\">Ela está em casa.</span></td></tr><tr><td>~위에 (위에 놓임)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O copo está na mesa.\" title=\"눌러서 듣기\">O copo está na mesa.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está sentado na cadeira.\" title=\"눌러서 듣기\">Ele está sentado na cadeira.</span></td></tr><tr><td>~에 (표면)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O quadro está na parede.\" title=\"눌러서 듣기\">O quadro está na parede.</span></td></tr><tr><td>~ 안으로·위로 (이동)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O cavalo entrou na água.\" title=\"눌러서 듣기\">O cavalo entrou na água.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele jogou a roupa no chão.\" title=\"눌러서 듣기\">Ele jogou a roupa no chão.</span></td></tr><tr><td>때·기간 (~에)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Temos festas nas segundas-feiras.\" title=\"눌러서 듣기\">Temos festas nas segundas-feiras.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Faz calor aqui no verão.\" title=\"눌러서 듣기\">Faz calor aqui no verão.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos embora no dia primeiro.\" title=\"눌러서 듣기\">Vamos embora no dia primeiro.</span></td></tr><tr><td>~집에·~가게에</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Estivemos ontem nos Pereira.\" title=\"눌러서 듣기\">Estivemos ontem nos Pereira.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou no barbeiro.\" title=\"눌러서 듣기\">Eu vou no barbeiro.</span></td></tr></tbody></table></div><h3>부사에서 전치사로: + de</h3><p>아래 부사들은 <b>de</b>를 붙이면 전치사가 됩니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>부사</th><th>전치사</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-
