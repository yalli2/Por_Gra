과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 28, "slug": "Lesson28", "label": "Lesson XXVIII", "pt": "Verbos em -ear, -uir, pronomes relativos", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법", "en": "-ear verbs · -uir/-oer verbs · relative pronouns · subjunctive in relative clauses", "part": "Part 4 · 접속법과 복합 구문 (Lesson XXII–XXVIII)", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>동사 철자의 불규칙(-ear, -uir, -oer)과 함께 <b>관계대명사 que / quem / o que / o qual</b>의 쓰임, 그리고 <b>선행사가 불특정이거나 없을 때 쓰는 접속법</b>을 배웁니다.</p><h3>135. -ear 동사</h3><p>부정사가 <b>-ear</b>로 끝나는 동사는 <b>강세가 있는 e 뒤에 i</b>를 더합니다. <b>현재 직설법·현재접속법·명령법</b>에서만 해당됩니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재 직설법</th><th>현재접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeio\" title=\"눌러서 듣기\">passeio</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeie\" title=\"눌러서 듣기\">passeie</span></td></tr><tr><td>너·그 / 그녀</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeia\" title=\"눌러서 듣기\">passeia</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeie\" title=\"눌러서 듣기\">passeie</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeamos\" title=\"눌러서 듣기\">passeamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeemos\" title=\"눌러서 듣기\">passeemos</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeiam\" title=\"눌러서 듣기\">passeiam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passeiem\" title=\"눌러서 듣기\">passeiem</span></td></tr></tbody></table></div><p><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"odiar\" title=\"눌러서 듣기\">odiar</span>(미워하다)도 같은 식으로 변합니다. 직설법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"odeio, odeia, odiamos, odeiam\" title=\"눌러서 듣기\">odeio, odeia, odiamos, odeiam</span>, 접속법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"odeie, odiemos, odeiem\" title=\"눌러서 듣기\">odeie, odiemos, odeiem</span>. -ear 동사는 모두, -iar 동사는 <b>일부만</b> 이렇게 변합니다.</p><h3>136. -uir, -oer 동사</h3><p>부정사가 <b>-uir, -oer</b>로 끝나는 동사(seguir처럼 u가 소리 나지 않는 것은 제외)는 <b>직설법 3인칭 단수</b>에서 어미 모음을 <b>-i</b>로 써서 앞 모음과 이중모음이 됨을 나타냅니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele instrui.\" title=\"눌러서 듣기\">Ele instrui.</span><span class=\"k\">그는 가르친다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Isso dói.\" title=\"눌러서 듣기\">Isso dói.</span><span class=\"k\">그것이 아프다.</span></li></ul><p><b>construir, destruir</b>는 어간 모음이 바뀌는 동사라서 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"constrói\" title=\"눌러서 듣기\">constrói</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"destrói\" title=\"눌러서 듣기\">destrói</span> 형태가 됩니다.</p><h3>137. 완료 시제에서 목적격 대명사의 위치</h3><p>대명사는 조동사 <b>ter</b>를 기준으로 놓습니다. ter 뒤에 올 때는 <b>하이픈 없이</b> 씁니다. BF에서는 부정어나 접속사가 앞에 있어도 <b>두 동사 사이</b>에 두는 경향이 강합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Têm me dito.\" title=\"눌러서 듣기\">Têm me dito.</span><span class=\"k\">그들은 나에게 계속 말해 왔다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não lhe tinha dado.\" title=\"눌러서 듣기\">Não lhe tinha dado.</span><span class=\"k\">그는 그에게 주지 않았었다.</span></li></ul><h3>138. 관계대명사</h3><ul class=\"rules\"><li><b>a. que</b>: 가장 흔합니다. 사람·사물, 단수·복수, 주어·목적어 모두 가능.</li><li><b>b. quem</b>: 주로 <b>선행사를 포함</b>하여 '~하는 사람'. 항상 단수. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quem pergunta aprende.\" title=\"눌러서 듣기\">Quem pergunta aprende.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quem pedir receberá.\" title=\"눌러서 듣기\">Quem pedir receberá.</span></li><li><b>quem</b>은 사람을 가리키는 <b>전치사의 목적어</b>로도 쓰지만 BF에서는 피하는 편이고, <b>전치사를 생략하고 que</b>만 쓰는 일이 매우 흔합니다(규범문법에서는 인정하지 않음).</li><li><b>c. o que (a que, os que, as que)</b>: 지시대명사 o + 관계사 que. 더 구체적인 사람·사물, 중성으로는 영어의 <b>what</b>.</li><li><b>d. o qual (a qual, os quais, as quais)</b>: 거의 <b>문어</b>용. 전치사 뒤나 선행사가 불분명할 때 씁니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quem pergunta aprende.\" title=\"눌러서 듣기\">Quem pergunta aprende.</span><span class=\"k\">묻는 사람이 배운다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele anda como quem tivesse se perdido.\" title=\"눌러서 듣기\">Ele anda como quem tivesse se perdido.</span><span class=\"k\">그는 길을 잃은 사람처럼 걷는다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Aquele é o senhor com quem eu jantei.\" title=\"눌러서 듣기\">Aquele é o senhor com quem eu jantei.</span><span class=\"k\">저분이 내가 함께 저녁을 먹은 분이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É uma pessoa que eu gosto.\" title=\"눌러서 듣기\">É uma pessoa que eu gosto.</span><span class=\"k\">(구어) 내가 좋아하는 사람이다. (문어: de quem)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Os que vão embora pensam voltar.\" title=\"눌러서 듣기\">Os que vão embora pensam voltar.</span><span class=\"k\">떠나는 사람들은 돌아올 생각을 한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quero ver o que você tem.\" title=\"눌러서 듣기\">Quero ver o que você tem.</span><span class=\"k\">네가 가진 것을 보고 싶다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Encontrei a mãe de João, a qual tem estado doente.\" title=\"눌러서 듣기\">Encontrei a mãe de João, a qual tem estado doente.</span><span class=\"k\">주앙의 어머니를 만났는데, 그분은 계속 편찮으시다.</span></li></ul><h3>139. 관계절의 접속법</h3><p>선행사가 <b>알려진 특정한 사람·사물이 아니라</b> 조건에 맞는 <b>아무것이나</b>일 때, 또는 선행사가 <b>부정</b>이거나 <b>존재하지 않는</b> 경우 관계절에 접속법을 씁니다.</p><ul class=\"rules\"><li><b>아무나·아무것이나</b>를 가리키고 행동이 <b>미래</b>이면 <b>미래접속법</b> ('~하는 누구든지').</li><li>그렇지 않으면 <b>현재접속법</b>.</li><li>주절이 <b>과거</b>이면 현재·미래접속법은 <b>불완료과거</b>로 바뀝니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu não gostaria de um homem que fizesse tal coisa.\" title=\"눌러서 듣기\">Eu não gostaria de um homem que fizesse tal coisa.</span><span class=\"k\">그런 짓을 하는 남자는 싫을 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quero arranjar um carro que não me dê encrencas.\" title=\"눌러서 듣기\">Quero arranjar um carro que não me dê encrencas.</span><span class=\"k\">말썽 없는 차를 구하고 싶다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não tem ninguém que possa fazer isso.\" title=\"눌러서 듣기\">Não tem ninguém que possa fazer isso.</span><span class=\"k\">그걸 할 수 있는 사람은 없다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quem quiser comer terá que trabalhar.\" title=\"눌러서 듣기\">Quem quiser comer terá que trabalhar.</span><span class=\"k\">먹으려는 사람은 일해야 한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O homem que tiver este número ganha o prêmio.\" title=\"눌러서 듣기\">O homem que tiver este número ganha o prêmio.</span><span class=\"k\">이 번호를 가진 사람이 상을 탄다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele disse que quem quisesse comer teria que trabalhar.\" title=\"눌러서 듣기\">Ele disse que quem quisesse comer teria que trabalhar.</span><span class=\"k\">그는 먹으려는 사람은 일해야 할 거라고 말했다.</span></li></ul><h3>이 과의 어휘와 표현</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a criança\" title=\"눌러서 듣기\">a criança</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o prêmio\" title=\"눌러서 듣기\">o prêmio</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o chafariz\" title=\"눌러서 듣기\">o chafariz</span></td><td>아이 / 상 / 분수</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o restaurante\" title=\"눌러서 듣기\">o restaurante</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a toalha\" title=\"눌러서 듣기\">a toalha</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a toalha de mesa\" title=\"눌러서 듣기\">a toalha de mesa</span></td><td>식당 / 수건 / 식탁보</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a areia\" title=\"눌러서 듣기\">a areia</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a praia\" title=\"눌러서 듣기\">a praia</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o castelo\" title=\"눌러서 듣기\">o castelo</span></td><td>모래 / 해변 / 성</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a piscina\" title=\"눌러서 듣기\">a piscina</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a ceia\" title=\"눌러서 듣기\">a ceia</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a bicicleta\" title=\"눌러서 듣기\">a bicicleta</span></td><td>수영장 / 야식 / 자전거</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"passear\" title=\"눌러서 듣기\">passear</span> <span class=\"slash\">/</span> <span class=\"pt\
