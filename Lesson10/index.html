=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deram\" title=\"눌러서 듣기\">deram</span></td></tr></tbody></table></div><h3>54. dar의 쓰임</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>표현</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar uma olhada\" title=\"눌러서 듣기\">dar uma olhada</span></td><td>한 번 보다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar um passeio\" title=\"눌러서 듣기\">dar um passeio</span></td><td>산책·드라이브하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar aula\" title=\"눌러서 듣기\">dar aula</span></td><td>수업하다 (가르치다)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar bom dia\" title=\"눌러서 듣기\">dar bom dia</span></td><td>아침 인사를 하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar um grito\" title=\"눌러서 듣기\">dar um grito</span></td><td>소리를 지르다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar (as) cartas\" title=\"눌러서 듣기\">dar (as) cartas</span></td><td>카드를 돌리다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dar para a música\" title=\"눌러서 듣기\">dar para a música</span></td><td>음악에 소질이 있다</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A janela dá para a rua.\" title=\"눌러서 듣기\">A janela dá para a rua.</span><span class=\"k\">창문이 길 쪽으로 나 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não dá tempo para ir.\" title=\"눌러서 듣기\">Não dá tempo para ir.</span><span class=\"k\">갈 시간이 없다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Deram duas horas.\" title=\"눌러서 듣기\">Deram duas horas.</span><span class=\"k\">두 시를 쳤다(시계가 두 번 울렸다).</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Dá nele!\" title=\"눌러서 듣기\">Dá nele!</span><span class=\"k\">그 애를 때려!</span></li></ul><h3>55. 불규칙 단순과거 (Irregular preterits)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>estar</th><th>ser·ir</th><th>ter</th><th>fazer</th><th>querer</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estive\" title=\"눌러서 듣기\">estive</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fui\" title=\"눌러서 듣기\">fui</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tive\" title=\"눌러서 듣기\">tive</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fiz\" title=\"눌러서 듣기\">fiz</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quis\" title=\"눌러서 듣기\">quis</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esteve\" title=\"눌러서 듣기\">esteve</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"foi\" title=\"눌러서 듣기\">foi</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"teve\" title=\"눌러서 듣기\">teve</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fez\" title=\"눌러서 듣기\">fez</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quis\" title=\"눌러서 듣기\">quis</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estivemos\" title=\"눌러서 듣기\">estivemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fomos\" title=\"눌러서 듣기\">fomos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tivemos\" title=\"눌러서 듣기\">tivemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizemos\" title=\"눌러서 듣기\">fizemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quisemos\" title=\"눌러서 듣기\">quisemos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estiveram\" title=\"눌러서 듣기\">estiveram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"foram\" title=\"눌러서 듣기\">foram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tiveram\" title=\"눌러서 듣기\">tiveram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizeram\" title=\"눌러서 듣기\">fizeram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quiseram\" title=\"눌러서 듣기\">quiseram</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><b>ser와 ir의 단순과거는 완전히 같은 모양</b>입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele foi professor.\" title=\"눌러서 듣기\">Ele foi professor.</span>(그는 선생님이었다) / <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele foi à escola.\" title=\"눌러서 듣기\">Ele foi à escola.</span>(그는 학교에 갔다) — 문맥으로 구별해요. 3인칭 단수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esteve\" title=\"눌러서 듣기\">esteve</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"teve\" title=\"눌러서 듣기\">teve</span>의 e는 닫힌 /ê/ 입니다.</div><h3>56. 모음이 변하는 동사 (Radical-changing verbs)</h3><p>어간의 마지막 모음 e, o는 현재형에서 <b>열린 소리(é, ó)</b> 가 되거나 <b>닫힌 소리(ê, ô)</b> 로 남습니다. 규칙은 활용에 따라 달라요. (철자는 같지만 소리가 다름)</p><h3>제1활용 (-ar): 강세가 오면 열리고, 강세가 없으면 닫힘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>levar (가져가다)</th><th>morar (살다)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"levo /é/\" title=\"눌러서 듣기\">levo /é/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"moro /ó/\" title=\"눌러서 듣기\">moro /ó/</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"leva /é/\" title=\"눌러서 듣기\">leva /é/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mora /ó/\" title=\"눌러서 듣기\">mora /ó/</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"levamos (닫힘)\" title=\"눌러서 듣기\">levamos (닫힘)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"moramos (닫힘)\" title=\"눌러서 듣기\">moramos (닫힘)</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"levam /é/\" title=\"눌러서 듣기\">levam /é/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"moram /ó/\" title=\"눌러서 듣기\">moram /ó/</span></td></tr></tbody></table></div><p>다음 -ar 동사는 <b>변하지 않고 모든 형태에서 닫힌 소리</b>를 유지합니다.</p><ul class=\"rules\"><li>e·o 뒤에 <b>비음 자음</b>(n, nh, m)이 오는 동사: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entrar\" title=\"눌러서 듣기\">entrar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"contar\" title=\"눌러서 듣기\">contar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tomar\" title=\"눌러서 듣기\">tomar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"desenhar\" title=\"눌러서 듣기\">desenhar</span></li><li>e·o가 <b>이중모음</b>의 일부인 동사: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deixar\" title=\"눌러서 듣기\">deixar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"poupar\" title=\"눌러서 듣기\">poupar</span></li><li><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-elhar\" title=\"눌러서 듣기\">-elhar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-ejar\" title=\"눌러서 듣기\">-ejar</span>로 끝나는 동사: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aconselhar\" title=\"눌러서 듣기\">aconselhar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"desejar\" title=\"눌러서 듣기\">desejar</span> (invejar는 예외로 변함)</li><li><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-oar\" title=\"눌러서 듣기\">-oar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-ear\" title=\"눌러서 듣기\">-ear</span>로 끝나는 동사: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"voar\" title=\"눌러서 듣기\">voar</span> 등</li><li><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"chegar\" title=\"눌러서 듣기\">chegar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fechar\" title=\"눌러서 듣기\">fechar</span>: 지역에 따라 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fecha\" title=\"눌러서 듣기\">fecha</span>를 /ê/ 또는 /é/로 말합니다.</li></ul><h3>제2활용 (-er): 1인칭은 닫힘, 3인칭은 열림</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>conhecer (알다)</th><th>correr (달리다)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conheço /ê/\" title=\"눌러서 듣기\">conheço /ê/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"corro /ô/\" title=\"눌러서 듣기\">corro /ô/</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conhece /é/\" title=\"눌러서 듣기\">conhece /é/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"corre /ó/\" title=\"눌러서 듣기\">corre /ó/</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conhecemos (닫힘)\" title=\"눌러서 듣기\">conhecemos (닫힘)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"corremos (닫힘)\" title=\"눌러서 듣기\">corremos (닫힘)</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conhecem /é/\" title=\"눌러서 듣기\">conhecem /é/</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"correm /ó/\" title=\"눌러서 듣기\">correm /ó/</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>어간 모음 뒤에 비음이 오는 -er 동사(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aprender\" title=\"눌러서 듣기\">aprender</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comer\" title=\"눌러서 듣기\">comer</span>)는 모든 형태에서 닫힌 소리입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"escrever\" title=\"눌러서 듣기\">escrever</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"chover\" title=\"눌러서 듣기\">chover</span>는 위 규칙대로 변하는 동사예요.</div><h3>57. 이 과의 어휘 (가족 포함)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o pai\" title=\"눌러서 듣기\">o pai</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"papai\" title=\"눌러서 듣기\">papai</span></td><td>아버지 / 아빠</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a mãe\" title=\"눌러서 듣기\">a mãe</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mamãe\" title=\"눌러서 듣기\">mamãe</span></td><td>어머니 / 엄마</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o tio\" title=\"눌러서 듣기\">o tio</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a tia\" title=\"눌러서 듣기\">a tia</span></td><td>삼촌 / 이모·고모</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o primo\" title=\"눌러서 듣기\">o primo</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a prima\" title=\"눌러서 듣기\">a prima</span></td><td>사촌</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os pais\" title=\"눌러서 듣기\">os pais</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os tios\" title=\"눌러서 듣기\">os tios</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os primos\" title=\"눌러서 듣기\">os primos</span></td><td>부모님 / 삼촌(과 숙모)들 / 사촌들</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o parente\" title=\"눌러서 듣기\">o parente</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a parente\" title=\"눌러서 듣기\">a parente</span></td><td>친척<
