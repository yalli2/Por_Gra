과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 24, "slug": "Lesson24", "label": "Lesson XXIV", "pt": "Verbos em -air, expressões impessoais e dúvida", "ko": "-air 동사(sair), 비인칭 표현 뒤 접속법, 의심·불신의 접속법", "en": "verbs in -air · impersonal expressions · subjunctive of doubt", "part": "Part 4 · 접속법과 복합 구문 (Lesson XXII–XXVIII)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>sair(나가다)</b> 를 본보기로 하는 -air 동사와, <b>'~이 필요하다/가능하다'</b> 같은 비인칭 표현, 그리고 <b>의심·불신</b>을 나타낼 때 쓰는 접속법을 배웁니다. 핵심은 <b>확신하면 직설법, 확신이 없으면 접속법</b>입니다.</p><h3>118. -air 동사 (sair 나가다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재</th><th>단순과거</th><th>불완료과거</th><th>현재접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saio\" title=\"눌러서 듣기\">saio</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saí\" title=\"눌러서 듣기\">saí</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saía\" title=\"눌러서 듣기\">saía</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saia\" title=\"눌러서 듣기\">saia</span></td></tr><tr><td>너·그 / 그녀</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sai\" title=\"눌러서 듣기\">sai</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saiu\" title=\"눌러서 듣기\">saiu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saía\" title=\"눌러서 듣기\">saía</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saia\" title=\"눌러서 듣기\">saia</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saímos\" title=\"눌러서 듣기\">saímos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saímos\" title=\"눌러서 듣기\">saímos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saíamos\" title=\"눌러서 듣기\">saíamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saiamos\" title=\"눌러서 듣기\">saiamos</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saem\" title=\"눌러서 듣기\">saem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saíram\" title=\"눌러서 듣기\">saíram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saíam\" title=\"눌러서 듣기\">saíam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saiam\" title=\"눌러서 듣기\">saiam</span></td></tr></tbody></table></div><p>과거분사는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saído\" title=\"눌러서 듣기\">saído</span>입니다. 악센트를 제외하면 <b>현재 단수형에서만</b> 불규칙입니다. 같은 유형의 동사가 약 열다섯 개 있습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cair\" title=\"눌러서 듣기\">cair</span>(떨어지다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"atrair\" title=\"눌러서 듣기\">atrair</span>(끌어당기다) 등.</p><h3>119. 비인칭 표현 뒤의 접속법</h3><p>필요, 중요성, 불가피성, 가능성 등을 나타내는 <b>비인칭 표현</b>(주로 ser 3인칭 단수 + 명사·형용사) 뒤에 주어가 있는 종속절이 오면 <b>접속법</b>을 씁니다. 긍정·부정 모두 마찬가지예요. 다만 <b>확실함</b>을 나타내는 표현이면 <b>직설법</b>입니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É preciso que ele vá.\" title=\"눌러서 듣기\">É preciso que ele vá.</span><span class=\"k\">그가 가는 것이 필요하다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É necessário que eu saiba.\" title=\"눌러서 듣기\">É necessário que eu saiba.</span><span class=\"k\">내가 아는 것이 필요하다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É provável que eles cresçam.\" title=\"눌러서 듣기\">É provável que eles cresçam.</span><span class=\"k\">그들이 자랄 가능성이 높다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É seguro que eu vou.\" title=\"눌러서 듣기\">É seguro que eu vou.</span><span class=\"k\">내가 갈 것은 확실하다. (확실 → 직설법)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É preciso trabalhar.\" title=\"눌러서 듣기\">É preciso trabalhar.</span><span class=\"k\">일해야 한다. (주어 없음 → 원형)</span></li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>형용사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"necessário\" title=\"눌러서 듣기\">necessário</span></td><td>필요한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"inevitável\" title=\"눌러서 듣기\">inevitável</span></td><td>불가피한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(in)desejável\" title=\"눌러서 듣기\">(in)desejável</span></td><td>바람직한(바람직하지 않은)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"difícil\" title=\"눌러서 듣기\">difícil</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil\" title=\"눌러서 듣기\">fácil</span></td><td>가능성이 낮은 / 높은</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"importante\" title=\"눌러서 듣기\">importante</span></td><td>중요한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aconselhável\" title=\"눌러서 듣기\">aconselhável</span></td><td>권할 만한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"urgente\" title=\"눌러서 듣기\">urgente</span></td><td>급한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(im)possível\" title=\"눌러서 듣기\">(im)possível</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(im)provável\" title=\"눌러서 듣기\">(im)provável</span></td><td>(불)가능한 / (불)확실한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"incrível\" title=\"눌러서 듣기\">incrível</span></td><td>믿기 어려운</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(in)justo\" title=\"눌러서 듣기\">(in)justo</span></td><td>(부당한) 정당한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"lamentável\" title=\"눌러서 듣기\">lamentável</span></td><td>안타까운</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seguro\" title=\"눌러서 듣기\">seguro</span></td><td>확실한</td></tr></tbody></table></div><h3>120. 비인칭 표현 + 인칭부정사</h3><p>같은 표현 뒤에 <b>인칭부정사</b>를 써도 됩니다. 인칭부정사가 3인칭 동사의 논리적 주어가 되며, 주어를 분명히 하려면 주어 대명사를 씁니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É preciso ele ir.\" title=\"눌러서 듣기\">É preciso ele ir.</span><span class=\"k\">그가 가야 한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É necessário eu saber.\" title=\"눌러서 듣기\">É necessário eu saber.</span><span class=\"k\">내가 알아야 한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É possível encontrarmos com ele.\" title=\"눌러서 듣기\">É possível encontrarmos com ele.</span><span class=\"k\">우리가 그를 만날 수 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"É urgente acharmos os meninos.\" title=\"눌러서 듣기\">É urgente acharmos os meninos.</span><span class=\"k\">우리가 아이들을 찾는 것이 시급하다.</span></li></ul><h3>121. 의심·불신의 접속법</h3><ul class=\"rules\"><li><b>믿음의 긍정</b>(creio, acho, acredito)은 <b>직설법</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu creio que ele sabe.\" title=\"눌러서 듣기\">Eu creio que ele sabe.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Acredito que é verdade.\" title=\"눌러서 듣기\">Acredito que é verdade.</span></li><li><b>믿음의 부정</b>(não creio, não acredito)은 <b>접속법</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não creio que ele saiba.\" title=\"눌러서 듣기\">Não creio que ele saiba.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não acredito que seja verdade.\" title=\"눌러서 듣기\">Não acredito que seja verdade.</span></li><li>실제로는 접속법을 피하려고 <b>부정을 종속절로 옮기는</b> 경우가 많습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Creio que ele não sabe.\" title=\"눌러서 듣기\">Creio que ele não sabe.</span></li><li><b>의심 표현</b>(duvidar)은 긍정·부정 모두 <b>접속법</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Duvido que seja ele.\" title=\"눌러서 듣기\">Duvido que seja ele.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não duvido que seja ele.\" title=\"눌러서 듣기\">Não duvido que seja ele.</span></li><li>믿음을 묻는 질문에서는 <b>말하는 사람의 의심</b>을 나타내려고 접속법을 쓸 수 있습니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você crê que ele faz isso?\" title=\"눌러서 듣기\">Você crê que ele faz isso?</span><span class=\"k\">그가 그걸 한다고 믿어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você crê que ele faça isso?\" title=\"눌러서 듣기\">Você crê que ele faça isso?</span><span class=\"k\">그가 정말 그걸 한다고 믿어요? (의심)</span></li></ul><h3>122. 이 과의 어휘 (음식)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a comida\" title=\"눌러서 듣기\">a comida</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a refeição\" title=\"눌러서 듣기\">a refeição</span></td><td>음식 / 식사</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o bife\" title=\"눌러서 듣기\">o bife</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a vitela\" title=\"눌러서 듣기\">a vitela</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a carne de por
