larem\" title=\"눌러서 듣기\">falarem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazerem\" title=\"눌러서 듣기\">fazerem</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>규칙동사에서는 인칭부정사가 <b>미래접속법과 똑같은 모양</b>입니다. 하지만 단순과거가 불규칙인 동사는 어간이 다릅니다: 미래접속법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizer, fizermos, fizerem\" title=\"눌러서 듣기\">fizer, fizermos, fizerem</span> / 인칭부정사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazer, fazermos, fazerem\" title=\"눌러서 듣기\">fazer, fazermos, fazerem</span>.</div><h3>111. 인칭부정사의 쓰임</h3><p>영어로는 문맥에 따라 다양하게 번역됩니다. 구어에서의 기본 원칙은 다음과 같아요.</p><ul class=\"rules\"><li>부정사의 <b>논리적 주어가 앞 동사의 주어도 목적어도 아닌 새로운 사람</b>일 때 <b>인칭부정사</b>를 씁니다.</li><li>주어 대명사가 필요하면 반드시 <b>주어 형태</b>(eu, ele, nós …)를 씁니다. 강조하거나 분명히 하고 싶을 때 쓰세요.</li><li>인칭부정사는 종종 <b>접속법 대신</b> 쓰입니다. 어떤 구문이 쓰이는지는 동사마다 외워야 해요.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele diz que façamos o trabalho. // Ele nos diz para fazermos o trabalho.\" title=\"눌러서 듣기\">Ele diz que façamos o trabalho. // Ele nos diz para fazermos o trabalho.</span><span class=\"k\">그는 우리에게 일을 하라고 말한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"João pede que ajudemos na loja. // João pede para ajudarmos na loja.\" title=\"눌러서 듣기\">João pede que ajudemos na loja. // João pede para ajudarmos na loja.</span><span class=\"k\">조앙은 우리가 가게에서 돕길 부탁한다.</span></li></ul><p>접속법을 요구하는 접속사에 <b>같은 뜻의 전치사</b>가 있으면, <b>접속사 + 접속법</b> 대신 <b>전치사 + 인칭부정사</b>를 쓸 수 있습니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vão jantar depois que nós chegarmos. // Vão jantar depois de nós chegarmos.\" title=\"눌러서 듣기\">Vão jantar depois que nós chegarmos. // Vão jantar depois de nós chegarmos.</span><span class=\"k\">우리가 도착한 후에 그들은 저녁을 먹을 것이다.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>인칭부정사를 전혀 쓰지 않고도 모든 문장을 다른 형태로 바르게 말할 수 있습니다. 하지만 원어민은 말과 글에서 매우 자주 쓰므로 알아듣는 것은 필수예요.</div><h3>112. 모음이 변하는 명사·형용사</h3><p>남성 단수가 -o로 끝나고 어간 모음이 <b>닫힌 /ô/</b> 인 일부 명사·형용사는, 다른 형태(여성·복수)에서 <b>열린 /ó/</b> 로 바뀝니다. 대부분의 명사·형용사는 남성 단수의 모음을 그대로 유지하므로 <b>바뀌는 것만 외우면</b> 됩니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>남성 단수 (ô)</th><th>복수·여성 (ó)</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o fogo\" title=\"눌러서 듣기\">o fogo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os fogos\" title=\"눌러서 듣기\">os fogos</span></td><td>불</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o olho\" title=\"눌러서 듣기\">o olho</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os olhos\" title=\"눌러서 듣기\">os olhos</span></td><td>눈</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o ovo\" title=\"눌러서 듣기\">o ovo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os ovos\" title=\"눌러서 듣기\">os ovos</span></td><td>달걀</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"novo\" title=\"눌러서 듣기\">novo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nova\" title=\"눌러서 듣기\">nova</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"novos\" title=\"눌러서 듣기\">novos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"novas\" title=\"눌러서 듣기\">novas</span></td><td>새로운, 어린</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o avô\" title=\"눌러서 듣기\">o avô</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os avós\" title=\"눌러서 듣기\">os avós</span></td><td>할아버지</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>이 변화는 <b>소리만</b> 달라지고 철자는 같습니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ovo\" title=\"
