과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 5, "slug": "Lesson5", "label": "Lesson V", "pt": "Presente dos três grupos e imperativo", "ko": "현재형 3활용, 명령형, 의문사 의문문, 형용사 위치, 존칭", "en": "Present of -ar/-er/-ir · imperative · questions · adjective position · o senhor", "part": "Part 1 · 기초 문장 (Lesson I–VI)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>동사는 원형 어미에 따라 <b>-ar(1활용), -er(2활용), -ir(3활용)</b> 세 종류로 나뉩니다. 현재형은 어미만 조금씩 달라요. 이 과에서는 명령형, 의문사가 있는 의문문, 형용사의 위치, 존칭 대명사도 함께 배웁니다.</p><h3>25. 현재형: 세 가지 활용</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar (-ar)</th><th>comer (-er)</th><th>abrir (-ir)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falo\" title=\"눌러서 듣기\">falo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"como\" title=\"눌러서 듣기\">como</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abro\" title=\"눌러서 듣기\">abro</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fala\" title=\"눌러서 듣기\">fala</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"come\" title=\"눌러서 듣기\">come</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abre\" title=\"눌러서 듣기\">abre</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falamos\" title=\"눌러서 듣기\">falamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comemos\" title=\"눌러서 듣기\">comemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrimos\" title=\"눌러서 듣기\">abrimos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falam\" title=\"눌러서 듣기\">falam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comem\" title=\"눌러서 듣기\">comem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrem\" title=\"눌러서 듣기\">abrem</span></td></tr></tbody></table></div><ul class=\"rules\"><li>-er 동사의 원형은 항상 <b>닫힌 /ê/</b> 소리로 읽습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comer\" title=\"눌러서 듣기\">comer</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"escrever\" title=\"눌러서 듣기\">escrever</span>.</li><li>진행형은 모두 규칙적입니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estou falando\" title=\"눌러서 듣기\">estou falando</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estou comendo\" title=\"눌러서 듣기\">estou comendo</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estou abrindo\" title=\"눌러서 듣기\">estou abrindo</span>. (-er·-ir 동사는 -r을 떼고 -ndo)</li></ul><h3>26. 명령형 (The imperative)</h3><p>구어체 브라질 포르투갈어에서 você에게 하는 명령형은 <b>3인칭 단수 현재형과 같은 모양</b>입니다(긍정·부정 모두). 주어 대명사는 보통 쓰지 않고, 강조할 때만 동사 앞이나 뒤에 놓아요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형</th><th>명령형</th><th>뜻</th></tr></thead><tbody><tr><td>falar</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Fala.\" title=\"눌러서 듣기\">Fala.</span></td><td>말해라.</td></tr><tr><td>comer</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Come.\" title=\"눌러서 듣기\">Come.</span></td><td>먹어라.</td></tr><tr><td>abrir</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Abre.\" title=\"눌러서 듣기\">Abre.</span></td><td>열어라.</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Fala você.\" title=\"눌러서 듣기\">Fala você.</span><span class=\"k\">네가 말해.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não abre a porta.\" title=\"눌러서 듣기\">Não abre a porta.</span><span class=\"k\">문을 열지 마.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>교과서 문법에서는 você에게 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Abra!\" title=\"눌러서 듣기\">Abra!</span>처럼 접속법 형태를 쓰는 것이 '정식'이지만, 일상 대화에서는 위의 짧은 형태가 매우 흔합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ser\" title=\"눌러서 듣기\">ser</span>와 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estar\" title=\"눌러서 듣기\">estar</span>의 명령형은 접속법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seja\" title=\"눌러서 듣기\">seja</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esteja\" title=\"눌러서 듣기\">esteja</span>로 대신합니다.</div><p>복수 명령형은 구어에서 사라졌습니다. 대신 <b>'~하시겠어요?'라는 부탁 형태</b>로 말해요.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vocês querem guardar os livros?\" title=\"눌러서 듣기\">Vocês querem guardar os livros?</span><span class=\"k\">책을 치워 주시겠어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vocês querem falar devagar?\" title=\"눌러서 듣기\">Vocês querem falar devagar?</span><span class=\"k\">천천히 말해 주세요.</span></li></ul><h3>27. 의문사가 있는 의문문</h3><p>의문사로 시작하는 질문에서는 주어가 동사 앞에도 뒤에도 올 수 있습니다. 구어에서는 의문사 뒤에 <b>é que</b>를 붙이는 형태가 매우 흔하고, 이때 뒤 절은 항상 '주어 + 동사' 순서입니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Para onde vai você? // Para onde você vai?\" title=\"눌러서 듣기\">Para onde vai você? // Para onde você vai?</span><span class=\"k\">어디로 가세요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Que é que você está comendo?\" title=\"눌러서 듣기\">Que é que você está comendo?</span><span class=\"k\">무엇을 먹고 있어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quem é que parte amanhã?\" title=\"눌러서 듣기\">Quem é que parte amanhã?</span><span class=\"k\">누가 내일 떠나요?</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>동사가 두 단어(estar + -ndo 등)이면 주어는 항상 동사 앞에 옵니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O que você está comendo?\" title=\"눌러서 듣기\">O que você está comendo?</span></div><h3>28. 동의 구하기 (Requesting assent)</h3><p>문장 끝에 <b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"não é?\" title=\"눌러서 듣기\">não é?</span></b>를 붙이면 '그렇지요?'라는 확인 질문이 됩니다. 빨리 말하면 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"né?\" title=\"눌러서 듣기\">né?</span>처럼 들려요. 영어의 isn't it / don't you 에 해당합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você lembra João, não é?\" title=\"눌러서 듣기\">Você lembra João, não é?</span><span class=\"k\">조앙을 기억하죠, 그렇죠?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele está brincando, não é?\" title=\"눌러서 듣기\">Ele está brincando, não é?</span><span class=\"k\">그는 농담하는 거죠, 그렇죠?</span></li></ul><h3>29. 형용사의 위치 (Position of adjectives)</h3><ul class=\"rules\"><li><b>명사 뒤</b> — 객관적으로 한 종류를 구분할 때(묘사 형용사): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Os homens bons vão para o céu.\" title=\"눌러서 듣기\">Os homens bons vão para o céu.</span> (착한 사람들만)</li><li><b>명사 앞</b> — 말하는 사람의 주관적 평가·감정을 담을 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O bom rapaz vai à cidade.\" title=\"눌러서 듣기\">O bom rapaz vai à cidade.</span> (내가 보기에 좋은 청년)</li><li>지시 형용사(이, 저)와 수량 형용사는 거의 항상 <b>앞</b>에 옵니다.</li><li>bom, mau, grande처럼 평가를 많이 담는 형용사는 앞에 오는 경우가 많습니다.</li></ul><h3>30. 존칭 2인칭 대명사</h3><p><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"você\" title=\"눌러서 듣기\">você</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vocês\" title=\"눌러서 듣기\">vocês</span>는 이름을 부르는 사이에서 씁니다. 성(姓)에 직함을 붙여 부를 만한 사이에는 아래 표현을 씁니다. 동사는 você와 같은 <b>3인칭 단·복수형</b>입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>뜻</th><th>단수</th><th>복수</th></tr></thead><tbody><tr><td>남성</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o senhor (o sr.)\" title=\"눌러서 듣기\">o senhor (o sr.)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os senhores (os srs.)\" title=\"눌러서 듣기\">os senhores (os srs.)</span></td></tr><tr><td>여성</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a senhora (a sra.)\" title=\"눌러서 듣기\">a senhora (a sra.)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as senhoras (as sras.)\" title=\"눌러서 듣기\">as senhoras (as sras.)</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>미혼 여성의 호칭은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"senhorita (srta.)\" title=\"눌러서 듣기\">senhorita (srta.)</span>이지만, 직접 '당신'이라고 부를 때는 보통 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a senhora\" title=\"눌러서 듣기\">a senhora</span>를 씁니다. 호칭으로 부를 때는 관사를 생략합니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Sr. Peres, o sr. Álvares está aqui?\" title=\"눌러서 듣기\">Sr. Peres, o sr. Álvares está aqui?</span></div><h3>31. 2인칭 대명사를 목적어로 쓰기</h3><p>tu, vós를 제외한 모든 '당신' 표현은 <b>목적어나 전치사의 목적어</b>로도 명사처럼 그대로 씁니다. 직접목적어는 동사 뒤에 옵니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu não compreendo você.\" title=\"눌러서 듣기\">Eu não compreendo você.</span><span class=\"k\">나는 당신을 이해하지 못한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Aqui deixo o senhor.\" title=\"눌러서 듣기\">Aqui deixo o senhor.</span><span class=\"k\">여기서 당신과 헤어집니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele está com você?\" title=\"눌러서 듣기\">Ele está com você?</span><span class=\"k\">그가 당신과 함께 있어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O carro é do senhor?\" title=\"눌러서 듣기\">O carro é do senhor?</span><span class=\"k\">그 차는 당신 것입니까?</span></li></ul><h3>32. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aprender (a)\" title=\"눌러서 듣기\">aprender (a)</span></td><td>배우다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"escrever\" title=\"눌러서 듣기\">escrever</span></td><td>쓰다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"partir (de)\" title=\"눌러서 듣기\">partir (de)</span></td><td>떠나다, 출발하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"casar (com)\" title=\"눌러서 듣기\">casar (com)</span></td><td>결혼하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comer\" title=\"눌러서 듣기\">comer</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"compreender\" title=\"눌러서 듣기\">compreender</span></td><td>먹다 / 이해하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"usar\" title=\"눌러서 듣기\">usar</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrir\" title=\"눌러서 듣기\">abrir</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vender\" title=\"눌러서 듣기\">vender</span></td><td>사용하다·입다 / 열다 / 팔다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a pena\" title=\"눌러서 듣기\">a pena</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a carta\" title=\"눌러서 듣기\">a carta</span></td><td>펜촉 / 편지</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a carne\" title=\"눌러서 듣기\">a carne</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o arroz\" title=\"눌러서 듣기\">o arroz</span></td><td>고기 / 쌀, 밥</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o Brasil\" title=\"눌러서 듣기\">o Brasil</span></td><td>브라질 (관사와 함께)</td></tr></tbody></table></div><h3>핵심 표현 15개</h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu como arroz.\" title=\"눌러서 듣기\">Eu como arroz.</span></div></div><div class=\"kor\">나는 밥을 먹는다.</div><div class=\"ptip\">💡 comer: eu → como</div></div></li><li class=\"ph\"><span class=\"pn\">2</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele abre a porta.\" title=\"눌러서 듣기\">Ele abre a porta.</span></div></div><div class=\"kor\">그는 문을 연다.</div><div class=\"ptip\">💡 abrir: ele → abre</div></div></li><li class=\"ph\"><span class=\"pn\">3</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Nós abrimos o livro.\" title=\"눌러서 듣기\">Nós abrimos o livro.</span></div></div><div class=\"kor\">우리는 책을 연다.</div><div class=\"ptip\">💡 -ir: nós → -imos</div></div></li><li class=\"ph\"><span class=\"pn\">4</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eles escrevem cartas.\" title=\"눌러서 듣기\">Eles escrevem cartas.</span></div></div><div class=\"kor\">그들은 편지를 쓴다.</div><div class=\"ptip\">💡 -er: eles → -em</div></div></li><li class=\"ph\"><span class=\"pn\">5</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu escrevo a lápis.\" title=\"눌러서 듣기\">Eu escrevo a lápis.</span></div></div><div class=\"kor\">나는 연필로 쓴다.</div></div></li><li class=\"ph\"><span class=\"pn\">6</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Fala devagar.\" title=\"눌러서 듣기\">Fala devagar.</span></div></div><div class=\"kor\">천천히 말해.</div><div class=\"ptip\">💡 명령형 = 3인칭 단수 현재형</div></div></li><li class=\"ph\"><span class=\"pn\">7</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vocês querem falar devagar?\" title=\"눌러서 듣기\">Vocês querem falar devagar?</span></div></div><div class=\"kor\">천천히 말해 주시겠어요?</div><div class=\"ptip\">💡 복수 명령 대신 부탁 형태</div></div></li><li class=\"ph\"><span class=\"pn\">8</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Para onde você vai?\" title=\"눌러서 듣기\">Para onde você vai?</span></div></div><div class=\"kor\">어디로 가세요?</div></div></li><li class=\"ph\"><span class=\"pn\">9</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Que é que você está comendo?\" title=\"눌러서 듣기\">Que é que você está comendo?</span></div></div><div class=\"kor\">무엇을 드시고 있어요?</div><div class=\"ptip\">💡 의문사 + é que + 주어 + 동사</div></div></li><li class=\"ph\"><span class=\"pn\">10</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Você lembra João, não é?\" title=\"눌러서 듣기\">Você lembra João, não é?</span></div></div><div class=\"kor\">조앙을 기억하죠, 그렇죠?</div><div class=\"ptip\">💡 não é? = né?</div></div></li><li class=\"ph\"><span class=\"pn\">11</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O senhor está aqui?\" title=\"눌러서 듣기\">O senhor está aqui?</span></div></div><div class=\"kor\">(남성에게) 여기 계십니까?</div><div class=\"ptip\">💡 존칭: o senhor</div></div></li><li class=\"ph\"><span class=\"pn\">12</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A senhora fala português?\" title=\"눌러서 듣기\">
