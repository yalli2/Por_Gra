과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 3, "slug": "Lesson3", "label": "Lesson III", "pt": "Progressivo, perguntas e negação", "ko": "현재진행형, 의문문, 부정문, 부정관사", "en": "Progressive · questions · indefinite article · negation · yes/no answers", "part": "Part 1 · 기초 문장 (Lesson I–VI)", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>지금 일어나고 있는 일은 <b>estar + 동사원형의 -r 대신 -ndo</b> 로 말합니다. 의문문은 어순을 바꾸지 않고 억양만 올리고, 부정은 동사 앞에 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"não\" title=\"눌러서 듣기\">não</span>만 붙이면 됩니다. 대답할 때는 <b>동사를 반복</b>하는 것이 포르투갈어다운 방식이에요.</p><h3>13. 현재진행형 (The progressive form)</h3><p>구어체 브라질 포르투갈어(BF)에서는 단순현재와 진행형을 확실히 구별합니다. 진행형은 <b>estar + 현재분사(gerúndio)</b> 입니다. 현재분사는 모든 동사에서 규칙적으로 원형의 -r을 <b>-ndo</b>로 바꿔 만들어요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형</th><th>현재분사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falar\" title=\"눌러서 듣기\">falar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falando\" title=\"눌러서 듣기\">falando</span></td><td>말하는 중</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estar\" title=\"눌러서 듣기\">estar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estando\" title=\"눌러서 듣기\">estando</span></td><td>있는 중</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudar\" title=\"눌러서 듣기\">estudar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudando\" title=\"눌러서 듣기\">estudando</span></td><td>공부하는 중</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trabalhar\" title=\"눌러서 듣기\">trabalhar</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trabalhando\" title=\"눌러서 듣기\">trabalhando</span></td><td>일하는 중</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu estou falando.\" title=\"눌러서 듣기\">Eu estou falando.</span><span class=\"k\">나는 (지금) 말하고 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Nós estamos trabalhando.\" title=\"눌러서 듣기\">Nós estamos trabalhando.</span><span class=\"k\">우리는 (지금) 일하고 있다.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>현재분사는 <b>형태가 변하지 않습니다</b>(성·수 일치 없음). 주어에 따라 변하는 것은 estar뿐이에요. -ndo의 n은 자음으로 읽히고 앞 모음은 비음이 됩니다.</div><h3>14. 의문문 (Questions)</h3><p>의문사가 없는 질문은 <b>평서문과 같은 어순</b>으로 쓰고, 말할 때는 끝을 올리고, 글에서는 물음표를 붙입니다. 영어의 do 같은 조동사는 필요 없어요.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você fala inglês?\" title=\"눌러서 듣기\">Você fala inglês?</span><span class=\"k\">영어를 말하세요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você está trabalhando?\" title=\"눌러서 듣기\">Você está trabalhando?</span><span class=\"k\">지금 일하고 있어요?</span></li></ul><h3>15. 부정관사 (The indefinite article)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>남성</th><th>여성</th></tr></thead><tbody><tr><td>단수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"um\" title=\"눌러서 듣기\">um</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"uma\" title=\"눌러서 듣기\">uma</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>복수형 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"uns\" title=\"눌러서 듣기\">uns</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"umas\" title=\"눌러서 듣기\">umas</span>는 '몇몇의'라는 뜻으로 쓰입니다. 여성 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"uma\" title=\"눌러서 듣기\">uma</span>의 m은 빨리 말할 때 약해져서 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"uma menina\" title=\"눌러서 듣기\">uma menina</span>가 [우아 미니나]처럼 들리기도 해요.</div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"um homem\" title=\"눌러서 듣기\">um homem</span><span class=\"k\">한 남자</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"uma menina\" title=\"눌러서 듣기\">uma menina</span><span class=\"k\">한 소녀</span></li></ul><h3>16. 부정관사와의 축약</h3><p>de, em도 부정관사와 합쳐질 수 있지만 <b>필수는 아닙니다</b>. 리우에서는 em의 축약(num, numa)은 흔히 쓰고, de의 축약(dum, duma)은 잘 쓰지 않아요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>+ um</th><th>+ uma</th></tr></thead><tbody><tr><td>de</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dum\" title=\"눌러서 듣기\">dum</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"duma\" title=\"눌러서 듣기\">duma</span></td></tr><tr><td>em</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"num\" title=\"눌러서 듣기\">num</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"numa\" title=\"눌러서 듣기\">numa</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ela está numa aula.\" title=\"눌러서 듣기\">Ela está numa aula.</span><span class=\"k\">그녀는 수업 중이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A casa de um professor.\" title=\"눌러서 듣기\">A casa de um professor.</span><span class=\"k\">한 선생님의 집.</span></li></ul><h3>17. 부정문 (Negation)</h3><p>동사 <b>바로 앞에 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"não\" title=\"눌러서 듣기\">não</span></b> 를 놓습니다. do not 같은 조동사는 없어요.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não falo.\" title=\"눌러서 듣기\">Não falo.</span><span class=\"k\">나는 말하지 않는다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Nós não estamos trabalhando.\" title=\"눌러서 듣기\">Nós não estamos trabalhando.</span><span class=\"k\">우리는 일하고 있지 않다.</span></li></ul><h3>18. 'yes'와 'no'에 해당하는 대답</h3><p>포르투갈어는 질문에 나온 <b>동사를 반복</b>해서 긍정으로 답합니다. 시제는 질문과 같게, 인칭만 논리에 맞게 바꿔요. 주어나 목적어 대명사는 쓰지 않습니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você trabalha na cidade? — Trabalho.\" title=\"눌러서 듣기\">Você trabalha na cidade? — Trabalho.</span><span class=\"k\">시내에서 일해요? — 네.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vocês falam português? — Falamos.\" title=\"눌러서 듣기\">Vocês falam português? — Falamos.</span><span class=\"k\">포르투갈어 하세요? — 네(우리는 합니다).</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Os meninos estão brincando? — Estão.\" title=\"눌러서 듣기\">Os meninos estão brincando? — Estão.</span><span class=\"k\">아이들이 놀고 있어요? — 네.</span></li></ul><ul class=\"rules\"><li>동사가 두 단어(estar + -ndo)일 때는 <b>조동사만</b> 반복합니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Estão.\" title=\"눌러서 듣기\">Estão.</span></li><li>동사가 없는 질문에는 보통 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"É.\" title=\"눌러서 듣기\">É.</span>(그렇죠)라고 답합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quente hoje, hein? — É.\" title=\"눌러서 듣기\">Quente hoje, hein? — É.</span></li><li>부정 대답은 동사 앞에 não를 붙이거나, 흔히 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não.\" title=\"눌러서 듣기\">Não.</span> 한 마디로 합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Você fala inglês? — Não. / Não falo.\" title=\"눌러서 듣기\">Você fala inglês? — Não. / Não falo.</span></li></ul><h3>19. 강한 긍정·부정 대답</h3><p>대답을 강조하려면 동사 뒤에 <b>sim</b>(긍정) 또는 <b>não</b>(부정)를 덧붙입니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você fala inglês? — Falo, sim.\" title=\"눌러서 듣기\">Você fala inglês? — Falo, sim.</span><span class=\"k\">영어 하세요? — 네, 합니다(그럼요).</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele não trabalha? — Trabalha, sim.\" title=\"눌러서 듣기\">Ele não trabalha? — Trabalha, sim.</span><span class=\"k\">그는 일 안 해요? — 아니요, 해요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você fala espanhol? — Não falo, não.\" title=\"눌러서 듣기\">Você fala espanhol? — Não falo, não.</span><span class=\"k\">스페인어 하세요? — 아뇨, 못 해요.</span></li></ul><h3>20. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o tempo\" title=\"눌러서 듣기\">o tempo</span></td><td>날씨, 시간</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o carro\" title=\"눌러서 듣기\">o carro</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a rua\" title=\"눌러서 듣기\">a rua</span></td><td>자동차 / 거리</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a xícara\" title=\"눌러서 듣기\">a xícara</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o copo\" title=\"눌러서 듣기\">o copo</span></td><td>찻잔 / 유리잔</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o amigo\" title=\"눌러서 듣기\">o amigo</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a amiga\" title=\"눌러서 듣기\">a amiga</span></td><td>친구</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o chapéu\" title=\"눌러서 듣기\">o chapéu</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o sapato\" title=\"눌러서 듣기\">o sapato</span></td><td>모자 / 신발</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ruim\" title=\"눌러서 듣기\"
