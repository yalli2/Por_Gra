과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 29, "slug": "Lesson29", "label": "Lesson XXIX", "pt": "Subjuntivo com advérbios relativos, talvez, ordens indiretas e diminutivos", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사", "en": "relative adverbs · talvez · indirect commands · diminutives and augmentatives", "part": "Part 5 · 마무리 (Lesson XXIX)와 부록", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>교재의 마지막 과입니다. <b>관계부사(como, quando, onde, quanto) 뒤의 접속법</b>, <b>talvez</b>, <b>3인칭에게 하는 간접 명령</b>, <b>'어떻든 간에'</b> 표현, 그리고 구어에서 아주 많이 쓰이는 <b>지소사(-inho)와 확대사(-ão)</b>를 배웁니다.</p><h3>140. 관계부사 뒤의 접속법</h3><p><b>como, quando, onde, quanto</b> 뒤에 접속법이 오면 <b>'어떤 방식으로든/언제든/어디서든/얼마든지'</b> 라는 <b>불특정</b>한 뜻이 됩니다. 접속법은 거의 항상 <b>미래접속법(과거에는 불완료과거)</b> 이고, 조건을 만족하는 <b>특정한 하나</b>를 가리킬 때는 현재접속법도 씁니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você fará isso como quiser.\" title=\"눌러서 듣기\">Você fará isso como quiser.</span><span class=\"k\">원하는 방식대로 그것을 하세요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vem a minha casa quando puder.\" title=\"눌러서 듣기\">Vem a minha casa quando puder.</span><span class=\"k\">할 수 있을 때 언제든 우리 집에 와요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Compraremos balas onde acharmos.\" title=\"눌러서 듣기\">Compraremos balas onde acharmos.</span><span class=\"k\">사탕을 찾는 곳 어디서든 살 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O senhor pode cantar quanto quiser.\" title=\"눌러서 듣기\">O senhor pode cantar quanto quiser.</span><span class=\"k\">원하는 만큼 노래해도 됩니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quero um hotel onde possa ir à praia.\" title=\"눌러서 듣기\">Quero um hotel onde possa ir à praia.</span><span class=\"k\">해변에 갈 수 있는 호텔을 원한다. (조건에 맞는 하나 → 현재)</span></li></ul><h3>141. talvez 등의 뒤에서 접속법</h3><p><b>talvez</b> 같은 말이 동사 <b>앞에</b> 오면 동사는 <b>접속법</b>이고, <b>뒤에</b> 오면 <b>직설법</b>입니다. 이때 <b>미래접속법은 쓰지 않습니다.</b></p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Talvez o João jante conosco.\" title=\"눌러서 듣기\">Talvez o João jante conosco.</span><span class=\"k\">어쩌면 주앙이 우리와 저녁을 먹을 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quiçá queira assistir à reunião.\" title=\"눌러서 듣기\">Quiçá queira assistir à reunião.</span><span class=\"k\">어쩌면 회의에 참석하고 싶어 할지도 모른다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Pode ser que chova amanhã.\" title=\"눌러서 듣기\">Pode ser que chova amanhã.</span><span class=\"k\">내일 비가 올지도 모른다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"João está em casa, talvez.\" title=\"눌러서 듣기\">João está em casa, talvez.</span><span class=\"k\">주앙은 아마 집에 있을 것이다. (뒤 → 직설법)</span></li></ul><h3>142. 간접 명령, 3인칭에 대한 제안</h3><p>제3자에게 <b>행동하라고 시키거나 권할 때</b> 접속법을 씁니다. 영어의 <b>let</b>에 해당합니다. 보통 앞에 <b>que</b>가 옵니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se ele quiser ir embora, que chame um táxi.\" title=\"눌러서 듣기\">Se ele quiser ir embora, que chame um táxi.</span><span class=\"k\">그가 가고 싶으면 택시를 부르라고 해라.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se os meninos estão com fome, que venham comer.\" title=\"눌러서 듣기\">Se os meninos estão com fome, que venham comer.</span><span class=\"k\">아이들이 배고프면 와서 먹으라고 해라.</span></li></ul><h3>143. \"Let it be as it may\" 표현</h3><p>앞부분에 <b>현재접속법</b>, 뒤에 <b>미래접속법</b>을 이어서 '~하든 간에'를 말합니다. 과거의 일이면 <b>둘 다 불완료과거</b>로 바꿉니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Seja como for, não gosto da situação.\" title=\"눌러서 듣기\">Seja como for, não gosto da situação.</span><span class=\"k\">어떻든 나는 이 상황이 마음에 들지 않는다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Chame quem chamar, não atendo.\" title=\"눌러서 듣기\">Chame quem chamar, não atendo.</span><span class=\"k\">누가 부르든 나는 응하지 않는다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Corra quanto correr, não vai pegar o cachorro.\" title=\"눌러서 듣기\">Corra quanto correr, não vai pegar o cachorro.</span><span class=\"k\">아무리 달려도 개를 잡지 못할 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Fosse como fosse.\" title=\"눌러서 듣기\">Fosse como fosse.</span><span class=\"k\">어땠든 간에.</span></li></ul><h3>144. 지소사와 확대사</h3><p>BF는 <b>지소사</b>를 아주 많이 씁니다. 가장 흔한 접미사는 <b>-(z)inho</b>이고 거의 모든 명사·형용사에 붙습니다. 끝의 <b>강세 없는 모음</b>은 떼고 -inho를 붙이며(casa → casinha), 다음의 경우에는 <b>단어 전체에 -zinho</b>를 붙입니다.</p><ul class=\"rules\"><li><b>a.</b> 이중모음(구강·비음)으로 끝날 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mãe → mãezinha\" title=\"눌러서 듣기\">mãe → mãezinha</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"boi → boizinho\" title=\"눌러서 듣기\">boi → boizinho</span></li><li><b>b.</b> 강세 모음으로 끝날 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"irmã → irmãzinha\" title=\"눌러서 듣기\">irmã → irmãzinha</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pá → pazinha\" title=\"눌러서 듣기\">pá → pazinha</span></li><li><b>c.</b> -l로 끝날 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"animal → animalzinho\" title=\"눌러서 듣기\">animal → animalzinho</span></li><li><b>d.</b> -r로 끝날 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dor → dorzinha\" title=\"눌러서 듣기\">dor → dorzinha</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"par → parzinho\" title=\"눌러서 듣기\">par → parzinho</span> (예외: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"devagar → devagarinho / devagarzinho\" title=\"눌러서 듣기\">devagar → devagarinho / devagarzinho</span>)</li><li><b>복수</b>는 기본 단어의 복수형을 만든 뒤 붙입니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cão → cãezinhos\" title=\"눌러서 듣기\">cão → cãezinhos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"animal → animaizinhos\" title=\"눌러서 듣기\">animal → animaizinhos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"lição → liçõezinhas\" title=\"눌러서 듣기\">lição → liçõezinhas</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pires → pirezinhos\" title=\"눌러서 듣기\">pires → pirezinhos</span>.</li><li>자유롭게 만들어지고 지소사로 느껴지는 말은 <b>원래 단어의 강세 모음 음질을 유지</b>합니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"copo → copinho (/ó/)\" title=\"눌러서 듣기\">copo → copinho (/ó/)</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pé → pezinho (/é/)\" title=\"눌러서 듣기\">pé → pezinho (/é/)</span>.</li></ul><p><b>확대사</b>는 주로 <b>-ão</b>를 쓰며, 앞에 음절을 붙여 강조하기도 합니다. 여성형은 <b>-ona</b>(또는 -ana)이지만, 사람이 아닌 여성 명사는 흔히 <b>남성 확대어미</b>를 씁니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>기본형</th><th>확대형</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a mesa\" title=\"눌러서 듣기\">a mesa</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mesão\" title=\"눌러서 듣기\">o mesão</span></td><td>큰 탁자</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"grande\" title=\"눌러서 듣기\">grande</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"grandalhão\" title=\"눌러서 듣기\">grandalhão</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"grandalhona\" title=\"눌러서 듣기\">grandalhona</span></td><td>엄청나게 큰</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a casa\" title=\"눌러서 듣기\">a casa</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o casarão\" title=\"눌러서 듣기\">o casarão</span></td><td>대저택</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o carro\" title=\"눌러서 듣기\">o carro</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o carrão\" title=\"눌러서 듣기\">o carrão</span></td><td>큰 차</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bonito\" title=\"눌러서 듣기\">bonito</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bonitão\" title=\"눌러서 듣기\">bonitão</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"bonitona\" title=\"눌러서 듣기\">bonitona</span></td><td>아주 잘생긴</td></tr></tbody></table></div><h3>이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as balas\" title=\"눌러서 듣기\">as balas</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a reunião\" title=\"눌러서 듣기\">a reunião</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o táxi\" title=\"눌러서 듣기\">o táxi</span></td><td>사탕 / 회의 / 택시</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o Carnaval\" title=\"눌러서 듣기\">o Carnaval</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o desfile\" title=\"눌러서 듣기\">o desfile</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a fantasia\" title=\"눌러서 듣기\">a fantasia</span></td><td>카니발 / 퍼레이드 / 의상</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\
