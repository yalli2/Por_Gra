과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 14, "slug": "Lesson14", "label": "Lesson XIV", "pt": "Ver, pronomes depois de preposição, que e qual", "ko": "ver, 전치사 뒤 인칭대명사, 간접목적어 구, que와 qual", "en": "ver · pronouns after prepositions · indirect object phrases · que vs. qual", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>ver(보다)</b>, 전치사 뒤에 오는 인칭대명사(<b>mim, comigo, dele …</b>), '~에게'를 구(句)로 말하는 법, 그리고 헷갈리기 쉬운 의문사 <b>que와 qual</b>을 배웁니다.</p><h3>75. 불규칙 동사 ver (보다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재</th><th>단순과거</th><th>미래접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vejo\" title=\"눌러서 듣기\">vejo</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vi\" title=\"눌러서 듣기\">vi</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vê\" title=\"눌러서 듣기\">vê</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"viu\" title=\"눌러서 듣기\">viu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vemos\" title=\"눌러서 듣기\">vemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vimos\" title=\"눌러서 듣기\">vimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"virmos\" title=\"눌러서 듣기\">virmos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"veem\" title=\"눌러서 듣기\">veem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"viram\" title=\"눌러서 듣기\">viram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"virem\" title=\"눌러서 듣기\">virem</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>3인칭 복수 현재 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"veem\" title=\"눌러서 듣기\">veem</span>은 두 음절로 발음하며 첫 모음은 비음이 아닙니다. 단순과거는 제3활용 규칙동사와 같은 방식이에요. 미래접속법 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span>은 동사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span>(오다)의 원형과 모양이 같으니 문맥으로 구별하세요.</div><h3>76. ver의 쓰임</h3><p>영어에서는 지각·정신 활동 동사(see, understand 등)에 진행형을 잘 쓰지 않지만, 포르투갈어에서는 <b>다른 동사와 똑같은 상황이면 진행형</b>으로 말합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você explicou isso, e agora eu estou vendo.\" title=\"눌러서 듣기\">Você explicou isso, e agora eu estou vendo.</span><span class=\"k\">당신이 설명해서 이제 알겠어요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Estou vendo o João na porta da casa.\" title=\"눌러서 듣기\">Estou vendo o João na porta da casa.</span><span class=\"k\">조앙이 집 문 앞에 있는 게 보여요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não estou compreendendo.\" title=\"눌러서 듣기\">Não estou compreendendo.</span><span class=\"k\">이해가 안 돼요.</span></li></ul><h3>77. 전치사 뒤의 인칭대명사</h3><p>전치사 뒤에는 <b>주어 형태</b>를 그대로 쓰지만, <b>1인칭 단수(mim)</b> 와 <b>3인칭 재귀(si)</b> 만 특별한 형태입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>의미</th><th>전치사 + 대명사</th></tr></thead><tbody><tr><td>나에게</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a mim, para mim\" title=\"눌러서 듣기\">a mim, para mim</span></td></tr><tr><td>당신을</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para você\" title=\"눌러서 듣기\">para você</span></td></tr><tr><td>그에 의해</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"por ele\" title=\"눌러서 듣기\">por ele</span></td></tr><tr><td>그녀 없이</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sem ela\" title=\"눌러서 듣기\">sem ela</span></td></tr><tr><td>우리를 위해</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para nós\" title=\"눌러서 듣기\">para nós</span></td></tr><tr><td>너희 사이에</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entre vocês\" title=\"눌러서 듣기\">entre vocês</span></td></tr><tr><td>그들과 함께</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"com eles\" title=\"눌러서 듣기\">com eles</span></td></tr><tr><td>그녀들에 대해</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sobre elas\" title=\"눌러서 듣기\">sobre elas</span></td></tr><tr><td>자기 자신에게</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a si\" title=\"눌러서 듣기\">a si</span></td></tr></tbody></table></div><h3>com의 특수 형태</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>뜻</th><th>형태</th></tr></thead><tbody><tr><td>나와 함께</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comigo\" title=\"눌러서 듣기\">comigo</span></td></tr><tr><td>우리와 함께</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"conosco\" title=\"눌러서 듣기\">conosco</span></td></tr><tr><td>자신과 함께(재귀)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"consigo\" title=\"눌러서 듣기\">consigo</span></td></tr></tbody></table></div><h3>de, em과 3인칭 대명사의 축약</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>+ ele</th><th>+ ela</th><th>+ eles</th><th>+ elas</th></tr></thead><tbody><tr><td>de</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dele\" title=\"눌러서 듣기\">dele</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dela\" title=\"눌러서 듣기\">dela</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deles\" title=\"눌러서 듣기\">deles</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"delas\" title=\"눌러서 듣기\">delas</span></td></tr><tr><td>em</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nele\" title=\"눌러서 듣기\">nele</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nela\" title=\"눌러서 듣기\">nela</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"neles\" title=\"눌러서 듣기\">neles</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nelas\" title=\"눌러서 듣기\">nelas</span></td></tr></tbody></table></div><h3>78. 간접목적어를 전치사구로 말하기</h3><p>간접목적어는 언제나 <b>전치사구</b>로도 말할 수 있습니다. 대명사를 강조하고 싶을 때는 구를 쓰고, 일반 명사는 선택입니다. <b>lhe와 a ele 중 하나만</b> 쓰고 스페인어처럼 둘을 같이 쓰지 않습니다. '나를 위해'는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para\" title=\"눌러서 듣기\">para</span>, '나에게'는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span> 또는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para\" title=\"눌러서 듣기\">para</span> (브라질에서는 para가 더 흔함).</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu lhe dei o jornal. // Eu dei o jornal a ele.\" title=\"눌러서 듣기\">Eu lhe dei o jornal. // Eu dei o jornal a ele.</span><span class=\"k\">나는 그에게 신문을 주었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele tem um presente para você.\" title=\"눌러서 듣기\">Ele tem um presente para você.</span><span class=\"k\">그는 당신에게 줄 선물이 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Dá isso para mim.\" title=\"눌러서 듣기\">Dá isso para mim.</span><span class=\"k\">그것을 나에게 줘.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Conta-nos essa história. // Conta essa história para nós.\" title=\"눌러서 듣기\">Conta-nos essa história. // Conta essa história para nós.</span><span class=\"k\">그 이야기를 우리에게 들려줘.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vamos escrever uma carta para ele.\" title=\"눌러서 듣기\">Vamos escrever uma carta para ele.</span><span class=\"k\">그에게 편지를 쓰자.</span></li></ul><h3>79. que와 qual</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>que</th><th>qual (복수 quais)</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"용도\" title=\"눌러서 듣기\">용도</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"정의·성격을 물을 때 (무엇인가?)\" title=\"눌러서 듣기\">정의·성격을 물을 때 (무엇인가?)</span></td><td>여러 개 중 선택을 물을 때 (어느 것인가?)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"예\" title=\"눌러서 듣기\">예</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Que é o livro? (책이란 뭐지? → 소설 등)\" title=\"눌러서 듣기\">Que é o livro? (책이란 뭐지? → 소설 등)</span></td><td>Qual é o livro? (어느 것이 책이지?)</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Qual é o seu nome?\" title=\"눌러서 듣기\">Qual é o seu nome?</span><span class=\"k\">이름이 뭐예요? (가능한 이름 중 어느 것?)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Que casa é a sua?\" title=\"눌러서 듣기\">Que casa é a sua?</span><span class=\"k\">어느 집이 당신 집이에요? (명사 앞에는 que)</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>한국어 '무엇/어느'는 둘 다 영어의 what으로 겹치기 때문에 혼란이 생깁니다. <b>명사 바로 앞에는 que</b>를 쓰는 것이 원칙이고, qual은 구어에서 일부 상황에서만 형용사처럼 들립니다.</div><h3>80. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o jornal\" title=\"눌러서 듣기\">o jornal</span> <span class=\"slash\">/</
