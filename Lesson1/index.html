과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 1, "slug": "Lesson1", "label": "Lesson I", "pt": "O substantivo e o artigo definido", "ko": "명사와 정관사", "en": "The noun · gender · plural · the definite article · de/em", "part": "Part 1 · 기초 문장 (Lesson I–VI)", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>포르투갈어 명사에는 <b>성(남성·여성)</b> 과 <b>수(단수·복수)</b> 가 있고, 관사·형용사는 명사에 맞춰 형태가 바뀝니다. 영어처럼 'ㅡ의'를 나타내는 격 변화는 없고 전치사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"de\" title=\"눌러서 듣기\">de</span>를 씁니다.</p><h3>1. 명사 (The noun)</h3><p>명사는 남성 또는 여성이고, 단수 또는 복수입니다. 주어·목적어를 구별하는 격 변화는 없습니다.</p><h3>2. 명사의 성 (Gender)</h3><p>사람을 가리키는 명사는 대개 뜻에 따라 성이 정해집니다. 그 밖의 명사는 <b>어미</b>를 보면 대부분 짐작할 수 있어요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분</th><th>어미</th><th>예</th></tr></thead><tbody><tr><td>남성</td><td>-o, -me, 강세 -á</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o livro, o nome, o xará\" title=\"눌러서 듣기\">o livro, o nome, o xará</span></td></tr><tr><td>여성</td><td>-a, -dade, -gem, -ção</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a casa, a universidade, a viagem, a ação\" title=\"눌러서 듣기\">a casa, a universidade, a viagem, a ação</span></td></tr><tr><td>뜻으로 결정</td><td>사람</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o homem(남자)\" title=\"눌러서 듣기\">o homem(남자)</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a mulher(여자)\" title=\"눌러서 듣기\">a mulher(여자)</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudante\" title=\"눌러서 듣기\">estudante</span>처럼 형태는 같고 관사로 성을 구별하는 명사도 있어요: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o estudante\" title=\"눌러서 듣기\">o estudante</span>(남학생) / <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a estudante\" title=\"눌러서 듣기\">a estudante</span>(여학생). 예외도 있습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o dia\" title=\"눌러서 듣기\">o dia</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o mapa\" title=\"눌러서 듣기\">o mapa</span>는 남성, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a mão\" title=\"눌러서 듣기\">a mão</span>는 여성.</div><h3>3. 명사의 복수형 (Plural of nouns)</h3><ul class=\"rules\"><li>모음(구강·비음) 또는 구강 이중모음으로 끝나면 <b>-s</b>만 붙입니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"livro → livros\" title=\"눌러서 듣기\">livro → livros</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"casa → casas\" title=\"눌러서 듣기\">casa → casas</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"irmã → irmãs\" title=\"눌러서 듣기\">irmã → irmãs</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"céu → céus\" title=\"눌러서 듣기\">céu → céus</span>.</li><li><b>-m</b>으로 끝나면 m을 n으로 바꾸고 -s를 붙입니다 (철자만 바뀌고 소리는 같아요): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"homem → homens\" title=\"눌러서 듣기\">homem → homens</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"jardim → jardins\" title=\"눌러서 듣기\">jardim → jardins</span>.</li></ul><h3>4. 정관사 (The definite article)</h3><p>영어의 the에 해당하는 말은 <b>명사의 성·수에 일치</b>해서 네 가지 형태를 가집니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>남성</th><th>여성</th></tr></thead><tbody><tr><td>단수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o\" title=\"눌러서 듣기\">o</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span></td></tr><tr><td>복수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os\" title=\"눌러서 듣기\">os</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as\" title=\"눌러서 듣기\">as</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"o homem\" title=\"눌러서 듣기\">o homem</span><span class=\"k\">그 남자</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"os homens\" title=\"눌러서 듣기\">os homens</span><span class=\"k\">그 남자들</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"a casa\" title=\"눌러서 듣기\">a casa</span><span class=\"k\">그 집</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"as casas\" title=\"눌러서 듣기\">as casas</span><span class=\"k\">그 집들</span></li></ul><p><b>발음</b>: o, os는 [우], [우스]로 읽습니다. 복수 -s는 다음 단어가 무성자음(c, f, p, q, t, s 등)이면 [s], 유성자음(b, d, g, l, m, n, v 등)이나 모음이면 [z]로 소리 납니다. 그래서 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os homens\" title=\"눌러서 듣기\">os homens</span>는 [우즈 오멘스]처럼 이어집니다.</p><h3>5. de, em과 정관사의 축약 (Contractions)</h3><p>전치사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"de\" title=\"눌러서 듣기\">de</span>(~의, ~에서)와 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"em\" title=\"눌러서 듣기\">em</span>(~에, ~안에)은 정관사와 만나면 합쳐집니다. <b>de의 축약은 필수</b>, <b>em의 축약은 선택이지만 말할 때는 거의 항상</b> 합칩니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>+ o</th><th>+ a</th><th>+ os</th><th>+ as</th></tr></thead><tbody><tr><td>de</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"do\" title=\"눌러서 듣기\">do</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"da\" title=\"눌러서 듣기\">da</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dos\" title=\"눌러서 듣기\">dos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"das\" title=\"눌러서 듣기\">das</span></td></tr><tr><td>em</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"no\" title=\"눌러서 듣기\">no</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"na\" title=\"눌러서 듣기\">na</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nos\" title=\"눌러서 듣기\">nos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nas\" title=\"눌러서 듣기\">nas</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"o livro do professor\" title=\"눌러서 듣기\">o livro do professor</span><span class=\"k\">선생님의 책</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"a porta da casa\" title=\"눌러서 듣기\">a porta da casa</span><span class=\"k\">집의 문</span></li></ul><h3>6. 전치사 em의 쓰임 (Use of em)</h3><ul class=\"rules\"><li><b>in</b> (장소·시간): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"na casa\" title=\"눌러서 듣기\">na casa</span>(집 안에), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"no verão\" title=\"눌러서 듣기\">no verão</span>(여름에), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"no livro\" title=\"눌러서 듣기\">no livro</span>(책 속에)</li><li><b>into</b> (안으로 들어가는 움직임): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele entra na casa.\" title=\"눌러서 듣기\">Ele entra na casa.</span></li><li><b>on</b> (표면 위): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Está na mesa.\" title=\"눌러서 듣기\">Está na mesa.</span>(탁자 위에 있다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Está na parede.\" title=\"눌러서 듣기\">Está na parede.</span>(벽에 있다)</li><li><b>at</b> (장소): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"João está na escola.\" title=\"눌러서 듣기\">João está na escola.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eles estão em casa.\" title=\"눌러서 듣기\">Eles estão em casa.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>'집에'를 뜻할 때 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"em casa\" title=\"눌러서 듣기\">em casa</span>처럼 <b>관사 없이</b> 씁니다. 반면 '그 집 안에'는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"na casa\" title=\"눌러서 듣기\">na casa</span>.</div><h3>7. 소유 표현 (The possessive of nouns)</h3><p>명사에는 소유격이 없어서 <b>소유하는 사람 앞에 de</b>를 둡니다. 소유되는 것이 먼저 오고, 소유자가 뒤에 옵니다. (영어 's와 순서가 반대)</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A mesa do professor.\" title=\"눌러서 듣기\">A mesa do professor.</span><span class=\"k\">선생님의 책상.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Os livros dos estudantes.\" title=\"눌러서 듣기\">Os livros dos estudantes.</span><span class=\"k\">학생들의 책들.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A cadeira da estudante.\" title=\"눌러서 듣기\">A cadeira da estudante.</span><span class=\"k\">여학생의 의자.</span></li></ul><h3>8. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a aula\" title=\"눌러서 듣기\">a aula</span></td><td>수업, 교실</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o professor\" title=\"눌러서 듣기\">o professor</span></td><td>선생님, 교수</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a porta\" title=\"눌러서 듣기\">a porta</span></td><td>문</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a cadeira\" title=\"눌러서 듣기\">a cadeira</span></td><td>의자</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o estudante\" title=\"눌러서 듣기\">o estudante</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a estudante\" title=\"눌러서 듣기\">a estudante</span></td><td>학생</td></tr><tr><td><span class=\"pt\" r
