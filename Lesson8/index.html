과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 8, "slug": "Lesson8", "label": "Lesson VIII", "pt": "Fazer, o tempo, demonstrativos e negativos", "ko": "fazer 동사, 날씨 표현, 지시사, 부정어", "en": "fazer · weather · este/esse/aquele · contractions · negatives", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>fazer</b>(하다·만들다)와 날씨 표현, 세 가지 거리의 지시사(<b>este / esse / aquele</b>), 그리고 이중부정을 쓰는 부정어(nada, nunca, ninguém …)를 배웁니다.</p><h3>41. 불규칙 동사 fazer</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>fazer</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"faço\" title=\"눌러서 듣기\">faço</span></td><td>나는 한다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"faz\" title=\"눌러서 듣기\">faz</span></td><td>그는 한다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazemos\" title=\"눌러서 듣기\">fazemos</span></td><td>우리는 한다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazem\" title=\"눌러서 듣기\">fazem</span></td><td>그들은 한다</td></tr></tbody></table></div><h3>42. fazer의 쓰임</h3><p>fazer는 영어 do와 make의 쓰임을 대부분 가지지만, <b>다른 동사를 돕는 조동사로는 쓰지 않고</b>, 앞의 동사를 대신 받는 do 같은 역할도 거의 하지 않습니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu faço meu trabalho.\" title=\"눌러서 듣기\">Eu faço meu trabalho.</span><span class=\"k\">나는 내 일을 한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu estou fazendo café.\" title=\"눌러서 듣기\">Eu estou fazendo café.</span><span class=\"k\">나는 커피를 만들고 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele não fala português, mas sim lê.\" title=\"눌러서 듣기\">Ele não fala português, mas sim lê.</span><span class=\"k\">그는 포르투갈어를 말하진 못하지만 읽긴 한다.</span></li></ul><p><b>날씨</b>는 주어 없이 3인칭 단수 <b>faz</b>와 명사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"frio\" title=\"눌러서 듣기\">frio</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"calor\" title=\"눌러서 듣기\">calor</span>, 또는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tempo\" title=\"눌러서 듣기\">tempo</span> + 형용사로 말합니다. 지금 이 순간의 날씨는 <b>진행형</b>을 씁니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Faz calor no Rio no verão.\" title=\"눌러서 듣기\">Faz calor no Rio no verão.</span><span class=\"k\">리우는 여름에 덥다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não está fazendo calor hoje.\" title=\"눌러서 듣기\">Não está fazendo calor hoje.</span><span class=\"k\">오늘은 덥지 않다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Que tempo está fazendo agora?\" title=\"눌러서 듣기\">Que tempo está fazendo agora?</span><span class=\"k\">지금 날씨가 어때요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Sempre faz bom tempo aqui.\" title=\"눌러서 듣기\">Sempre faz bom tempo aqui.</span><span class=\"k\">여기는 늘 날씨가 좋다.</span></li></ul><h3>43. 날씨에 estar 쓰기</h3><p><b>estar</b>도 주어 없이(또는 주어 tempo와 함께) 형용사를 붙여 날씨를 말할 수 있습니다. fazer를 쓰지 못하는 표현도 estar로 말해요. 이때 estar는 진행형이 없습니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O tempo está bom.\" title=\"눌러서 듣기\">O tempo está bom.</span><span class=\"k\">날씨가 좋다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Está quente hoje.\" title=\"눌러서 듣기\">Está quente hoje.</span><span class=\"k\">오늘 덥다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Como está o tempo?\" title=\"눌러서 듣기\">Como está o tempo?</span><span class=\"k\">날씨 어때요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Hoje o tempo está chuvoso.\" title=\"눌러서 듣기\">Hoje o tempo está chuvoso.</span><span class=\"k\">오늘은 비가 온다(비 오는 날씨다).</span></li></ul><h3>44. 지시 형용사·지시 대명사</h3><p>지시사는 세 가지로, <b>말하는 사람·듣는 사람·둘 다에게서 먼 것</b>에 해당하며 인칭(나·너·그)과 짝을 이룹니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>이 (내 가까이)</th><th>그 (네 가까이)</th><th>저 (둘 다에게서 멀리)</th></tr></thead><tbody><tr><td>남성 단수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"este\" title=\"눌러서 듣기\">este</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esse\" title=\"눌러서 듣기\">esse</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aquele\" title=\"눌러서 듣기\">aquele</span></td></tr><tr><td>남성 복수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estes\" title=\"눌러서 듣기\">estes</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esses\" title=\"눌러서 듣기\">esses</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aqueles\" title=\"눌러서 듣기\">aqueles</span></td></tr><tr><td>여성 단수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"esta\" title=\"눌러서 듣기\">esta</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"essa\" title=\"눌러서 듣기\">essa</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aquela\" title=\"눌러서 듣기\">aquela</span></td></tr><tr><td>여성 복수</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estas\" title=\"눌러서 듣기\">estas</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"essas\" title=\"눌러서 듣기\">essas</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aquelas\" title=\"눌러서 듣기\">aquelas</span></td></tr><tr><td>중성(것·일)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"isto\" title=\"눌러서 듣기\">isto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"isso\" title=\"눌러서 듣기\">isso</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aquilo\" title=\"눌러서 듣기\">aquilo</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>남성형의 강세 모음은 모두 닫힌 /ê/, 여성형은 모두 열린 /é/, 중성형은 /i/ 입니다(este [에스치] / esta [에스타]). 중성 isto/isso/aquilo는 <b>이름을 모르는 것, 일 전체</b>를 가리킬 때 써요: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O que é isso?\" title=\"눌러서 듣기\">O que é isso?</span></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>실제 구어에서는 este보다 esse를 더 많이 쓰는 사람이 많습니다. 이 사이트는 교재의 3단계 구별을 따릅니다.</div><h3>45. 지시사와 전치사의 축약</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>+ este계</th><th>+ esse계</th><th>+ aquele계</th></tr></thead><tbody><tr><td>de</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deste\" title=\"눌러서 듣기\">deste</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"desta\" title=\"눌러서 듣기\">desta</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"disto\" title=\"눌러서 듣기\">disto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"desse\" title=\"눌러서 듣기\">desse</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dessa\" title=\"눌러서 듣기\">dessa</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"disso\" title=\"눌러서 듣기\">disso</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"daquele\" title=\"눌러서 듣기\">daquele</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"daquela\" title=\"눌러서 듣기\">daquela</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"daquilo\" title=\"눌러서 듣기\">daquilo</span></td></tr><tr><td>em</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"neste\" title=\"눌러서 듣기\">neste</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nesta\" title=\"눌러서 듣기\">nesta</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nisto\" title=\"눌러서 듣기\">nisto</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nesse\" title=\"눌러서 듣기\">nesse</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nessa\" title=\"눌러서 듣기\">nessa</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nisso\" title=\"눌러서 듣기\">nisso</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"naquele\" title=\"눌러서 듣기\">naquele</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"naquela\" title=\"눌러서 듣기\">naquela</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"naquilo\" title=\"눌러서 듣기\">naquilo</span></td></tr><tr><td>a</td><td>—</td><td>—</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"àquele\" title=\"눌러서 듣기\">àquele</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"àquela\" title=\"눌러서 듣기\">àquela</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"àquilo\" title=\"눌러서 듣기\">àquilo</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span>는 aquele계와만 합쳐지고(àquele, àquela …), 소리는 aquele와 같습니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para\" title=\"눌러서 듣기\">para</span>는 aquele와 말할 때만 합쳐집니다(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"praquele\" title=\"눌러서 듣기\">praquele</span>). 글로는 쓰지 않아요.</div><h3>46. 부정어 (The negatives)</h3><p>부정어가 <b>동사 뒤에</b> 오면 반드시 동사 앞에도 부정어가 있어야 합니다. 다른 부정어가 앞에 없으면 <b>não</b>를 동사 앞에 놓아요. 부정어가 주어면 자연히 동사 앞에 옵니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>부정어</th><th>뜻</th><th>예</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nada\" title=\"눌러서 듣기\">nada</span></td><td>아무것도</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não tenho nada.\" title=\"눌러서 듣기\">Não tenho nada.</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nenhum\" title=\"눌러서 듣기\">nenhum</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nenhuma\" title=\"눌러서 듣기\">nenhuma</span></td><td>어떤 ~도</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não tenho nenhum livro.\" title=\"눌러서 듣기\">Não tenho nenhum livro.</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ninguém\" title=\"눌러서 듣기\">ninguém</span></td><td>아무도</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ninguém está aqui.\" title=\"눌러서 듣기\">Ninguém está aqui.</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nunca\" title=\"눌러서 듣기\">nunca</span></td><td>결코</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Nunca falo com ele.\" title=\"눌러서 듣기\">Nunca falo com ele.</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nem … nem\" title=\"눌러서 듣기\">nem … nem</span></td><td>~도 ~도 아니다</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Nem João nem Maria\" title=\"눌러서 듣기\">Nem João nem Maria</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"bu
