하다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"introduzir\" title=\"눌러서 듣기\">introduzir</span>(도입하다).</p><h3>132. 완료 시제 (ter + 과거분사)</h3><p>완료 시제는 <b>조동사 ter의 단순 시제 + 과거분사</b>로 만듭니다. 이론상 haver도 쓸 수 있고 문어에는 나오지만, <b>BF는 항상 ter</b>를 씁니다. ter와 쓰는 과거분사는 <b>형태가 변하지 않습니다</b>. <b>ter의 단순과거는 조동사로 쓰지 않습니다.</b></p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재완료</th><th>대과거</th><th>미래완료</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenho falado\" title=\"눌러서 듣기\">tenho falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tinha falado\" title=\"눌러서 듣기\">tinha falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"terei falado\" title=\"눌러서 듣기\">terei falado</span></td></tr><tr><td>você·ele</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tem falado\" title=\"눌러서 듣기\">tem falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tinha falado\" title=\"눌러서 듣기\">tinha falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"terá falado\" title=\"눌러서 듣기\">terá falado</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"temos falado\" title=\"눌러서 듣기\">temos falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tínhamos falado\" title=\"눌러서 듣기\">tínhamos falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"teremos falado\" title=\"눌러서 듣기\">teremos falado</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"têm falado\" title=\"눌러서 듣기\">têm falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tinham falado\" title=\"눌러서 듣기\">tinham falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"terão falado\" title=\"눌러서 듣기\">terão falado</span></td></tr></tbody></table></div><p><b>조건 완료</b>는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"teria falado\" title=\"눌러서 듣기\">teria falado</span> 입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재완료접속법</th><th>대과거접속법</th><th>미래완료접속법</th></tr></thead><tbody><tr><td>eu·você·ele</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenha falado\" title=\"눌러서 듣기\">tenha falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tivesse falado\" title=\"눌러서 듣기\">tivesse falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tiver falado\" title=\"눌러서 듣기\">tiver falado</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenhamos falado\" title=\"눌러서 듣기\">tenhamos falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tivéssemos falado\" title=\"눌러서 듣기\">tivéssemos falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tivermos falado\" title=\"눌러서 듣기\">tivermos falado</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenham falado\" title=\"눌러서 듣기\">tenham falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tivessem falado\" title=\"눌러서 듣기\">tivessem falado</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tiverem falado\" title=\"눌러서 듣기\">tiverem falado</span></td></tr></tbody></table></div><p><b>완료 부정사</b>: 비인칭 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ter falado\" title=\"눌러서 듣기\">ter falado</span>, 인칭 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(nós) termos falado\" title=\"눌러서 듣기\">(nós) termos falado</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"(eles) terem falado\" title=\"눌러서 듣기\">(eles) terem falado</span>. <b>완료 능동 분사</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tendo falado\" title=\"눌러서 듣기\">tendo falado</span>.</p><h3>133. 영어 완료 시제와의 차이</h3><ul class=\"rules\"><li><b>a. 현재완료</b>: 영어의 현재완료는 보통 <b>단순과거</b>로 말합니다. 포르투갈어 현재완료는 <b>최근 과거에 계속되거나 반복되는</b> 동작(지금까지 이어지지만 현재를 딱 포함하진 않음)에 씁니다. 영어의 '~해 오고 있다'에 가깝습니다.</li><li><b>b. 대과거</b>: 영어의 과거완료와 같습니다.</li><li><b>c. 미래완료</b>: 영어와 뜻이 같고, 오히려 단순미래보다 더 자주 씁니다.</li><li><b>d. 조건완료</b>: 단순조건법보다 더 쓰이지만, 대과거 직설법으로 대신하는 경우도 많습니다.</li><li><b>e. 접속법 완료 세 시제</b>: 영어로는 대개 직설법으로 옮깁니다. 미래성이 있으면 접속사 뒤에서 <b>반드시 미래완료접속법</b>을 씁니다. 세 시제 모두 BF에서 실제로 쓰입니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu já falei.\" title=\"눌러서 듣기\">Eu já falei.</span><span class=\"k\">나는 이미 말했다. (영어 have spoken)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Como é que você tem estado?\" title=\"눌러서 듣기\">Como é que você tem estado?</span><span class=\"k\">요즘 어떻게 지내요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Que é que ele tem feito?\" title=\"눌러서 듣기\">Que é que ele tem feito?</span><span class=\"k\">그는 (요즘) 무엇을 해 오고 있어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Tenho ido à cidade com freqüência.\" title=\"눌러서 듣기\">Tenho ido à cidade com freqüência.</span><span class=\"k\">나는 시내에 자주 다니고 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu já viajei na Europa várias vezes.\" title=\"눌러서 듣기\">Eu já viajei na Europa várias vezes.</span><span class=\"k\">나는 유럽을 여러 번 여행한 적 있다. (횟수 → 단순과거)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele mora nesta cidade há sete anos.\" title=\"눌러서 듣기\">Ele mora nesta cidade há sete anos.</span><span class=\"k\">그는 7년째 이 도시에 산다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu já tinha acabado o trabalho.\" title=\"눌러서 듣기\">Eu já tinha acabado o trabalho.</span><span class=\"k\">나는 이미 일을 끝냈었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Até segunda-feira terei acabado.\" title=\"눌러서 듣기\">Até segunda-feira terei acabado.</span><span class=\"k\">월요일까지는 끝낼 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se eu tivesse visto o João, teria falado com ele.\" title=\"눌러서 듣기\">Se eu tivesse visto o João, teria falado com ele.</span><span class=\"k\">내가 주앙을 봤더라면 말을 했을 텐데.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Espero que ele já tenha chegado.\" title=\"눌러서 듣기\">Espero que ele já tenha chegado.</span><span class=\"k\">그가 벌써 도착했기를 바란다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vamos sair quando você tiver acabado o jantar.\" title=\"눌러서 듣기\">Vamos sair quando você tiver acabado o jantar.</span><span class=\"k\">당신이 저녁을 다 먹으면 나가요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele irá conosco assim que se tiver vestido.\" title=\"눌러서 듣기\">Ele irá conosco assim que se tiver vestido.</span><span class=\"k\">그는 옷을 입자마자 우리와 갈 것이다.</span></li></ul><h3>134. se(만약 ~라면) 뒤의 동사 형태</h3><ul class=\"rules\"><li><b>a. 습관·상태</b>: 현재 직설법. <b>se 뒤에서는 현재접속법을 쓰지 않습니다.</b> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Se ele dá com um amigo, sempre fica conversando.\" title=\"눌러서 듣기\">Se ele dá com um amigo, sempre fica conversando.</span></li><li><b>b. 과거의 인정된/가능한 사실</b>: 직설법. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Se ele dava com um amigo...\" title=\"눌러서 듣기\">Se ele dava com um amigo...</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Se ele esteve em casa ontem, ninguém viu.\" title=\"눌러서 듣기\">Se ele esteve em casa ontem, ninguém viu.</span></li><li><b>c. 현실과 반대되는 가정</b>: 접속법 불완료과거. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Se desse tempo, eu iria.\" title=\"눌러서 듣기\">Se desse tempo, eu iria.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Se ele fosse rico, gostaria de viajar.\" titl
