과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 6, "slug": "Lesson6", "label": "Lesson VI", "pt": "O verbo ir e as preposições para e a", "ko": "ir 동사, 전치사 para·a, 언어 이름과 관사", "en": "ir · para/a · contractions · language names", "part": "Part 1 · 기초 문장 (Lesson I–VI)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>ir(가다)</b> 는 '가다'뿐 아니라 <b>'~할 것이다'(미래 표현)</b> 와 <b>'~하자'(제안)</b> 에도 쓰이는 매우 중요한 동사입니다. 전치사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para\" title=\"눌러서 듣기\">para</span>와 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span>의 차이도 함께 배워요.</p><h3>32. 불규칙 동사 ir (가다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>ir</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vou\" title=\"눌러서 듣기\">vou</span></td><td>나는 간다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vai\" title=\"눌러서 듣기\">vai</span></td><td>그는 간다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vamos\" title=\"눌러서 듣기\">vamos</span></td><td>우리는 간다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vão\" title=\"눌러서 듣기\">vão</span></td><td>그들은 간다</td></tr></tbody></table></div><h3>33. ir의 쓰임 (Uses of ir)</h3><ul class=\"rules\"><li><b>가다</b>: 영어처럼 현재형이 가까운 미래를 나타내기도 합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele vai lá todos os dias.\" title=\"눌러서 듣기\">Ele vai lá todos os dias.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou à cidade amanhã.\" title=\"눌러서 듣기\">Eu vou à cidade amanhã.</span></li><li><b>ir + 동사원형 = ~할 것이다</b> (가까운 미래). 전치사 없이 바로 원형이 옵니다. 영어와 달리 진행형(estar indo)은 쓰지 않아요. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou comer.\" title=\"눌러서 듣기\">Eu vou comer.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos ficar aqui.\" title=\"눌러서 듣기\">Vamos ficar aqui.</span></li><li><b>안부 묻기</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Como vai você?\" title=\"눌러서 듣기\">Como vai você?</span> — <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vou bem, obrigado.\" title=\"눌러서 듣기\">Vou bem, obrigado.</span></li><li><b>Vamos + 동사원형 = ~하자(let's)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos comer.\" title=\"눌러서 듣기\">Vamos comer.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não vamos partir hoje.\" title=\"눌러서 듣기\">Não vamos partir hoje.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vamos!\" title=\"눌러서 듣기\">Vamos!</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>'고맙습니다'는 말하는 사람의 성에 맞춰 남성 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"obrigado\" title=\"눌러서 듣기\">obrigado</span>, 여성 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"obrigada\" title=\"눌러서 듣기\">obrigada</span>를 씁니다.</div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou comer.\" title=\"눌러서 듣기\">Eu vou comer.</span><span class=\"k\">나는 먹을 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Vamos trabalhar.\" title=\"눌러서 듣기\">Vamos trabalhar.</span><span class=\"k\">일하러 가자.</span></li></ul><h3>34. 전치사 para와 a의 축약</h3><p><b>para</b>의 축약은 말할 때 거의 항상 일어나지만 <b>글에서는 쓰지 않습니다</b>. <b>a</b>의 축약은 글로도 씁니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>전치사 + 관사</th><th>para (말할 때)</th><th>a (글로도 씀)</th></tr></thead><tbody><tr><td>+ o</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pro\" title=\"눌러서 듣기\">pro</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ao\" title=\"눌러서 듣기\">ao</span></td></tr><tr><td>+ a</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pra\" title=\"눌러서 듣기\">pra</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"à\" title=\"눌러서 듣기\">à</span></td></tr><tr><td>+ os</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pros\" title=\"눌러서 듣기\">pros</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aos\" title=\"눌러서 듣기\">aos</span></td></tr><tr><td>+ as</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pras\" title=\"눌러서 듣기\">pras</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"às\" title=\"눌러서 듣기\">às</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a\" title=\"눌러서 듣기\">a</span>는 부정관사 um, uma와는 합쳐지지 않습니다. 또 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"à\" title=\"눌러서 듣기\">à</span>의 ` (crase)는 강세가 아니라 '전치사 a + 관사 a'가 합쳐졌다는 표시입니다.</div><h3>35. para와 a의 쓰임</h3><ul class=\"rules\"><li><b>para</b>는 영어의 for 외에 to로도 많이 쓰입니다. ir 같은 이동 동사 뒤에서 도착해서 <b>머무를 사람</b>, 또는 <b>원래 있던 곳</b>으로 가는 경우에 para를 써요.</li><li><b>a</b>는 도착지에 <b>잠깐만 있다가 돌아올</b> 때 씁니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O americano vai ao Brasil.\" title=\"눌러서 듣기\">O americano vai ao Brasil.</span><span class=\"k\">미국인이 브라질에 (잠깐) 간다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O brasileiro vai para o Brasil.\" title=\"눌러서 듣기\">O brasileiro vai para o Brasil.</span><span class=\"k\">브라질 사람이 브라질로 (돌아)간다.</span></li></ul><ul class=\"rules\"><li>간접목적어('~에게')는 para나 a 어느 쪽이든 되지만 구어에서는 <b>para</b>가 더 흔합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Escreve para João.\" title=\"눌러서 듣기\">Escreve para João.</span></li><li><b>시간</b>의 '~시에'는 a: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Às duas horas.\" title=\"눌러서 듣기\">Às duas horas.</span> 장소의 '~에'는 보통 em: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está em casa.\" title=\"눌러서 듣기\">Ele está em casa.</span></li></ul><h3>36. 언어 이름과 정관사</h3><p>언어 이름에는 보통 정관사가 붙습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O português é a língua do Brasil.\" title=\"눌러서 듣기\">O português é a língua do Brasil.</span> 하지만 <b>em, falar 바로 뒤</b>에서는 생략합니다. 정신 활동 동사(estudar, aprender 등) 뒤에서는 생략이 보통이지만 써도 됩니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele fala português.\" title=\"눌러서 듣기\">Ele fala português.</span><span class=\"k\">그는 포르투갈어를 말한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eles escrevem cartas em inglês.\" title=\"눌러서 듣기\">Eles escrevem cartas em inglês.</span><span class=\"k\">그들은 영어로 편지를 쓴다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu estou estudando (o) espanhol.\" title=\"눌러서 듣기\">Eu estou estudando (o) espanhol.</span><span class=\"k\">나는 스페인어를 공부하고 있다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você fala muito bem o português.\" title=\"눌러서 듣기\">Você fala muito bem o português.</span><span class=\"k\">당신은 포르투갈어를 아주 잘 하시네요.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"um livro de português\" title=\"눌러서 듣기\">um livro de português</span>(포르투갈어 책)처럼 de + 언어가 형용사 역할을 하면 관사를 생략합니다.</div><h3>37. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=
