ata-say=\"ria\" title=\"눌러서 듣기\">ria</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"rimos\" title=\"눌러서 듣기\">rimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"rimos\" title=\"눌러서 듣기\">rimos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ríamos\" title=\"눌러서 듣기\">ríamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"riamos\" title=\"눌러서 듣기\">riamos</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"riem\" title=\"눌러서 듣기\">riem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"riram\" title=\"눌러서 듣기\">riram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"riam\" title=\"눌러서 듣기\">riam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"riam\" title=\"눌러서 듣기\">riam</span></td></tr></tbody></table></div><p><b>현재 직설법만</b> 불규칙이고 나머지는 규칙입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sorrir\" title=\"눌러서 듣기\">sorrir</span>(미소 짓다)는 rir 앞에 sor-를 붙인 것으로 똑같이 변합니다.</p><h3>123. 접속법 불완료과거 만드는 법</h3><p>어느 동사든 <b>단순과거 3인칭 복수형</b>에서 <b>-ram을 떼고</b> <b>-sse, -ssemos, -ssem</b>을 붙입니다. 붙기 전 모음은 <b>항상 단순과거의 모음</b>을 그대로 쓰고, <b>nós형은 그 모음에 악센트 표시</b>가 필요합니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar</th><th>comer</th><th>abrir</th><th>ser</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu·você·ele\" title=\"눌러서 듣기\">eu·você·ele</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falasse\" title=\"눌러서 듣기\">falasse</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comesse\" title=\"눌러서 듣기\">comesse</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrisse\" title=\"눌러서 듣기\">abrisse</span></td><td>fosse</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falássemos\" title=\"눌러서 듣기\">falássemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comêssemos\" title=\"눌러서 듣기\">comêssemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abríssemos\" title=\"눌러서 듣기\">abríssemos</span></td><td>fôssemos</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vocês·eles\" title=\"눌러서 듣기\">vocês·eles</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falassem\" title=\"눌러서 듣기\">falassem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comessem\" title=\"눌러서 듣기\">comessem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrissem\" title=\"눌러서 듣기\">abrissem</span></td><td>fossem</td></tr></tbody></table></div><h3>124. 접속법 불완료과거의 쓰임</h3><p>주절의 동사가 <b>어떤 과거 시제</b>(조건법 포함)이면 종속절 접속법은 <b>불완료과거</b>를 씁니다. 현재·미래·명령형 주절 뒤에는 <b>현재접속법</b>(또는 미래접속법)입니다. 시제 일치의 문제일 뿐입니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu quero que você vá comigo.\" title=\"눌러서 듣기\">Eu quero que você vá comigo.</span><span class=\"k\">네가 나와 함께 가기를 바란다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu queria que você fosse comigo.\" title=\"눌러서 듣기\">Eu queria que você fosse comigo.</span><span class=\"k\">네가 나와 함께 가기를 바랐다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele sente que você esteja doente.\" title=\"눌러서 듣기\">Ele sente que você esteja doente.</span><span class=\"k\">그는 네가 아파서 안타까워한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele sentia que você estivesse doente.\" title=\"눌러서 듣기\">Ele sentia que você estivesse doente.</span><span class=\"k\">그는 네가 아파서 안타까워했다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele sente que você estivesse doente.\" title=\"눌러서 듣기\">Ele sente que você estivesse doente.</span><span class=\"k\">그는 네가 (그때) 아팠던 것이 안타깝다.</span></li></ul><p>마지막 예처럼, <b>감정 표현</b>은 현재형이어도 <b>과거에 있었던 일</b> 때문이면 뒤에 불완료과거 접속법이 올 수 있습니다.</p><h3>125. 부사절의 접속법</h3><p><b>부사절 접속사</b> 뒤에서도 접속법을 많이 씁니다. 미래의 행동이나 조건을 가리킬 때 쓰며, 접속사마다 <b>미래접속법·현재접속법</b> 중 무엇이 오는지가 정해져 있습니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>분류</th><th>접속사</th><th>뒤에 오는 형</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"시간\" title=\"눌러서 듣기\">시간</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quando (~할 때), enquanto (~하는 동안)\" title=\"눌러서 듣기\">quando (~할 때), enquanto (~하는 동안)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"미래접속법\" title=\"눌러서 듣기\">미래접속법</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"시간\" title=\"눌러서 듣기\">시간</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"logo que, assim que (~하자마자), depois que (~한 뒤)\" title=\"눌러서 듣기\">logo que, assim que (~하자마자), depois que (~한 뒤)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"현재 또는 미래 (BF는 미래 선호)\" title=\"눌러서 듣기\">현재 또는 미래 (BF는 미래 선호)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"시간\" title=\"눌러서 듣기\">시간</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"antes que (~하기 전에), até que (~할 때까지)\" title=\"눌러서 듣기\">antes que (~하기 전에), até que (~할 때까지)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"현재접속법만\" title=\"눌러서 듣기\">현재접속법만</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"양보\" title=\"눌러서 듣기\">양보</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"embora, ainda que, posto que (비록 ~이지만)\" title=\"눌러서 듣기\">embora, ainda que, posto que (비록 ~이지만)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"현재접속법 (미래 불가)\" title=\"눌러서 듣기\">현재접속법 (미래 불가)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"목적\" title=\"눌러서 듣기\">목적</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"para que, a fim de que (~하도록)\" title=\"눌러서 듣기\">para que, a fim de que (~하도록)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"현재접속법\" title=\"눌러서 듣기\">현재접속법</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"결과\" title=\"눌러서 듣기\">결과</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"de maneira que, de modo que, de jeito que (그래서)\" title=\"눌러서 듣기\">de maneira que, de modo que, de jeito que (그래서)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"목적 의미가 있을 때만 접속법\" title=\"눌러서 듣기\">목적 의미가 있을 때만 접속법</span></td></tr></tbody></table></div><ul class=\"rules\"><li><b>양보</b> 접속사 뒤에는 사실이든 아니든 <b>항상 현재접속법</b>이며 미래접속법은 쓰지 않습니다.</li><li><b>결과</b> 접속사는 <b>목적의 뜻이 함께 있을 때만</b> 접속법, 단순한 결과이면 <b>직설법</b>입니다.</li><li>이 모든 경우 주절이 <b>과거</b>이면 종속절은 <b>불완료과거 접속법</b>이 됩니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Embora eu esteja cansado, vou trabalhar.\" title=\"눌러서 듣기\">Embora eu esteja cansado, vou trabalhar.</span><span class=\"k\">피곤하지만 일하러 가겠다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele trabalhou para que nós comêssemos.\" title=\"눌러서 듣기\">Ele trabalhou para que nós comêssemos.</span><span class=\"k\">그는 우리가 먹을 수 있도록 일했다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Espere até que ele volte.\" title=\"눌러서 듣기\">Espere até que ele volte.</span><span class=\"k\">그가 돌아올 때까지 기다려라.</span></li></ul><h3>이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o jeito\" title=\"눌러서 듣기
