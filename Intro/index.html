과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 0, "slug": "Intro", "label": "Introdução", "pt": "Pronúncia e ortografia", "ko": "발음과 철자", "en": "Introduction — Pronunciation and spelling", "part": "서론 · 발음과 철자", "verb": false, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원에서 배우는 것</h2><p>포르투갈어는 <b>쓰인 모양을 보면 읽는 법이 거의 정해지는</b> 언어입니다. 이 단원에서는 음절을 나누는 법, 강세 규칙, 악센트 부호, 그리고 브라질(리우데자네이루 중심) 발음의 핵심 규칙을 한국어로 정리합니다.</p><div class=\"note warn\"><b class=\"lab\">원포인트</b>교재는 1974년판이라 일부 철자(freqüente, vôo, pára 등)가 옛 철자예요. 이 사이트는 현재 맞춤법(frequente, voo, para)을 사용합니다.</div><h3>1. 음절 나누기 (Syllabification)</h3><ul class=\"rules\"><li>모음 하나(또는 이중모음)마다 음절이 하나입니다. 모음 사이의 자음 하나는 뒤 음절로 갑니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ca-sa\" title=\"눌러서 듣기\">ca-sa</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pa-to\" title=\"눌러서 듣기\">pa-to</span>.</li><li>자음 + r/l이 붙어 있으면 한 덩어리로 뒤 음절로 갑니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a-bro\" title=\"눌러서 듣기\">a-bro</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"du-plo\" title=\"눌러서 듣기\">du-plo</span>.</li><li>그 밖의 자음 둘은 갈라집니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ai-to\" title=\"눌러서 듣기\">ai-to</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ar-de\" title=\"눌러서 듣기\">ar-de</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"es-te\" title=\"눌러서 듣기\">es-te</span>.</li><li><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ch\" title=\"눌러서 듣기\">ch</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"lh\" title=\"눌러서 듣기\">lh</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nh\" title=\"눌러서 듣기\">nh</span>는 소리 하나라서 갈라지지 않습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ma-nhã\" title=\"눌러서 듣기\">ma-nhã</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fi-lha\" title=\"눌러서 듣기\">fi-lha</span>.</li><li>말할 때 p, b, d, g, t 뒤에 자음이 오면 짧은 <b>'이'</b> 소리가 끼어듭니다. 쓰지는 않지만 늘 발음해요: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pneu\" title=\"눌러서 듣기\">pneu</span>(피네우), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ritmo\" title=\"눌러서 듣기\">ritmo</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"observar\" title=\"눌러서 듣기\">observar</span>(오비세르바르).</li></ul><h3>2. 강세 규칙 (Stress)</h3><p>악센트 부호가 없으면 아래 규칙대로 강세를 줍니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>단어 끝 모양</th><th>강세 위치</th><th>예</th></tr></thead><tbody><tr><td>a, e, o (+ s, m, ns)</td><td>끝에서 두 번째 음절</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"casa, come, homem, rios\" title=\"눌러서 듣기\">casa, come, homem, rios</span></td></tr><tr><td>i, u (+ s, m, ns)</td><td>마지막 음절</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aqui, peru, comum\" title=\"눌러서 듣기\">aqui, peru, comum</span></td></tr><tr><td>이중모음(구강·비음) (+ s)</td><td>마지막 음절</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"papai, irmão, capitães\" title=\"눌러서 듣기\">papai, irmão, capitães</span></td></tr><tr><td>m, s 이외의 자음</td><td>마지막 음절</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"papel, falar, cidade\" title=\"눌러서 듣기\">papel, falar, cidade</span></td></tr></tbody></table></div><h3>3. 악센트 부호 (Written accents)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>부호</th><th>이름</th><th>역할</th><th>예</th></tr></thead><tbody><tr><td>´</td><td>agudo</td><td>열린 소리 a·e·o, 또는 강세 있는 i·u</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"café, avó, saúde\" title=\"눌러서 듣기\">café, avó, saúde</span></td></tr><tr><td>^</td><td>circunflexo</td><td>닫힌 소리 a·e·o</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"avô, você, câmara\" title=\"눌러서 듣기\">avô, você, câmara</span></td></tr><tr><td>~</td><td>til</td><td>비음 + 강세</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"irmã, irmão, lições\" title=\"눌러서 듣기\">irmã, irmão, lições</span></td></tr><tr><td>`</td><td>crase(grave)</td><td>전치사 a와 관사 등이 합쳐졌다는 표시(강세 아님)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"à, às, àquele\" title=\"눌러서 듣기\">à, às, àquele</span></td></tr></tbody></table></div><p>부호를 써야 하는 대표 경우입니다.</p><ul class=\"rules\"><li>강세가 있는 한 음절 단어 중 일부: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vê\" title=\"눌러서 듣기\">vê</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"lê\" title=\"눌러서 듣기\">lê</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pé\" title=\"눌러서 듣기\">pé</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"só\" title=\"눌러서 듣기\">só</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span>.</li><li>마지막 음절에 강세가 있는 a, e, o (+ s, m, ns): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"avô\" title=\"눌러서 듣기\">avô</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"café\" title=\"눌러서 듣기\">café</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"inglês\" title=\"눌러서 듣기\">inglês</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"também\" title=\"눌러서 듣기\">também</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"parabéns\" title=\"눌러서 듣기\">parabéns</span>.</li><li>끝에서 세 번째 음절에 강세가 있는 말(모두): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"médico\" title=\"눌러서 듣기\">médico</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"século\" title=\"눌러서 듣기\">século</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"árvore\" title=\"눌러서 듣기\">árvore</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"câmara\" title=\"눌러서 듣기\">câmara</span>.</li><li>끝에서 두 번째에 강세가 있고 u, i, 이중모음, m·s 이외 자음으로 끝나는 말: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fácil\" title=\"눌러서 듣기\">fácil</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"júri\" title=\"눌러서 듣기\">júri</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"órgão\" title=\"눌러서 듣기\">órgão</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fáceis\" title=\"눌러서 듣기\">fáceis</span>.</li><li>이중모음 éi, éu, ói의 열린 소리: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"céu\" title=\"눌러서 듣기\">céu</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"papéis\" title=\"눌러서 듣기\">papéis</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dói\" title=\"눌러서 듣기\">dói</span>.</li><li>3인칭 복수 동사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"têm\" title=\"눌러서 듣기\">têm</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vêm\" title=\"눌러서 듣기\">vêm</span>(단수 tem, vem과 구별).</li><li>이중모음이 아닌 따로 읽는 i·u 에 강세: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"saúde\" title=\"눌러서 듣기\">saúde</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"baía\" title=\"눌러서 듣기\">baía</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"juízo\" title=\"눌러서 듣기\">juízo</span>. (단, nh 앞이나 같은 음절의 l, m, n, r, z 앞에서는 생략: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tainha\" title=\"눌러서 듣기\">tainha</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ruim\" title=\"눌러서 듣기\">ruim</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"juiz\" title=\"눌러서 듣기\">juiz</span>)</li><li>같은 철자를 구별하는 부호: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôr\" title=\"눌러서 듣기\">pôr</span>(동사) ↔ <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"por\" title=\"눌러서 듣기\">por</span>(전치사), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôde\" title=\"눌러서 듣기\">pôde</span>(과거) ↔ <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pode\" title=\"눌러서 듣기\">pode</span>(현재).</li></ul><h3>4. 모음 (The vowels)</h3><p>포르투갈어에는 <b>구강모음 7개, 비음 모음 5개</b>가 있습니다. 모음 e와 o는 '열린 소리'와 '닫힌 소리'를 구별해야 해요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>글자</th><th>소리</th><th>예</th></tr></thead><tbody><tr><td>a</td><td>강세 음절은 입을 크게 벌린 '아', 강세 뒤에서는 약한 '어'</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pá, cavalo, casa\" title=\"눌러서 듣기\">pá, cavalo, casa</span></td></tr><tr><td>e</td><td>닫힌 '에'(ê) / 열린 '에'(é) / 단어 끝 약한 '이'</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"medo, café, leite\" title=\"눌러서 듣기\">medo, café, leite</span></td></tr><tr><td>i</td><td>'이'. 모음 앞에서는 '이' 반모음 [y]</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vi, saia\" title=\"눌러서 듣기\">vi, saia</span></td></tr><tr><td>o</td><td>닫힌 '오'(ô) / 열린 '오'(ó) / 단어 끝 약한 '우'</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"avô, avó, pato\" title=\"눌러서 듣기\">avô, avó, pato</span></td></tr><tr><td>u</td><td>'우'. g·q 뒤에서는 'w'</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tu, guarda, quatro\" title=\"눌러서 듣기\">tu, guarda, quatro</span></td></tr></tbody></table></div><h3>비음 모음</h3><p>아래 경우에는 모음이 코로 울리는 <b>비음</b>이 됩니다. 이때 m, n은 자음으로 따로 소리 나지 않아요.</p><ul class=\"rules\"><li>위에 ~(til)가 있을 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"irmã\" title=\"눌러서 듣기\">irmã</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"lições\" title=\"눌러서 듣기\">lições</span></li><li>같은 음절에서 m·n이 모음 뒤에 올 때: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"campo\" title=\"눌러서 듣기\">campo</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"canto\" title=\"눌러서 듣기\">canto</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"entender\" title=\"눌러서 듣기\">entender</span></li><li>강세 모음 뒤에 m·n이 오고 다음 음절로 넘어가도: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mano\" title=\"눌러서 듣기\">mano</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tema\" title=\"눌러서 듣기\">tema</span></li><li>nh 앞에서는 항상: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tenho\" title=\"눌러서 듣기\">tenho</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"manhã\" title=\"눌러서 듣기\">manhã</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"senhor\" title=\"눌러서 듣기\">senhor</span></li></ul><h3>5. 이중모음 (The diphthongs)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분</th><th>이중모음</th><th>예</th></tr></thead><tbody><tr><td>구강</td><td>au, ai, eu, ei, éu, éi, iu, ou, oi, ói, ui</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pau, pai, eu, sei, céu, hotéis, viu, vou, boi, dói\" title=\"눌러서 듣기\">pau, pai, eu, sei, céu, hotéis, viu, vou, boi, dói</span></td></tr><tr><td>비음</td><td>ão, ãe, em/en, õe</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pão, mãe, têm, lições\" title=\"눌러서 듣기\">pão, mãe, têm, lições</span></td></tr></tbody></table></div><p>이중모음에서는 <b>강세가 있는 앞 모음</b>을 또렷하게 읽고, 뒤의 i/u는 짧게 붙입니다. 동사 어미의 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-am\" title=\"눌러서 듣기\">-am</span>은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falam\" title=\"눌러서 듣기\">falam</span>처럼 [ão]로 소리 나요.</p><h3>6. 자음 (The consonants)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>글자</th><th>소리</th><th>예</th></tr></thead><tbody><tr><td>c</td><td>e·i 앞 = s / 그 밖 = k</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cinco, casa\" title=\"눌러서 듣기\">cinco, casa</span></td></tr><tr><td>ç</td><td>항상 s (a, o, u 앞에서만 씀)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"açúcar, coração\" title=\"눌러서 듣기\">açúcar, coração</span></td></tr><tr><td>ch</td><td>'쉬'(sh)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"chá, chave\" title=\"눌러서 듣기\">chá, chave</span></td></tr><tr><td>g</td><td>e·i 앞 = 프랑스어 j(쥐) / 그 밖 = g</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"gente, grande\" title=\"눌러서 듣기\">gente, grande</span></td></tr><tr><td>gu</td><td>e·i 앞 = g, a·o 앞 = gw</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"guerra, guarda\" title=\"눌러서 듣기\">guerra, guarda</span></td></tr><tr><td>h</td><td>쓰지만 읽지 않음 (ch, lh, nh 제외)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"hoje, homem\" title=\"눌러서 듣기\">hoje, homem</span></td></tr><tr><td>j</td><td>항상 j(쥐)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"jeito, hoje\" title=\"눌러서 듣기\">jeito, hoje</span></td></tr><tr><td>lh</td><td>'ㄹ리' (이탈리아어 gli)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"filha, olho\" title=\"눌러서 듣기\">filha, olho</span></td></tr><tr><td>nh</td><td>'니' (스페인어 ñ)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"manhã, senhor\" title=\"눌러서 듣기\">manhã, senhor</span></td></tr><tr><td>qu</td><td>e·i 앞 = k / a·o 앞 = kw</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quero, quatro\" title=\"눌러서 듣기\">quero, quatro</span></td></tr><tr><td>r</td><td>어두·rr·n/l/s 뒤 = 목구멍 쪽 'ㅎ' 비슷한 소리 / 모음 사이 r = 혀를 한 번 튕김</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"rio, carro\" title=\"눌러서 듣기\">rio, carro</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"caro\" title=\"눌러서 듣기\">caro</span></td></tr><tr><td>s</td><td>어두·ss = s / 모음 사이 = z / 단어 끝 = s(리우는 sh 비슷)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sapo, passo\" title=\"눌러서 듣기\">sapo, passo</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"casa\" title=\"눌러서 듣기\">casa</span></td></tr><tr><td>x</td><td>'쉬' (sh) / ex+모음 = z / 일부 단어는 ks, s</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"xícara\" title=\"눌러서 듣기\">xícara</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"exame\" title=\"눌러서 듣기\">exame</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"táxi, próximo\" title=\"눌러서 듣기\">táxi, próximo</span></td></tr><tr><td>z</td><td>z (음절 끝에서는 s처럼)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"zero, luz\" title=\"눌러서 듣기\">zero, luz</span></td></tr></tbody></table></div><p><b>d, t</b>는 [이] 소리 앞에서(리우·상파울루 등 대부분 지역) 각각 <b>'지', '치'</b> 소리가 납니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dia\" title=\"눌러서 듣기\">dia</span>(지아), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tia\" title=\"눌러서 듣기\">tia</span>(치아), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"leite\" title=\"눌러서 듣기\">leite</span>(레이치), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cidade\" title=\"눌러서 듣기\">cidade</span>(시다지).</p><div class=\"note warn\"><b class=\"lab\">원포인트</b>단어 끝의 r은 대부분의 브라질 사람이 거의 발음하지 않습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falar\" title=\"눌러서 듣기\">falar</span>(팔라), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vir\" title=\"눌러서 듣기\">vir</span>.</div><h3>7. 교재의 표기 약속 (Conventional signs)</h3><ul class=\"rules\"><li>슬래시(/ /) 안의 기호는 강세 모음의 소리를 나타냅니다. 열린 소리는 /é/, /ó/, 닫힌 소리는 /ê/, /ô/.</li><li>모음 위의 물결(~)은 비음을 나타냅니다.</li><li>연습문제의 괄호 ( )는 설명, 대괄호 [ ]는 번역하지 않는 말입니다.</li></ul><h3>핵심 표현 16개</h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"irmã\" title=\"눌러서 듣기\">irmã</span></div></div><div c t-i\" role=\"button\" tabindex=\"0\" data-say=\"pão\" title=\"눌러서 듣기\">pão</span> = 빵<br>ão = 비음 이중모음 [아웅]"}]}, {"title": "⑤ 직접 쓰기", "short": "직접 쓰기", "instr": "한국어 뜻에 맞게 포르투갈어로 써 보세요. 악센트(á é ã ç 등)가 틀리면 0.5점입니다. 아래 입력 도우미 버튼을 쓸 수 있어요.", "rule": "", "items": [{"t": "text", "q": "<div class=\"kq\">빵 (비음 이중모음 ão가 들어간 단어)</div>", "a": ["pão"], "ah": "pão", "why": "철자 pão: p+ão. til(~)을 꼭 써야 합니다."}, {"t": "text", "q": "<div class=\"kq\">어머니 (ãe가 들어가는 단어)</div>", "a": ["mãe"], "ah": "mãe", "why": "mãe의 ãe는 비음 이중모음입니다."}, {"t": "text", "q": "<div class=\"kq\">차(茶)</div>", "a": ["chá"], "ah": "chá", "why": "ch + 열린 a 위에 acento agudo(´)"}, {"t": "text", "q": "<div class=\"kq\">하늘 (열린 e 이중모음 éu)</div>", "a": ["céu"], "ah": "céu", "why": "éu는 열린 e이므로 acento agudo를 씁니다."}, {"t": "text", "q": "<div class=\"kq\">아침 (nh가 들어가는 단어)</div>", "a": ["manhã"], "ah": "manhã", "why": "manhã = ma + nhã. 마지막 ã의 til을 잊지 마세요."}, {"t": "text", "q": "<div class=\"kq\">딸 (lh가 들어가는 단어)</div>", "a": ["filha"], "ah": "filha", "why": "filha [피랴]. 'lh'는 하나의 소리입니다."}, {"t": "text", "q": "<div class=\"kq\">할아버지 (닫힌 o, 끝에 circunflexo ^)</div>", "a": ["avô"], "ah": "avô", "why": "강세가 있는 끝 모음 o의 닫힌 소리는 circunflexo(^)로 씁니다. 할머니는 avó(열린 o)."}, {"t": "text", "q": "<div class=\"kq\">할머니 (열린 o, 끝에 acento agudo ´)</div>", "a": ["avó"], "ah": "avó", "why": "열린 o는 agudo(´)로 씁니다. 할아버지는 avô."}]}]};</script>
