과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 9, "slug": "Lesson9", "label": "Lesson IX", "pt": "Querer, o pretérito e a preposição por", "ko": "querer, 단순과거(완전과거), por, 3인칭 소유 표현", "en": "querer · the preterit · por and its contractions · 3rd-person possessives", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>단순과거(pretérito)</b> 는 '~했다'라는 과거 이야기의 기본 시제입니다. 이 과에서 처음 배우므로 매우 중요해요. 또 '~하고 싶다' <b>querer</b>, 전치사 <b>por</b>, 그리고 구어에서 '그의/그녀의'를 말하는 법을 배웁니다.</p><h3>47. 불규칙 동사 querer (원하다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>querer</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quero\" title=\"눌러서 듣기\">quero</span></td><td>나는 원한다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quer\" title=\"눌러서 듣기\">quer</span></td><td>그는 원한다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"queremos\" title=\"눌러서 듣기\">queremos</span></td><td>우리는 원한다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"querem\" title=\"눌러서 듣기\">querem</span></td><td>그들은 원한다</td></tr></tbody></table></div><p>querer 뒤에는 <b>전치사 없이 동사원형</b>이 옵니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quero ficar.\" title=\"눌러서 듣기\">Quero ficar.</span> (나는 머물고 싶다) 강세 모음 e는 열린 소리 /é/ 입니다.</p><h3>48. 단순과거 (The preterit) — 규칙 동사</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar (-ar)</th><th>comer (-er)</th><th>abrir (-ir)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falei\" title=\"눌러서 듣기\">falei</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comi\" title=\"눌러서 듣기\">comi</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abri\" title=\"눌러서 듣기\">abri</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falou\" title=\"눌러서 듣기\">falou</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeu\" title=\"눌러서 듣기\">comeu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abriu\" title=\"눌러서 듣기\">abriu</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falamos\" title=\"눌러서 듣기\">falamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comemos\" title=\"눌러서 듣기\">comemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrimos\" title=\"눌러서 듣기\">abrimos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falaram\" title=\"눌러서 듣기\">falaram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeram\" title=\"눌러서 듣기\">comeram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abriram\" title=\"눌러서 듣기\">abriram</span></td></tr></tbody></table></div><ul class=\"rules\"><li>3인칭 복수 어미는 브라질에서 자주 [-rom]처럼 소리 납니다.</li><li>-er 동사의 단순과거에서 강세가 있는 e는 닫힌 /ê/ 소리입니다.</li><li><b>nós 형은 현재형과 같습니다</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falamos\" title=\"눌러서 듣기\">falamos</span>(말한다/말했다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrimos\" title=\"눌러서 듣기\">abrimos</span>. 문맥으로 구별해요.</li></ul><h3>49. 단순과거의 쓰임 (Uses of the preterit)</h3><ul class=\"rules\"><li><b>끝난 하나의 동작이나, 시간이 한정된 과거 상태</b>를 나타냅니다. 이야기(서술)의 시제입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Hoje eu falei com ele.\" title=\"눌러서 듣기\">Hoje eu falei com ele.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu fiquei duas horas.\" title=\"눌러서 듣기\">Eu fiquei duas horas.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele trabalhou muito tempo.\" title=\"눌러서 듣기\">Ele trabalhou muito tempo.</span></li><li><b>현재완료</b>처럼 '(방금) ~했다'. 이때 부사 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"já\" title=\"눌러서 듣기\">já</span>(이미)가 자주 함께 옵니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Você já comeu?\" title=\"눌러서 듣기\">Você já comeu?</span></li><li>질문에 já가 있으면 긍정 대답은 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Já.\" title=\"눌러서 듣기\">Já.</span> 한 마디로 합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Você já comeu? — Já.\" title=\"눌러서 듣기\">Você já comeu? — Já.</span></li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Hoje ele trabalhou.\" title=\"눌러서 듣기\">Hoje ele trabalhou.</span><span class=\"k\">오늘 그는 일했다.</span></li></ul><h3>50. 전치사 por와 정관사의 축약</h3><p>por는 [뿌르]처럼 끝의 r을 항상 발음합니다(모음 사이의 r 소리). 정관사와 <b>반드시</b> 합칩니다. 다른 말과는 합치지 않아요.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>전치사 + 관사</th><th>결과</th></tr></thead><tbody><tr><td>por + o</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pelo\" title=\"눌러서 듣기\">pelo</span></td></tr><tr><td>por + a</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pela\" title=\"눌러서 듣기\">pela</span></td></tr><tr><td>por + os</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pelos\" title=\"눌러서 듣기\">pelos</span></td></tr><tr><td>por + as</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pelas\" title=\"눌러서 듣기\">pelas</span></td></tr></tbody></table></div><h3>51. por의 쓰임</h3><ul class=\"rules\"><li><b>행위자</b>('~에 의해'): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A porta é aberta pelo menino.\" title=\"눌러서 듣기\">A porta é aberta pelo menino.</span></li><li><b>~을 위해서(for the sake of)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O homem faz isso pelo filho.\" title=\"눌러서 듣기\">O homem faz isso pelo filho.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele faz isso só por fazer.\" title=\"눌러서 듣기\">Ele faz isso só por fazer.</span></li><li><b>~을 통해, ~을 따라(through)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu andei pela casa.\" title=\"눌러서 듣기\">Eu andei pela casa.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Passar pela rua.\" title=\"눌러서 듣기\">Passar pela rua.</span></li></ul><h3>52. 3인칭 소유 표현: dele, dela, deles, delas</h3><p>문어에서는 seu가 '그의, 그녀의, 그들의'도 뜻하지만, <b>구어에서 seu/sua는 '당신의'만</b> 뜻합니다. 그래서 다음처럼 말해요.</p><ul class=\"rules\"><li>소유자가 문장 주어이거나 분명할 때는 <b>정관사만</b> 씁니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele vendeu o carro.\" title=\"눌러서 듣기\">Ele vendeu o carro.</span> (그는 자기 차를 팔았다), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Elas estudaram as lições.\" title=\"눌러서 듣기\">Elas estudaram as lições.</span></li><li>헷갈릴 수 있을 때는 명사 뒤에 <b>de + 인칭대명사</b>를 붙입니다.</li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>뜻</th><th>형태</th></tr></thead><tbody><tr><td>그의</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dele\" title=\"눌러서 듣기\">dele</span></td></tr><tr><td>그녀의</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dela\" title=\"눌러서 듣기\">dela</span></td></tr><tr><td>그들의(남성)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"deles\" title=\"눌러서 듣기\">deles</span></td></tr><tr><td>그녀들의</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"delas\" title=\"눌러서 듣기\">delas</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu vou no carro dele.\" title=\"눌러서 듣기\">Eu vou no carro dele.</span><span class=\"k\">나는 그의 차를 타고 간다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"O irmão delas é alto.\" title=\"눌러서 듣기\">O irmão delas é alto.</span><span class=\"k\">그녀들의 오빠(형제)는 키가 크다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Sua casa e a dele.\" title=\"눌러서 듣기\">Sua casa e a dele.</span><span class=\"k\">당신의 집과 그의 집.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>같은 방식으로 '당신의'도 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"de você\" title=\"눌러서 듣기\">de você</span>로 말할 수 있지만(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Este paletó é de você.\" title=\"눌러서 듣기\">Este paletó é de você.</span>), <b>1인칭(meu, nosso)에는 쓰지 않습니다</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Este chapéu é meu.\" title=\"눌러서 듣기\">Este chapéu é meu.</span></div><h3>53. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a avenida\" title=\"눌러서 듣기\">a avenida</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a calçada\" title=\"눌러서 듣기\">a calçada</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a praça\" title=\"눌러서 듣기\">a praça</span></td><td>큰길 / 인도 / 광장</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o edifício\" title=\"눌러서 듣기\">o edifício</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o cinema\" title=\"눌러서 듣기\">o cinema</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o teatro\" title=\"눌러서 듣기\">o teatro</span></td><td>건물 / 영화관 / 극장<
