과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 26, "slug": "Lesson26", "label": "Lesson XXVI", "pt": "Haver, futuro e condicional", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치", "en": "haver · future · conditional · pronoun placement", "part": "Part 4 · 접속법과 복합 구문 (Lesson XXII–XXVIII)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>haver</b>의 여러 쓰임과, 포르투갈어에서 <b>미래와 조건을 말하는 방법</b>을 배웁니다. 일상 회화에서는 <b>ir + 부정사나 현재형, 불완료과거</b>를 많이 쓰고, 단순미래·조건법은 주로 짧은 동사에서 들립니다.</p><h3>126. 불규칙 동사 haver</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재</th><th>단순과거</th><th>현재접속법</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"hei\" title=\"눌러서 듣기\">hei</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houve\" title=\"눌러서 듣기\">houve</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"haja\" title=\"눌러서 듣기\">haja</span></td></tr><tr><td>너·그 / 그녀</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"há\" title=\"눌러서 듣기\">há</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houve\" title=\"눌러서 듣기\">houve</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"haja\" title=\"눌러서 듣기\">haja</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"havemos\" title=\"눌러서 듣기\">havemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houvemos\" title=\"눌러서 듣기\">houvemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"hajamos\" title=\"눌러서 듣기\">hajamos</span></td></tr><tr><td>그들</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"hão\" title=\"눌러서 듣기\">hão</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houveram\" title=\"눌러서 듣기\">houveram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"hajam\" title=\"눌러서 듣기\">hajam</span></td></tr></tbody></table></div><p>불완료과거는 규칙입니다. 미래접속법과 접속법 불완료과거는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houveram\" title=\"눌러서 듣기\">houveram</span>에서 만듭니다.</p><h3>127. haver의 쓰임</h3><ul class=\"rules\"><li>라틴어로는 '가지다'지만 BF에서는 <b>절대 '가지다'의 뜻으로 쓰지 않습니다</b>.</li><li>3인칭 단수형은 <b>'~이 있다/있었다'</b> 의 뜻입니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"há\" title=\"눌러서 듣기\">há</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"havia\" title=\"눌러서 듣기\">havia</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"houve\" title=\"눌러서 듣기\">houve</span>.</li><li>오늘날 단순과거는 <b>3인칭 단수(houve)</b> 만 씁니다.</li><li><b>há + 기간</b>은 <b>'~ 전에'</b> 의 뜻입니다.</li><li>현재형·불완료과거형은 <b>미래·조건의 조동사</b>로도 쓰입니다 (아래).</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Há dois anos\" title=\"눌러서 듣기\">Há dois anos</span><span class=\"k\">2년 전에</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Há muitos livros aqui.\" title=\"눌러서 듣기\">Há muitos livros aqui.</span><span class=\"k\">여기 책이 많이 있다.</span></li></ul><h3>128. 미래를 나타내는 네 가지 방법</h3><p>앞에서 배운 <b>ir + 부정사</b>, <b>단순 현재형</b>에 더해 두 가지가 더 있습니다. 네 가지 모두 구어와 문어에서 자연스럽게 쓰입니다.</p><p><b>① 단순미래</b>: <b>동사 원형 전체</b>에 <b>-ei, -á, -emos, -ão</b>를 붙입니다. 세 활용 모두 같은 어미입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar</th><th>comer</th><th>abrir</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu\" title=\"눌러서 듣기\">eu</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falarei\" title=\"눌러서 듣기\">falarei</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comerei\" title=\"눌러서 듣기\">comerei</span></td><td>abrirei</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"você·ele\" title=\"눌러서 듣기\">você·ele</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falará\" title=\"눌러서 듣기\">falará</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comerá\" title=\"눌러서 듣기\">comerá</span></td><td>abrirá</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falaremos\" title=\"눌러서 듣기\">falaremos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeremos\" title=\"눌러서 듣기\">comeremos</span></td><td>abriremos</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"그들\" title=\"눌러서 듣기\">그들</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falarão\" title=\"눌러서 듣기\">falarão</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comerão\" title=\"눌러서 듣기\">comerão</span></td><td>abrirão</td></tr></tbody></table></div><p>원형이 줄어드는 동사가 셋 있습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fazer → farei\" title=\"눌러서 듣기\">fazer → farei</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trazer → trarei\" title=\"눌러서 듣기\">trazer → trarei</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dizer → direi\" title=\"눌러서 듣기\">dizer → direi</span>.</p><p><b>② haver de + 원형</b>: <b>현재형 haver + de + 원형</b>으로 '~할 것이다, ~하기로 되어 있다'를 말합니다. 단순미래와 거의 같은 뜻으로도 많이 씁니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>haver de + falar</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu\" title=\"눌러서 듣기\">eu</span></td><td>hei de falar</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"você·ele\" title=\"눌러서 듣기\">você·ele</span></td><td>há de falar</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span></td><td>havemos de falar</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"그들\" title=\"눌러서 듣기\">그들</span></td><td>hão de falar</td></tr></tbody></table></div><p>BF에서 <b>단순미래는 가장 덜 쓰입니다</b>. 어미 앞이 한 음절인 짧은 동사(serei, estarei, terei, irei, farei)는 꽤 자주 들리지만, 긴 동사는 다른 형태를 훨씬 많이 씁니다.</p><h3>129. 조건법 (네 가지 방법)</h3><p>조건법은 영어처럼 두 가지 뜻이 있습니다. ① 과거 시점에서 본 <b>미래</b>('그는 오겠다고 말했다'), ② 조건문에서의 <b>가정</b>('내가 너라면 그렇게 안 할 텐데').</p><ul class=\"rules\"><li><b>a. 불완료과거</b>: 가장 흔하고, 모든 경우에 쓸 수 있습니다.</li><li><b>b. ir의 불완료과거 + 원형</b>: 과거 시점에서 본 미래일 때만 쓸 수 있습니다.</li><li><b>c. 단순조건법</b>: 원형 + <b>-ia, -ia, -íamos, -iam</b>. 거의 쓰이지 않고 짧은 동사에서만 쓰입니다.</li><li><b>d. haver의 불완료과거 + de + 원형</b>: 기대나 사전 약속의 뉘앙스가 들어가기도 합니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele disse que vinha.\" title=\"눌러서 듣기\">Ele disse que vinha.</span><span class=\"k\">그는 오겠다고 말했다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se eu fosse você, não fazia isso.\" title=\"눌러서 듣기\">Se eu fosse você, não fazia isso.</span><span class=\"k\">내가 너라면 그러지 않을 텐데.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele diz que vai voltar.\" title=\"눌러서 듣기\">Ele diz que vai voltar.</span><span class=\"k\">그는 돌아올 거라고 말한다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele disse que ia voltar.\" title=\"눌러서 듣기\">Ele disse que ia voltar.</span><span class=\"k\">그는 돌아올 거라고 말했다.</span></li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar</th><th>comer</th><th>abrir</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu·você·ele\" title=\"눌러서 듣기\">eu·você·ele</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falaria\" title=\"눌러서 듣기\">falaria</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeria\" title=\"눌러서 듣기\">comeria</span></td><td>abriria</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falaríamos\" title=\"눌러서 듣기\">falaríamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeríamos\" title=\"눌러서 듣기\">comeríamos</span></td><td>abriríamos</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"그들\" title=\"눌러서 듣기\">그들</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falariam\" title=\"눌러서 듣기\">falariam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comeriam\" title=\"눌러서 듣기\">comeriam</span></td><td>abririam</td></tr></tbody></table></div><p><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"havia de falar\" title=\"눌러서 듣기\">havia de falar</span> = '~하겠다'. 원형이 한 음절 앞에서 끝나는 동사만 조건법을 비교적 쓰고, 그 경우도 불완료과거가 비슷한 빈도로 쓰입니다.</p><h3>130. 미래·조건법과 목적격 대명사의 위치</h3><p>예전에는 대명사를 원형과 어미 사이에 넣었습니다(falar-me-á, di-lo-ei). 지금은 문어에서도 드물고 <b>BF 구어에서는 아예 쓰지 않습니다</b>.</p><ul class=\"rules\"><li><b>me, nos, lhe, lhes, se</b>는 미래·조건법 <b>앞</b>에 둡니다.</li><li>문장이 대명사로 시작하는 것을 피하려면 <b>주어 대명사</b>를 앞에 둡니다.</li><li><b>haver de</b>·<b>ir + 원형</b>처럼 원형이 독립된 단어일 때는 원형 뒤에 붙여도 되지만, 보통 <b>ir와 원형 사이</b>에 둡니다.</li><li><b>você, o senhor, ele</b> 등 나머지는 모든 동사 형태 <b>뒤</b>에 명사처럼 둡니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele me falará.\" title=\"눌러서 듣기\">Ele me falará.</span><span class=\"k\">그는 나에게 말할 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eles se veriam.\" title=\"눌러서 듣기\">Eles se veriam.</span><span class=\"k\">그들은 서로 만날 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eles vão me dizer.\" title=\"눌러서 듣기\">Eles vão me dizer.</span><span class=\"k\">그들은 나에게 말할 것이다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu disse que levaria você.\" title=\"눌러서 듣기\">Eu disse que levaria você.</span><span class=\"k\">나는 너를 데려가겠다고 말했다.</span></li></ul><h3>이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a rede\" title=\"눌러서 듣기\">a rede</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o quarto\" title=\"눌러서 듣기\">o quarto</span></td><td>그물·해먹 / 방</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a cor\" title=\"눌러서 듣기\">a cor</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o sotaque\" title=\"눌러서 듣기\">o sotaque</span></td><td>색 / (외국어) 억양</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o garoto\" title=\"눌러서 듣기\">o garoto</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o jogo\" title=\"눌러서 듣기\">o jogo</span></td><td>소년 / 경기</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o lixo\" title=\"눌러서 듣기\">o lixo</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o escândalo\" title=\"눌러서 듣기\">o escândalo</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o bicho\" title=\"눌러서 듣기\">o bicho</span></td><td>쓰레기 / 소란 / 동물</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o ar\" title=\"눌러서 듣기\">o ar</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" "slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pobre\" title=\"눌러서 듣기\">pobre</span></td><td>강한 / 깨끗한 / 더러운 / 즐거운 / 가난한</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"apesar de\" title=\"눌러서 듣기\">apesar de</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"aliás\" title=\"눌러서 듣기\">aliás</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"primeiro\" title=\"눌러서 듣기\">primeiro</span></td><td>~에도 불구하고 / 사실은 / 먼저</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Armar uma rede.\" title=\"눌러서 듣기\">Armar uma rede.</span></td><td>해먹을 걸다.</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Armar um escândalo.\" title=\"눌러서 듣기\">Armar um escândalo.</span></td><td>소란을 피우다.</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Custa-me crer.\" title=\"눌러서 듣기\">Custa-me crer.</span></td><td>믿기 어렵다.</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Tocar piano.\" title=\"눌러서 듣기\">Tocar piano.</span></td><td>피아노를 치다.</td></tr></tbody></table></div><h3>핵심 표현 17개</h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Há dois anos\" title=\"눌러서 듣기\">Há dois anos</span></div></div><div class=\"kor\">2년 전에</div><div class=\"ptip\">💡 há + 기간 = ~ 전에</div></div></li><li class=\"ph\"><span class=\"pn\">2</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Há muitos livros aqui.\" title=\"눌러서 듣기\">Há muitos livros aqui.</span></div></div><div class=\"kor\">여기 책이 많이 있다.</div><div class=\"ptip\">💡 há = 있다</div></div></li><li class=\"ph\"><span class=\"pn\">3</span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"pt
