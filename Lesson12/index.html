과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 12, "slug": "Lesson12", "label": "Lesson XII", "pt": "Pôr, subjuntivo futuro e pronomes se/lhe/lhes", "ko": "pôr 동사, 미래접속법, 대명사 se·lhe·lhes", "en": "pôr · the future subjunctive · se, lhe, lhes", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>미래접속법</b>은 이름이 어렵지만 일상에서 아주 중요하고, 아이들도 일찍 배우는 쉬운 시제입니다. <b>'만약 ~하면(se)', '~할 때(quando)'</b> 처럼 <b>미래에 일어날 일</b>을 조건·시간으로 말할 때 씁니다.</p><h3>62. 불규칙 동사 pôr (놓다, 두다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재</th><th>단순과거</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ponho\" title=\"눌러서 듣기\">ponho</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pus\" title=\"눌러서 듣기\">pus</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"põe\" title=\"눌러서 듣기\">põe</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôs\" title=\"눌러서 듣기\">pôs</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pomos\" title=\"눌러서 듣기\">pomos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pusemos\" title=\"눌러서 듣기\">pusemos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"põem\" title=\"눌러서 듣기\">põem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"puseram\" title=\"눌러서 듣기\">puseram</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>복수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"põem\" title=\"눌러서 듣기\">põem</span>은 보통 단수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"põe\" title=\"눌러서 듣기\">põe</span>와 같게 발음합니다. 단수와 복수 모두 명령형으로 쓰입니다.</div><h3>63. pôr의 쓰임</h3><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele pôs a roupa.\" title=\"눌러서 듣기\">Ele pôs a roupa.</span><span class=\"k\">그는 옷을 입었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele pôs a mão no bolso.\" title=\"눌러서 듣기\">Ele pôs a mão no bolso.</span><span class=\"k\">그는 주머니에 손을 넣었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu ponho água para você.\" title=\"눌러서 듣기\">Eu ponho água para você.</span><span class=\"k\">내가 물을 따라 줄게요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"A galinha pôs um ovo.\" title=\"눌러서 듣기\">A galinha pôs um ovo.</span><span class=\"k\">암탉이 알을 낳았다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ela pôs a mesa.\" title=\"눌러서 듣기\">Ela pôs a mesa.</span><span class=\"k\">그녀는 상을 차렸다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Põe a mala aí.\" title=\"눌러서 듣기\">Põe a mala aí.</span><span class=\"k\">가방을 거기에 놓아.</span></li></ul><h3>64. pôr에서 파생된 동사</h3><p>파생 동사는 pôr와 같이 변하며, 원형에는 악센트가 필요 없습니다(영어 -pose와 대응).</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>동사</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"propor\" title=\"눌러서 듣기\">propor</span></td><td>제안하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"repor\" title=\"눌러서 듣기\">repor</span></td><td>다시 놓다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"compor\" title=\"눌러서 듣기\">compor</span></td><td>구성하다, 작곡하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"depor\" title=\"눌러서 듣기\">depor</span></td><td>내려놓다, 증언하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"expor\" title=\"눌러서 듣기\">expor</span></td><td>드러내다, 표현하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"impor\" title=\"눌러서 듣기\">impor</span></td><td>강요하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"opor (a)\" title=\"눌러서 듣기\">opor (a)</span></td><td>대조하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"opor-se a\" title=\"눌러서 듣기\">opor-se a</span></td><td>반대하다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"dispor de\" title=\"눌러서 듣기\">dispor de</span></td><td>마음대로 쓸 수 있다</td></tr></tbody></table></div><h3>65. 미래접속법 (The future subjunctive)</h3><p><b>3인칭 복수 단순과거</b>에서 <b>-ram을 떼고</b> 다음 어미를 붙입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>어미</th><th>fazer (fizeram → fizer-)</th></tr></thead><tbody><tr><td>eu</td><td>-r</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizer\" title=\"눌러서 듣기\">fizer</span></td></tr><tr><td>você / ele / ela</td><td>-r</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizer\" title=\"눌러서 듣기\">fizer</span></td></tr><tr><td>nós</td><td>-rmos</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizermos\" title=\"눌러서 듣기\">fizermos</span></td></tr><tr><td>vocês / eles / elas</td><td>-rem</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizerem\" title=\"눌러서 듣기\">fizerem</span></td></tr></tbody></table></div><p><b>규칙 동사</b>는 단수형이 <b>원형과 똑같습니다</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falar\" title=\"눌러서 듣기\">falar</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comer\" title=\"눌러서 듣기\">comer</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abrir\" title=\"눌러서 듣기\">abrir</span>. (nós: falarmos, eles: falarem)</p><p>아래 불규칙 동사는 외워 두면 좋습니다. (단수형)</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>원형</th><th>미래접속법</th><th>원형</th><th>미래접속법</th></tr></thead><tbody><tr><td>estar</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estiver\" title=\"눌러서 듣기\">estiver</span></td><td>querer</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quiser\" title=\"눌러서 듣기\">quiser</span></td></tr><tr><td>ser / ir</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"for\" title=\"눌러서 듣기\">for</span></td><td>dar</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"der\" title=\"눌러서 듣기\">der</span></td></tr><tr><td>ter</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tiver\" title=\"눌러서 듣기\">tiver</span></td><td>poder</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"puder\" title=\"눌러서 듣기\">puder</span></td></tr><tr><td>fazer</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fizer\" title=\"눌러서 듣기\">fizer</span></td><td>pôr</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"puser\" title=\"눌러서 듣기\">puser</span></td></tr><tr><td>dizer</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"disser\" title=\"눌러서 듣기\">disser</span></td><td>—</td><td>—</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><b>ser와 ir는 미래접속법도 같은 형태(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"for\" title=\"눌러서 듣기\">for</span>)</b> 입니다. 강세 모음은 3인칭 복수 단순과거와 같아요.</div><h3>66. 미래접속법의 쓰임</h3><p>미래에 일어날 일을 가리키는 종속절에서 아래 접속사 뒤에 씁니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>접속사</th><th>뜻</th><th>비고</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"se\" title=\"눌러서 듣기\">se</span></td><td>만약 ~하면</td><td>반드시 미래접속법</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quando\" title=\"눌러서 듣기\">quando</span></td><td>~할 때</td><td>미래의 일일 때</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"enquanto\" title=\"눌러서 듣기\">enquanto</span></td><td>~하는 동안</td><td>미래의 일일 때</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"logo que\" title=\"눌러서 듣기\">logo que</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"assim que\" title=\"눌러서 듣기\">assim que</span></td><td>~하자마자</td><td>보통 미래접속법</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"depois que\" title=\"눌러서 듣기\">depois que</span></td><td>~한 후에</td><td>보통 미래접속법</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"caso\" title=\"눌러서 듣기\">caso</span></td><td>~할 경우에</td><td>보통 미래접속법</td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se você quiser, eu vou.\" title=\"눌러서 듣기\">Se você quiser, eu vou.</span><span class=\"k\">원하시면 제가 갈게요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quando eu tiver tempo, falo com ele.\" title=\"눌러서 듣기\">Quando eu tiver tempo, falo com ele.</span><span class=\"k\">시간이 생기면 그와 이야기할게요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Se ele for, eu vou também.\" title=\"눌러서 듣기\">Se ele for, eu vou também.</span><span class=\"k\">그가 가면 나도 갈게요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Assim que ele partir, eu vou.\" title=\"눌러서 듣기\">Assim que ele partir, eu vou.</span><span class=\"k\">그가 떠나자마자 나도 갈게요.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>일반적인 사실이나 과거에는 접속법이 아니라 직설법을 씁니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quando estou com fome, como.\" title=\"눌러서 듣기\">Quando estou com fome, como.</span> (배고플 때 먹는다 - 습관)</div><h3>67. 목적어 대명사 se, lhe, lhes</h3><ul class=\"rules\"><li><b>se</b>: 3인칭·você 주어의 <b>재귀대명사</b>(자신을·자신에게). 단·복수 모두 같고, 직접·간접목적어 모두 가능합니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Como se chama você?\" title=\"눌러서 듣기\">Como se chama você?</span> (당신은 자신을 뭐라고 부르나요? = 이름이 뭐예요)</li><li><b>lhe</b>: 단수 2·3인칭의 <b>간접목적어</b>(그/그녀/당신에게). <b>lhes</b>는 복수입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu lhe escrevi uma carta.\" title=\"눌러서 듣기\">Eu lhe escrevi uma carta.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Nós lhes demos café.\" title=\"눌러서 듣기\">Nós lhes demos café.</span></li><li>위치는 me, nos와 같은 원칙을 따릅니다.</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele se acha no jardim.\" title=\"눌러서 듣기\">Ele se acha no jardim.</span><span class=\"k\">그는 정원에 있다. (자신을 정원에서 발견한다)</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eles se deixaram levar.\" title=\"눌러서 듣기\">Eles se deixaram levar.</span><span class=\"k\">그들은 이끌려 갔다.</span></li></ul><h3>68. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o casaco\" title=\"눌러서 듣기\">o casaco</span></td><td>코트</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Deus\" title=\"눌러서 듣기\">Deus</span></td><td>하느님</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cansar\" title=\"눌러서 듣기\">cansar</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cansar-se\" title=\"눌러서 듣기\">cansar-se</span></td><td>피곤하게 하다 / 피곤해지다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"perguntar\" title=\"눌러서 듣기\">perguntar</span></td><td>묻다</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"parecer\" title=\"눌러서 듣기\">parecer</span> <span class=\"slash\">/</span> <span class=\"pt\" role
