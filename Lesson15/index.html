xs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu sei minha lição.\" title=\"눌러서 듣기\">Eu sei minha lição.</span><span class=\"k\">나는 내 과제를 안다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele sabe acender o fogo.\" title=\"눌러서 듣기\">Ele sabe acender o fogo.</span><span class=\"k\">그는 불 피울 줄 안다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu sei quem é, mas não conheço.\" title=\"눌러서 듣기\">Eu sei quem é, mas não conheço.</span><span class=\"k\">누군지는 알지만 아는 사이는 아니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Quantos cabem no seu carro?\" title=\"눌러서 듣기\">Quantos cabem no seu carro?</span><span class=\"k\">당신 차에 몇 명이 탈 수 있어요?</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Meu pé não cabe neste sapato.\" title=\"눌러서 듣기\">Meu pé não cabe neste sapato.</span><span class=\"k\">내 발이 이 신발에 안 들어간다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Não cabe dúvida.\" title=\"눌러서 듣기\">Não cabe dúvida.</span><span class=\"k\">의심할 여지가 없다.</span></li></ul><h3>82. 불완료과거 (The imperfect indicative)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>falar (-ar)</th><th>comer (-er)</th><th>abrir (-ir)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falava\" title=\"눌러서 듣기\">falava</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comia\" title=\"눌러서 듣기\">comia</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abria\" title=\"눌러서 듣기\">abria</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falava\" title=\"눌러서 듣기\">falava</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comia\" title=\"눌러서 듣기\">comia</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abria\" title=\"눌러서 듣기\">abria</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falávamos\" title=\"눌러서 듣기\">falávamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comíamos\" title=\"눌러서 듣기\">comíamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abríamos\" title=\"눌러서 듣기\">abríamos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falavam\" title=\"눌러서 듣기\">falavam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comiam\" title=\"눌러서 듣기\">comiam</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"abriam\" title=\"눌러서 듣기\">abriam</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><b>eu, você, ele의 형태가 같습니다.</b> nós형은 강세 때문에 악센트(á, í)를 씁니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falávamos\" title=\"눌러서 듣기\">falávamos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"comíamos\" title=\"눌러서 듣기\">comíamos</span>.</div><h3>83. 불규칙 불완료과거 (4개 동사)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>ter</th><th>pôr</th><th>ser</th><th>vir</th></tr></thead><tbody><tr><td>eu / você / ele</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tinha\" title=\"눌러서 듣기\">tinha</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"punha\" title=\"눌러서 듣기\">punha</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"era\" title=\"눌러서 듣기\">era</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vinha\" title=\"눌러서 듣기\">vinha</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tínhamos\" title=\"눌러서 듣기\">tínhamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"púnhamos\" title=\"눌러서 듣기\">púnhamos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"éramos\" title=\"눌러서 듣기\">éramos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vínhamos\" title=\"눌러서 듣기\">vínhamos</span></td></tr><tr><td>vocês / eles</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tinham\" title=\"눌러서 듣기\">tinham</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"punham\" title=\"눌러서 듣기\">punham</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eram\" title=\"눌러서 듣기\">eram</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vinham\" title=\"눌러서 듣기\">vinham</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>이 네 동사 외에는 모두 규칙입니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ir\" title=\"눌러서 듣기\">ir</span>는 규칙적으로 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ia\" title=\"눌러서 듣기\">ia</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"íamos\" title=\"눌러서 듣기\">íamos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"iam\" title=\"눌러서 듣기\">iam</span>이 됩니다. pôr·vir에서 파생된 동사도 같이 변해요.</div><h3>84. 불완료과거의 쓰임 (Uses of the imperfect)</h3><ul class=\"rules\"><li><b>a. 과거의 상태·배경 묘사</b>: 시작과 끝이 중요하지 않은 상태. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O tempo estava bonito.\" title=\"눌러서 듣기\">O tempo estava bonito.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Fazia frio.\" title=\"눌러서 듣기\">Fazia frio.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele queria comer batatas.\" title=\"눌러서 듣기\">Ele queria comer batatas.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Os meninos sabiam os números.\" title=\"눌러서 듣기\">Os meninos sabiam os números.</span></li><li><b>b. 과거의 습관</b>: 기간이 한정되지 않은 반복. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Quando eu era menino, corria muito.\" title=\"눌러서 듣기\">Quando eu era menino, corria muito.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele sempre me chamava.\" title=\"눌러서 듣기\">Ele sempre me chamava.</span></li><li><b>c. 다른 과거 사건 당시 진행 중이던 일</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu comia quando ele telefonou.\" title=\"눌러서 듣기\">Eu comia quando ele telefonou.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Escutávamos enquanto ele falava.\" title=\"눌러서 듣기\">Escutávamos enquanto ele falava.</span></li><li><b>d. 영어 would(조건 어감)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu queria ir.\" title=\"눌러서 듣기\">Eu queria ir.</span>(가고 싶었는데요/가고 싶어요), <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele disse que ia.\" title=\"눌러서 듣기\">Ele disse que ia.</span>(간다고 했다)</li></ul><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>단순과거</th><th>불완료과거</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele quis comer batatas. (먹으려고 시도했다)\" title=\"눌러서 듣기\">Ele quis comer batatas. (먹으려고 시도했다)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele queria comer batatas. (먹고 싶어 했다)\" title=\"눌러서 듣기\">Ele queria comer batatas. (먹고 싶어 했다)</span></td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu comi quando ele telefonou. (전화 오자 먹었다)\" title=\"눌러서 듣기\">Eu comi quando ele telefonou. (전화 오자 먹었다)</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu comia quando ele telefonou. (먹던 중에 전화가 왔다)\" title=\"눌러서 듣기\">Eu comia quando ele telefonou. (먹던 중에 전화가 왔다)</span></td></tr></tbody></table></div><h3>85. 불완료과거의 진행형</h3><p>불완료과거에서는 진행형을 쓸 수 있지만, <b>단순형으로 바꿔도 뜻이 달라지지 않습니다.</b> (이 시제에서만) 진행형은 의미를 더 정확하게 합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu estava falando quando ele chegou. // Eu falava quando ele chegou.\" title=\"눌러서 듣기\">Eu estava falando quando ele chegou. // Eu falava quando
