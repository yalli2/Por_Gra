과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 21, "slug": "Lesson21", "label": "Lesson XXI", "pt": "Verbos reflexivos, \"a gente\" e números maiores", "ko": "재귀동사, 비인칭 주어 a gente, 100 이상의 수와 서수", "en": "reflexive verbs · impersonal \"one\" · numbers above 100 · ordinals", "part": "Part 3 · 시제 넓히기 (Lesson XV–XXI)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>재귀동사</b>(me chamo, se levanta)와 '사람들은 ~한다'를 뜻하는 <b>a gente</b>를 배웁니다. 또 100 이상의 큰 수와 서수(첫째, 둘째 …)도 정리합니다.</p><h3>104. 재귀동사 (Reflexive verbs)</h3><p><b>목적어가 주어와 같은</b> 동사입니다. 재귀 목적어 대명사를 써서 만듭니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>재귀대명사</th><th>예 (levantar-se 일어나다)</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"me\" title=\"눌러서 듣기\">me</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu me levanto\" title=\"눌러서 듣기\">eu me levanto</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"se\" title=\"눌러서 듣기\">se</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ele se levanta\" title=\"눌러서 듣기\">ele se levanta</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nos\" title=\"눌러서 듣기\">nos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós nos levantamos\" title=\"눌러서 듣기\">nós nos levantamos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"se\" title=\"눌러서 듣기\">se</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eles se levantam\" title=\"눌러서 듣기\">eles se levantam</span></td></tr></tbody></table></div><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Chamo-me José. // Eu me chamo José.\" title=\"눌러서 듣기\">Chamo-me José. // Eu me chamo José.</span><span class=\"k\">제 이름은 조제입니다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Chama-se Maria. // Ela se chama Maria.\" title=\"눌러서 듣기\">Chama-se Maria. // Ela se chama Maria.</span><span class=\"k\">그녀의 이름은 마리아입니다.</span></li></ul><h3>105. 재귀 구문의 쓰임</h3><ul class=\"rules\"><li><b>a. 말 그대로 자기 자신에게 하는 동작</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele se viu no espelho.\" title=\"눌러서 듣기\">Ele se viu no espelho.</span></li><li><b>b. 수동태 대용</b> (주어가 사물): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Falam-se várias línguas na Suíça.\" title=\"눌러서 듣기\">Falam-se várias línguas na Suíça.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Fez-se o trabalho num minuto.\" title=\"눌러서 듣기\">Fez-se o trabalho num minuto.</span> (단, 구어에서는 진짜 수동태를 더 많이 씁니다.)</li><li><b>c. 비인칭 'one'</b> (3인칭 단수 + se): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Como é que se pode não gostar de café?\" title=\"눌러서 듣기\">Como é que se pode não gostar de café?</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Vai-se à cidade de ônibus.\" title=\"눌러서 듣기\">Vai-se à cidade de ônibus.</span></li><li><b>d. 서로 ~하다(상호)</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eles se escrevem de vez em quando.\" title=\"눌러서 듣기\">Eles se escrevem de vez em quando.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Nós nos vemos com frequência.\" title=\"눌러서 듣기\">Nós nos vemos com frequência.</span></li></ul><p>상호 의미를 분명히 하려면 <b>um ao outro</b>를 씁니다(이때 재귀대명사는 생략). 모두 여성이면 uma à outra, 셋 이상이면 복수(uns aos outros / umas às outras)가 됩니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"João e Maria escrevem cartas um ao outro.\" title=\"눌러서 듣기\">João e Maria escrevem cartas um ao outro.</span><span class=\"k\">조앙과 마리아는 서로에게 편지를 쓴다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"As três mulheres veem umas às outras.\" title=\"눌러서 듣기\">As três mulheres veem umas às outras.</span><span class=\"k\">세 여자는 서로를 본다.</span></li></ul><h3>106. 재귀대명사 생략</h3><p>영어처럼 구어에서는 타동사/자동사 구별에 신경 쓰지 않아서, <b>재귀대명사를 자주 생략</b>합니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele (se) deita.\" title=\"눌러서 듣기\">Ele (se) deita.</span><span class=\"k\">그는 눕는다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu (me) levanto.\" title=\"눌러서 듣기\">Eu (me) levanto.</span><span class=\"k\">나는 일어난다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Nós nos levantamos. // Levantamos.\" title=\"눌러서 듣기\">Nós nos levantamos. // Levantamos.</span><span class=\"k\">우리는 일어난다.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>구어에서 <b>nos를 동사 뒤에 붙이지 않습니다.</b> 생략하거나 동사 앞에 놓아요. 또 같은 뜻이 '목적어 있는 동사'와 '재귀 + 전치사' 두 가지로 모두 가능한 동사도 있습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu lembro isso.\" title=\"눌러서 듣기\">Eu lembro isso.</span> = <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu me lembro disso.\" title=\"눌러서 듣기\">Eu me lembro disso.</span></div><h3>107. 비인칭 주어 '사람들은, 우리는 (one)'</h3><ul class=\"rules\"><li><b>a gente</b> (가장 흔함): <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"A gente estuda muito e aprende pouco.\" title=\"눌러서 듣기\">A gente estuda muito e aprende pouco.</span></li><li><b>3인칭 단수 + se</b>: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Estuda-se muito e aprende-se pouco.\" title=\"눌러서 듣기\">Estuda-se muito e aprende-se pouco.</span></li><li><b>3인칭 복수 (주어 없음)</b>: 누군지 모르는 사람들. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Dizem que não vai haver Carnaval.\" title=\"눌러서 듣기\">Dizem que não vai haver Carnaval.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>주어로서의 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"um\" title=\"눌러서 듣기\">um</span>은 항상 '하나'라는 수사이지 막연한 '누군가'가 아닙니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Um vai e outro vem.\" title=\"눌러서 듣기\">Um vai e outro vem.</span></div><h3>108. 100 이상의 기수</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>수</th><th>포르투갈어</th><th>수</th><th>포르투갈어</th></tr></thead><tbody><tr><td>200</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"duzentos\" title=\"눌러서 듣기\">duzentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"duzentas\" title=\"눌러서 듣기\">duzentas</span></td><td>600</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seiscentos\" title=\"눌러서 듣기\">seiscentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"seiscentas\" title=\"눌러서 듣기\">seiscentas</span></td></tr><tr><td>300</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trezentos\" title=\"눌러서 듣기\">trezentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trezentas\" title=\"눌러서 듣기\">trezentas</span></td><td>700</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"setecentos\" title=\"눌러서 듣기\">setecentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"setecentas\" title=\"눌러서 듣기\">setecentas</span></td></tr><tr><td>400</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quatrocentos\" title=\"눌러서 듣기\">quatrocentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quatrocentas\" title=\"눌러서 듣기\">quatrocentas</span></td><td>800</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"oitocentos\" title=\"눌러서 듣기\">oitocentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"oitocentas\" title=\"눌러서 듣기\">oitocentas</span></td></tr><tr><td>500</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quinhentos\" title=\"눌러서 듣기\">quinhentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"quinhentas\" title=\"눌러서 듣기\">quinhentas</span></td><td>900</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"novecentos\" title=\"눌러서 듣기\">novecentos</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"novecentas\" title=\"눌러서 듣기\">novecentas</span></td></tr><tr><td>1.000</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mil\" title=\"눌러서 듣기\">mil</span></td><td>1.000.000</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"um milhão\" title=\"눌러서 듣기\">um milhão</span></td></tr></tbody></table></div><ul class=\"rules\"><li>200~900은 <b>여성 명사 앞에서 여성형</b>이 됩니다. 1과 2도 일치합니다. 단, <b>milhão</b> 앞에서는 일치하지 않습니다(milhão은 남성 명사).</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"duas mil e duzentas casas\" title=\"눌러서 듣기\">duas mil e duzentas casas</span><span class=\"k\">2,200채의 집</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"milhares de pessoas // milhões de pessoas\" title=\"눌러서 듣기\">milhares de pessoas // milhões de pessoas</span><span class=\"k\">수천 명의 사람들 // 수백만 명의 사람들</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"dois milhões de pessoas\" title=\"눌러서 듣기\">dois milhões de pessoas</span><span class=\"k\">200만 명의 사람들</span></li></ul><ul class=\"rules\"><li><b>e를 넣는 경우</b>: 십·일의 자리 앞, cem/cento 앞(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"oitenta e seis\" title=\"눌러서 듣기\">oitenta e seis</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"cento e dez\" title=\"눌러서 듣기\">cento e dez</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"trezentos e quarenta e três\" title=\"눌러서 듣기\">trezentos e quarenta e três</span>), 또 mil/milhão 뒤에 100의 배수가 올 때(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"mil e quinhentos\" title=\"눌러서 듣기\">mil e quinhentos</span>).</li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>숫자 표기에서 <b>쉼표와 마침표 용법이 영어와 반대</b>입니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"14.392,28\" title=\"눌러서 듣기\">14.392,28</span> (14,392.28). 쉼표는 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vírgula\" title=\"눌러서 듣기\">vírgula</span>라고 읽습니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"3,5\" title=\"눌러서 듣기\">3,5</span> = <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"três vírgula cinco\" title=\"눌러서 듣기\">três vírgula cinco</span>.</div><h3>109. 서수 (Ordinal numbers)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>서수</th><th>뜻</th><th>서수</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"primeiro\" title=\"눌러서 듣기\">primeiro</span></td><td>첫째</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sexto\" title=\"눌러서 듣기\">sexto</span></td><td>여섯째</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"segundo\" title=\"눌러서 듣기\">segundo</span></td><td>둘째</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"sétimo\" title=\"눌러서 듣기\">sétimo</span></td><td>일곱째</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"terceiro\" title=\"눌러서 듣기\">terceiro</span></td><td>셋째</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"oitavo\" title=\"눌러서 듣기\">oitavo</span></td><td>여덟째</td></tr><tr>
