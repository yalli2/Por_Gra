과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 2, "slug": "Lesson2", "label": "Lesson II", "pt": "Verbos em -ar e o verbo estar", "ko": "-ar 동사 현재형, 인칭대명사, estar", "en": "Regular -ar verbs · subject pronouns · estar · plurals in -r, -z, -s", "part": "Part 1 · 기초 문장 (Lesson I–VI)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p>동사 원형이 <b>-ar</b>로 끝나는 제1활용 동사의 현재 변화를 배웁니다. 말할 때는 어미 네 가지(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-o\" title=\"눌러서 듣기\">-o</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-a\" title=\"눌러서 듣기\">-a</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-amos\" title=\"눌러서 듣기\">-amos</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"-am\" title=\"눌러서 듣기\">-am</span>)만으로 충분해요.</p><h3>8. 제1활용 규칙동사 (-ar verbs)</h3><p>원형에서 -ar를 떼고 어간에 인칭어미를 붙입니다. 교재는 실제 대화에 쓰이는 4가지 형태만 먼저 보여줍니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>사람</th><th>falar (말하다)</th><th>어미</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falo\" title=\"눌러서 듣기\">falo</span></td><td>-o</td></tr><tr><td>você, ele, ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"fala\" title=\"눌러서 듣기\">fala</span></td><td>-a</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falamos\" title=\"눌러서 듣기\">falamos</span></td><td>-amos</td></tr><tr><td>vocês, eles, elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falam\" title=\"눌러서 듣기\">falam</span></td><td>-am</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>2인칭 단수 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"tu falas\" title=\"눌러서 듣기\">tu falas</span>는 제한적으로만 쓰이고, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vós falais\" title=\"눌러서 듣기\">vós falais</span>는 거의 쓰이지 않습니다. 말할 때는 3인칭 형태(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"você fala\" title=\"눌러서 듣기\">você fala</span>)를 2인칭 대신 씁니다.</div><div class=\"note warn\"><b class=\"lab\">원포인트</b>이 현재형은 '지금 ~하는 중이다'(나는 말하고 있다)로는 쓰지 않습니다. 진행 중인 동작은 3과의 진행형(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estar + -ando\" title=\"눌러서 듣기\">estar + -ando</span>)으로 말해요.</div><h3>9. 주어 인칭대명사 (Subject pronouns)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>단수</th><th>뜻</th><th>복수</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eu\" title=\"눌러서 듣기\">eu</span></td><td>나</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span></td><td>우리</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"você\" title=\"눌러서 듣기\">você</span></td><td>너, 당신 (격식 없는 2인칭)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"vocês\" title=\"눌러서 듣기\">vocês</span></td><td>너희들, 여러분</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ele\" title=\"눌러서 듣기\">ele</span></td><td>그</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"eles\" title=\"눌러서 듣기\">eles</span></td><td>그들 (남성·혼성)</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"ela\" title=\"눌러서 듣기\">ela</span></td><td>그녀</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"elas\" title=\"눌러서 듣기\">elas</span></td><td>그녀들</td></tr></tbody></table></div><ul class=\"rules\"><li>'그것'은 보통 주어를 생략합니다. 명사를 가리킬 때는 성에 따라 ele/ela를 쓸 수 있어요.</li><li>동사 어미로 주어가 분명하면 대명사를 생략할 수 있습니다. 하지만 스페인어보다 대명사를 더 자주 씁니다. 같은 주어의 다음 동사 앞에서는 보통 반복하지 않아요.</li></ul><h3>10. estudar (공부하다) 변화</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>estudar</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudo\" title=\"눌러서 듣기\">estudo</span></td><td>나는 공부한다</td></tr><tr><td>você</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estuda\" title=\"눌러서 듣기\">estuda</span></td><td>너는 공부한다</td></tr><tr><td>ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estuda\" title=\"눌러서 듣기\">estuda</span></td><td>그(녀)는 공부한다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudamos\" title=\"눌러서 듣기\">estudamos</span></td><td>우리는 공부한다</td></tr><tr><td>vocês</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudam\" title=\"눌러서 듣기\">estudam</span></td><td>너희는 공부한다</td></tr><tr><td>eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estudam\" title=\"눌러서 듣기\">estudam</span></td><td>그(녀)들은 공부한다</td></tr></tbody></table></div><h3>11. 불규칙 동사 estar (있다, ~이다)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>estar</th><th>뜻</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estou\" title=\"눌러서 듣기\">estou</span></td><td>나는 있다</td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"está\" title=\"눌러서 듣기\">está</span></td><td>그는 있다</td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estamos\" title=\"눌러서 듣기\">estamos</span></td><td>우리는 있다</td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estão\" title=\"눌러서 듣기\">estão</span></td><td>그들은 있다</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"estar\" title=\"눌러서 듣기\">estar</span>는 위치나 일시적인 상태를 말할 때 써요. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Eu estou em casa.\" title=\"눌러서 듣기\">Eu estou em casa.</span> / <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"O trem está lá atrás.\" title=\"눌러서 듣기\">O trem está lá atrás.</span></div><h3>12. -r, -z, -s로 끝나는 명사의 복수형</h3><p>-r, -z, 그리고 <b>강세 모음 뒤의 -s</b>로 끝나는 명사는 <b>-es</b>를 붙입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>단수</th><th>복수</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o professor\" title=\"눌러서 듣기\">o professor</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os professores\" title=\"눌러서 듣기\">os professores</span></td><td>선생님</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a flor\" title=\"눌러서 듣기\">a flor</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as flores\" title=\"눌러서 듣기\">as flores</span></td><td>꽃</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o português\" title=\"눌러서 듣기\">o português</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os portugueses\" title=\"눌러서 듣기\">os portugueses</span></td><td>포르투갈 사람</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a voz\" title=\"눌러서 듣기\">a voz</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"as vozes\" title=\"눌러서 듣기\">as vozes</span></td><td>목소리</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"o rapaz\" title=\"눌러서 듣기\">o rapaz</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"os rapazes\" title=\"눌러서 듣기\">os rapazes</span></td><td>청년</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" dat
