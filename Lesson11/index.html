과거, 부사절의 접속법"}, {"slug": "Lesson26", "short": "26과", "ko": "haver 동사, 미래 표현, 조건법, 미래·조건법과 대명사 위치"}, {"slug": "Lesson27", "short": "27과", "ko": "-duzir 동사, 완료 시제(ter + 과거분사), se 뒤의 동사 형태"}, {"slug": "Lesson28", "short": "28과", "ko": "-ear 동사, -uir/-oer 동사, 완료 시제의 대명사 위치, 관계대명사, 관계절의 접속법"}, {"slug": "Lesson29", "short": "29과", "ko": "관계부사 뒤 접속법, talvez 뒤 접속법, 간접 명령, \"~든 간에\" 표현, 지소사와 확대사"}, {"slug": "Appendix", "short": "부록", "ko": "부록 — 동사 변화표와 불규칙 동사 (§145–175)"}];window.LESSON={"id": 11, "slug": "Lesson11", "label": "Lesson XI", "pt": "Poder, futuro com presente e pronomes me/nos", "ko": "poder, 현재형으로 미래 말하기, 1인칭 목적어 대명사와 위치", "en": "poder · simple present for the future · me/nos · placing object pronouns", "part": "Part 2 · 핵심 동사와 과거 (Lesson VII–XIV)", "verb": true, "theory": "<p class=\"tip\">🔊 포르투갈어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 한국어 뜻을 가리고 연습할 수도 있어요.</p><h2>이 단원의 핵심</h2><p><b>poder(~할 수 있다)</b> 와 단순과거, 구어에서 미래를 현재형으로 말하는 법, 그리고 '나를/나에게, 우리를/우리에게'를 뜻하는 목적어 대명사 <b>me, nos</b>의 위치를 배웁니다.</p><h3>57. 불규칙 동사 poder (현재·단순과거)</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>주어</th><th>현재</th><th>단순과거</th></tr></thead><tbody><tr><td>eu</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"posso\" title=\"눌러서 듣기\">posso</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pude\" title=\"눌러서 듣기\">pude</span></td></tr><tr><td>você / ele / ela</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pode\" title=\"눌러서 듣기\">pode</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôde\" title=\"눌러서 듣기\">pôde</span></td></tr><tr><td>nós</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"podemos\" title=\"눌러서 듣기\">podemos</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pudemos\" title=\"눌러서 듣기\">pudemos</span></td></tr><tr><td>vocês / eles / elas</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"podem\" title=\"눌러서 듣기\">podem</span></td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"puderam\" title=\"눌러서 듣기\">puderam</span></td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b>현재 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pode\" title=\"눌러서 듣기\">pode</span>[ó]와 단순과거 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pôde\" title=\"눌러서 듣기\">pôde</span>[ô]는 모음 소리와 악센트로 구별합니다. 그러나 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"podemos\" title=\"눌러서 듣기\">podemos</span>와 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"pudemos\" title=\"눌러서 듣기\">pudemos</span>는 같게 발음해요. poder 뒤에도 <b>전치사 없이 동사원형</b>이 옵니다.</div><h3>58. poder의 단순과거 쓰임</h3><p>단순과거로 쓰면 <b>그 순간의 가능성</b>, 곧 '(해 보니) 할 수 있었다/없었다'라는 시도의 성공·실패를 나타냅니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu quis entrar, mas não pude abrir a porta.\" title=\"눌러서 듣기\">Eu quis entrar, mas não pude abrir a porta.</span><span class=\"k\">들어가려 했지만 문을 열 수 없었다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Eu pude ir na semana passada, mas nesta semana não posso.\" title=\"눌러서 듣기\">Eu pude ir na semana passada, mas nesta semana não posso.</span><span class=\"k\">지난주엔 갈 수 있었지만 이번 주엔 못 가요.</span></li></ul><h3>59. 현재형으로 미래 말하기</h3><p>구어에서는 <b>ir + 원형</b> 말고도 <b>단순 현재형</b>으로 미래를 말하는 일이 많습니다. 미래를 나타내는 부사('내일' 등)가 있거나 문맥상 분명할 때 충분해요. 진짜 미래형(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"falarei\" title=\"눌러서 듣기\">falarei</span> 등)은 대화에서 거의 쓰지 않습니다.</p><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Amanhã eu falo com o professor.\" title=\"눌러서 듣기\">Amanhã eu falo com o professor.</span><span class=\"k\">내일 선생님과 이야기할게요.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele parte amanhã.\" title=\"눌러서 듣기\">Ele parte amanhã.</span><span class=\"k\">그는 내일 떠난다.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"João não fez o trabalho, mas eu faço.\" title=\"눌러서 듣기\">João não fez o trabalho, mas eu faço.</span><span class=\"k\">조앙은 안 했지만 내가 할게요.</span></li></ul><div class=\"note warn\"><b class=\"lab\">원포인트</b>영어와 달리 미래를 <b>현재진행형으로 말하지 않습니다.</b> 진행형은 지금 하고 있는 일에만 씁니다. <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"...mas eu estou fazendo.\" title=\"눌러서 듣기\">...mas eu estou fazendo.</span> = 하지만 나는 (지금) 하는 중이다.</div><h3>60. 1인칭 목적어 대명사</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th></th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"me\" title=\"눌러서 듣기\">me</span></td><td>나를 / 나에게 / 나 자신을</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nos\" title=\"눌러서 듣기\">nos</span></td><td>우리를 / 우리에게 / 우리 자신을</td></tr></tbody></table></div><div class=\"note warn\"><b class=\"lab\">원포인트</b><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nos\" title=\"눌러서 듣기\">nos</span>(우리를)와 <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"nós\" title=\"눌러서 듣기\">nós</span>(우리는, 주어)를 혼동하지 마세요.</div><h3>61. 목적어 대명사의 위치</h3><p>구어에서 쓰면서 문어에서도 통하는 기본 규칙입니다.</p><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>상황</th><th>위치</th><th>예</th></tr></thead><tbody><tr><td>a. 한 단어 동사</td><td>동사 앞 (문장 첫머리가 되면 안 됨)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele me deu um livro.\" title=\"눌러서 듣기\">Ele me deu um livro.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Deu-me um livro.\" title=\"눌러서 듣기\">Deu-me um livro.</span></td></tr><tr><td>b. 부정어·관계대명사·종속접속사·부사·주어가 앞에 있을 때</td><td>동사 앞</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Não nos deu trabalho.\" title=\"눌러서 듣기\">Não nos deu trabalho.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Sempre nos dão café.\" title=\"눌러서 듣기\">Sempre nos dão café.</span></td></tr><tr><td>c. 조동사 + 원형, estar + -ndo</td><td>두 번째 동사 앞</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele está me escrevendo.\" title=\"눌러서 듣기\">Ele está me escrevendo.</span> <span class=\"slash\">/</span> <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"João não quer me dar o livro.\" title=\"눌러서 듣기\">João não quer me dar o livro.</span></td></tr><tr><td>d. 원형(전치사 뒤)</td><td>원형 앞(구어) 또는 뒤(문어)</td><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele correu para me pegar.\" title=\"눌러서 듣기\">Ele correu para me pegar.</span></td></tr></tbody></table></div><ul class=\"rules\"><li>대명사가 동사 <b>뒤</b>에 올 때는 <b>하이픈(-)</b> 으로 연결합니다: <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Deu-me um livro.\" title=\"눌러서 듣기\">Deu-me um livro.</span>, <span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Pegar-me é o que ele quer.\" title=\"눌러서 듣기\">Pegar-me é o que ele quer.</span></li><li>문장 첫머리에 대명사가 놓이는 것은 피합니다. 대신 주어 대명사를 먼저 쓰거나(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Ele me deu\" title=\"눌러서 듣기\">Ele me deu</span>) 대명사를 동사 뒤로 보내요(<span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"Deu-me\" title=\"눌러서 듣기\">Deu-me</span>).</li></ul><ul class=\"exs\"><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Você não pode me pegar.\" title=\"눌러서 듣기\">Você não pode me pegar.</span><span class=\"k\">나를 잡을 수 없어.</span></li><li><span class=\"pt big\" role=\"button\" tabindex=\"0\" data-say=\"Ele me conheceu quando me achou.\" title=\"눌러서 듣기\">Ele me conheceu quando me achou.</span><span class=\"k\">그는 나를 찾았을 때 나를 알아보았다.</span></li></ul><h3>62. 이 과의 어휘</h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>포르투갈어</th><th>뜻</th></tr></thead><tbody><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a sala de aula\" title=\"눌러서 듣기\">a sala de aula</span></td><td>교실</td></tr><tr><td><span class=\"pt\" role=\"button\" tabindex=\"0\" data-say=\"a turma\" title=\"눌러
